          package com.mamad396.builderessentials.listeners

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Particle
          import org.bukkit.event.EventHandler
          import org.bukkit.event.Listener
          import org.bukkit.event.player.PlayerMoveEvent
          import org.bukkit.scheduler.BukkitRunnable

          class GridListener(private val plugin: BuilderEssentials) : Listener {
              private val activeGrids = HashMap<java.util.UUID, BukkitRunnable>()
              
              @EventHandler
              fun onMove(event: PlayerMoveEvent) {
                  val player = event.player
                  val hasGrid = plugin.gridToggled.getOrDefault(player.uniqueId, false)
                  val isSnapping = plugin.snapGrid.getOrDefault(player.uniqueId, false)
                  
                  if (isSnapping && (event.from.blockX != event.to?.blockX ?: event.from.blockX || 
                                     event.from.blockZ != event.to?.blockZ ?: event.from.blockZ)) {
                      val gridSize = plugin.gridSize.getOrDefault(player.uniqueId, 16)
                      val snappedX = (player.location.blockX / gridSize) * gridSize + gridSize / 2
                      val snappedZ = (player.location.blockZ / gridSize) * gridSize + gridSize / 2
                      val newLoc = player.location.clone()
                      newLoc.x = snappedX + 0.5
                      newLoc.z = snappedZ + 0.5
                      player.teleport(newLoc)
                  }
                  
                  if (hasGrid) {
                      activeGrids[player.uniqueId]?.cancel()
                      val task = object : BukkitRunnable() {
                          override fun run() {
                              if (!player.isOnline) { cancel(); return }
                              val gridSize = plugin.gridSize.getOrDefault(player.uniqueId, 16)
                              val centerX = (player.location.blockX / gridSize) * gridSize
                              val centerZ = (player.location.blockZ / gridSize) * gridSize
                              for (x in -2..2) for (z in -2..2) {
                                  val px = (centerX + x * gridSize + gridSize / 2 + 0.5).toDouble()
                                  val pz = (centerZ + z * gridSize + gridSize / 2 + 0.5).toDouble()
                                  player.world.spawnParticle(Particle.END_ROD, px, player.location.y, pz, 1, 0.0, 0.0, 0.0, 0.0)
                              }
                          }
                      }
                      task.runTaskTimer(plugin, 0L, 20L)
                      activeGrids[player.uniqueId] = task
                  } else {
                      activeGrids[player.uniqueId]?.cancel()
                      activeGrids.remove(player.uniqueId)
                  }
              }
          }
