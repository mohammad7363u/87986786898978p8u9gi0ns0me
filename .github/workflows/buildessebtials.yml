          # 11. GridListener
          cat > src/main/java/com/mamad396/builderessentials/listeners/GridListener.java << 'EOF'
          package com.mamad396.builderessentials.listeners;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Particle;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.player.PlayerMoveEvent;
          import org.bukkit.scheduler.BukkitRunnable;
          import java.util.*;

          public class GridListener implements Listener {
              private final BuilderEssentials plugin;
              private final Map<UUID, BukkitRunnable> activeGrids = new HashMap<>();
              
              public GridListener(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              @EventHandler
              public void onPlayerMove(PlayerMoveEvent event) {
                  if (!plugin.gridToggled.getOrDefault(event.getPlayer().getUniqueId(), false)) {
                      stopGrid(event.getPlayer().getUniqueId());
                      return;
                  }
                  
                  if (activeGrids.containsKey(event.getPlayer().getUniqueId())) return;
                  
                  startGrid(event.getPlayer().getUniqueId());
              }
              
              private void startGrid(UUID uuid) {
                  BukkitRunnable task = new BukkitRunnable() {
                      @Override
                      public void run() {
                          org.bukkit.entity.Player player = 
                              org.bukkit.Bukkit.getPlayer(uuid);
                          if (player == null || !player.isOnline()) {
                              cancel();
                              return;
                          }
                          
                          int gridSize = plugin.gridSize.getOrDefault(uuid, 16);
                          int centerX = (player.getLocation().getBlockX() / gridSize) * gridSize;
                          int centerZ = (player.getLocation().getBlockZ() / gridSize) * gridSize;
                          
                          for (int x = -2; x <= 2; x++) {
                              for (int z = -2; z <= 2; z++) {
                                  double px = centerX + x * gridSize + gridSize / 2.0 + 0.5;
                                  double pz = centerZ + z * gridSize + gridSize / 2.0 + 0.5;
                                  player.getWorld().spawnParticle(Particle.END_ROD, 
                                      px, player.getLocation().getY() + 0.1, pz,
                                      1, 0, 0, 0, 0);
                              }
                          }
                      }
                  };
                  task.runTaskTimer(plugin, 0L, 20L);
                  activeGrids.put(uuid, task);
              }
              
              private void stopGrid(UUID uuid) {
                  BukkitRunnable task = activeGrids.remove(uuid);
                  if (task != null) task.cancel();
              }
          }
          EOF

