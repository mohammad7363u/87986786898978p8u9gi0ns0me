name: Build BuilderEssentials

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Create project structure
        run: |
          mkdir -p src/main/kotlin/com/mamad396/builderessentials/commands
          mkdir -p src/main/kotlin/com/mamad396/builderessentials/listeners
          mkdir -p src/main/kotlin/com/mamad396/builderessentials/shapes
          mkdir -p src/main/resources
          mkdir -p releases

      - name: Create plugin.yml
        run: |
          cat > src/main/resources/plugin.yml << 'PLUGINEOF'
          name: BuilderEssentials
          version: 1.0.0
          main: com.mamad396.builderessentials.BuilderEssentials
          api-version: '1.21'
          author: mamad396
          description: 70+ professional building tools
          softdepend: [FastAsyncWorldEdit]
          
          commands:
            builder:
              description: Main builder command
              aliases: [be, buildertools, bt]
            wand:
              description: Get selection wand
            fill:
              description: Fill tools menu
              aliases: [filler, paint]
            shapes:
              description: Shape generator
              aliases: [gen, generate]
            terrain:
              description: Terrain tools
              aliases: [terra, land]
            tree:
              description: Tree generator
            schematic:
              description: Schematic manager
              aliases: [schem, blueprint]
            undo:
              description: Undo last action
            redo:
              description: Redo action
            palette:
              description: Block palette manager
              aliases: [colors, blocks]
            brush:
              description: Brush settings
              aliases: [br]
            grid:
              description: Build grid system
            measure:
              description: Measure distance tool
          PLUGINEOF

      - name: Create config.yml
        run: |
          cat > src/main/resources/config.yml << 'CONFIGEOF'
          config-version: 1.0.0
          prefix: "<dark_gray>[<gold>🏗️</gold>]</dark_gray> <gray>"
          max-undo-history: 50
          max-blocks-per-action: 100000

          tools:
            snowball-filler:
              enabled: true
              max-distance: 50
            egg-filler:
              enabled: true
            arrow-placer:
              enabled: true
            ender-pearl-fill:
              enabled: true
              radius: 3
            trident-builder:
              enabled: true
            selection-wand:
              enabled: true
            paint-wand:
              enabled: true
            fast-break:
              enabled: true
            vein-miner:
              enabled: true
              max-vein: 64
            brush-size:
              min: 1
              max: 20
              default: 3
            torus:
              minor-radius: 3
            measure-tool:
              enabled: true
          CONFIGEOF

      - name: Create main plugin class
        run: |
          cat > src/main/kotlin/com/mamad396/builderessentials/BuilderEssentials.kt << 'MAINEOF'
          package com.mamad396.builderessentials

          import com.mamad396.builderessentials.commands.*
          import com.mamad396.builderessentials.listeners.*
          import com.mamad396.builderessentials.shapes.ShapeGenerator
          import net.kyori.adventure.text.minimessage.MiniMessage
          import org.bukkit.Location
          import org.bukkit.Material
          import org.bukkit.block.data.BlockData
          import org.bukkit.plugin.java.JavaPlugin
          import java.io.File
          import java.util.Stack
          import java.util.UUID
          import java.util.concurrent.ConcurrentHashMap

          class BuilderEssentials : JavaPlugin() {
              companion object {
                  lateinit var instance: BuilderEssentials
                      private set
              }

              val mm: MiniMessage = MiniMessage.miniMessage()
              
              val wandPos1: ConcurrentHashMap<UUID, Location> = ConcurrentHashMap()
              val wandPos2: ConcurrentHashMap<UUID, Location> = ConcurrentHashMap()
              val brushSize: ConcurrentHashMap<UUID, Int> = ConcurrentHashMap()
              val brushMaterial: ConcurrentHashMap<UUID, Material> = ConcurrentHashMap()
              val undoHistory: ConcurrentHashMap<UUID, Stack<HashMap<Location, BlockData>>> = ConcurrentHashMap()
              val redoHistory: ConcurrentHashMap<UUID, Stack<HashMap<Location, BlockData>>> = ConcurrentHashMap()
              val palettes: ConcurrentHashMap<UUID, HashMap<String, ArrayList<Material>>> = ConcurrentHashMap()
              val gridToggled: ConcurrentHashMap<UUID, Boolean> = ConcurrentHashMap()
              val snapGrid: ConcurrentHashMap<UUID, Boolean> = ConcurrentHashMap()
              val gridSize: ConcurrentHashMap<UUID, Int> = ConcurrentHashMap()

              override fun onEnable() {
                  instance = this
                  saveDefaultConfig()
                  
                  registerCommands()
                  registerListeners()
                  
                  logger.info("🏗️ BuilderEssentials v1.0.0 enabled successfully!")
                  logger.info("   Tools: 70+ building features")
                  logger.info("   Author: mamad396")
              }

              override fun onDisable() {
                  saveAllData()
                  logger.info("BuilderEssentials disabled. Data saved!")
              }

              private fun registerCommands() {
                  getCommand("builder")?.setExecutor(MainCommand(this))
                  getCommand("wand")?.setExecutor(WandCommand(this))
                  getCommand("fill")?.setExecutor(FillCommand(this))
                  getCommand("shapes")?.setExecutor(ShapeCommand(this))
                  getCommand("terrain")?.setExecutor(TerrainCommand(this))
                  getCommand("tree")?.setExecutor(TreeCommand(this))
                  getCommand("schematic")?.setExecutor(SchematicCommand(this))
                  getCommand("undo")?.setExecutor(UndoCommand(this))
                  getCommand("redo")?.setExecutor(RedoCommand(this))
                  getCommand("palette")?.setExecutor(PaletteCommand(this))
                  getCommand("brush")?.setExecutor(BrushCommand(this))
                  getCommand("grid")?.setExecutor(GridCommand(this))
                  getCommand("measure")?.setExecutor(MeasureCommand(this))
              }

              private fun registerListeners() {
                  val pm = server.pluginManager
                  if (config.getBoolean("tools.snowball-filler.enabled", true)) pm.registerEvents(SnowballListener(this), this)
                  if (config.getBoolean("tools.egg-filler.enabled", true)) pm.registerEvents(EggListener(this), this)
                  if (config.getBoolean("tools.arrow-placer.enabled", true)) pm.registerEvents(ArrowListener(this), this)
                  if (config.getBoolean("tools.ender-pearl-fill.enabled", true)) pm.registerEvents(PearlListener(this), this)
                  if (config.getBoolean("tools.trident-builder.enabled", true)) pm.registerEvents(TridentListener(this), this)
                  if (config.getBoolean("tools.selection-wand.enabled", true)) pm.registerEvents(WandListener(this), this)
                  if (config.getBoolean("tools.paint-wand.enabled", true)) pm.registerEvents(PaintListener(this), this)
                  if (config.getBoolean("tools.fast-break.enabled", true)) pm.registerEvents(FastBreakListener(this), this)
                  if (config.getBoolean("tools.vein-miner.enabled", true)) pm.registerEvents(VeinMinerListener(this), this)
                  if (config.getBoolean("tools.measure-tool.enabled", true)) pm.registerEvents(MeasureListener(this), this)
                  pm.registerEvents(GridListener(this), this)
              }

              private fun saveAllData() {
                  val dataFolder = File(dataFolder, "data")
                  if (!dataFolder.exists()) dataFolder.mkdirs()
                  
                  palettes.forEach { (uuid, playerPalettes) ->
                      val file = File(dataFolder, "$uuid-palettes.yml")
                      val config = org.bukkit.configuration.file.YamlConfiguration()
                      playerPalettes.forEach { (name, mats) ->
                          config.set(name, mats.map { it.name })
                      }
                      config.save(file)
                  }
              }

              fun addUndo(uuid: UUID, blocks: HashMap<Location, BlockData>) {
                  val stack = undoHistory.getOrPut(uuid) { Stack() }
                  stack.push(blocks)
                  if (stack.size > config.getInt("max-undo-history", 50)) {
                      stack.removeAt(0)
                  }
                  redoHistory[uuid]?.clear()
              }
          }
          MAINEOF

      - name: Create command classes
        run: |
          cat > src/main/kotlin/com/mamad396/builderessentials/commands/MainCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import org.bukkit.inventory.ItemStack

          class MainCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (args.isEmpty() || args[0].equals("help", true)) {
                      sendHelp(sender)
                      return true
                  }
                  
                  when (args[0].lowercase()) {
                      "tools" -> {
                          if (sender is Player) {
                              giveTools(sender)
                          } else {
                              sender.sendMessage("Player only!")
                          }
                      }
                      "reload" -> {
                          if (sender.hasPermission("builder.admin")) {
                              plugin.reloadConfig()
                              sender.sendMessage(plugin.mm.deserialize("<green>✅ Config reloaded!</green>"))
                          } else {
                              sender.sendMessage(plugin.mm.deserialize("<red>❌ No permission!</red>"))
                          }
                      }
                      else -> sendHelp(sender)
                  }
                  return true
              }
              
              private fun sendHelp(sender: CommandSender) {
                  sender.sendMessage(plugin.mm.deserialize("<gold><bold>🏗️ BuilderEssentials v1.0.0</bold></gold>"))
                  sender.sendMessage(plugin.mm.deserialize("<gray>70+ Professional Building Tools</gray>"))
                  sender.sendMessage("")
                  sender.sendMessage(plugin.mm.deserialize("<yellow><bold>Commands:</bold></yellow>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/builder tools</white><gray> - Get all building tools</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/wand</white><gray> - Get selection wand</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/fill</white><gray> - Filler tools (snowball, egg, arrow, pearl, trident)</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/shapes <type> <radius></white><gray> - Generate shapes</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/terrain <type></white><gray> - Terrain tools</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/tree <type></white><gray> - Tree generator</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/schematic <save/load/list></white><gray> - Schematic manager</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/undo</white><gray> / <white>/redo</white><gray> - Undo/Redo actions</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/palette <save/load/list></white><gray> - Block palettes</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/brush <size/material></white><gray> - Brush settings</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/grid <on/off/snap/size></white><gray> - Grid system</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<white>/measure</white><gray> - Distance tool (use compass)</gray>"))
                  sender.sendMessage("")
                  sender.sendMessage(plugin.mm.deserialize("<yellow><bold>🎯 Quick Start:</bold></yellow>"))
                  sender.sendMessage(plugin.mm.deserialize("<gray>1. Get tools: </gray><white>/builder tools</white>"))
                  sender.sendMessage(plugin.mm.deserialize("<gray>2. Select area: Right/Left click with </gray><white>Wooden Axe</white>"))
                  sender.sendMessage(plugin.mm.deserialize("<gray>3. Throw </gray><white>Snowball</white><gray> to build trails!</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<gray>4. Use </gray><white>Blaze Rod</white><gray> to paint spheres!</gray>"))
                  sender.sendMessage(plugin.mm.deserialize("<gray>5. Type </gray><white>/shapes sphere 5</white><gray> to generate!</gray>"))
              }
              
              private fun giveTools(player: Player) {
                  val tools = listOf(
                      Pair(Material.WOODEN_AXE, "<gold>🪄 Selection Wand</gold>"),
                      Pair(Material.BLAZE_ROD, "<gold>🖌️ Paint Wand</gold>"),
                      Pair(Material.SNOWBALL, "<white>❄️ Snowball Filler</white>"),
                      Pair(Material.EGG, "<white>🥚 Egg Placer</white>"),
                      Pair(Material.ENDER_PEARL, "<dark_purple>💜 Pearl Filler</dark_purple>"),
                      Pair(Material.TRIDENT, "<aqua>🔱 Trident Builder</aqua>"),
                      Pair(Material.COMPASS, "<aqua>📏 Measure Tool</aqua>")
                  )
                  
                  tools.forEach { (material, displayName) ->
                      val item = if (material == Material.SNOWBALL || material == Material.EGG || material == Material.ENDER_PEARL) {
                          ItemStack(material, 16)
                      } else {
                          ItemStack(material)
                      }
                      val meta = item.itemMeta
                      meta.displayName(plugin.mm.deserialize(displayName))
                      item.itemMeta = meta
                      player.inventory.addItem(item)
                  }
                  
                  player.inventory.addItem(ItemStack(Material.BOW))
                  player.inventory.addItem(ItemStack(Material.ARROW, 64))
                  
                  player.sendMessage(plugin.mm.deserialize("<green>✅ All 7 builder tools added to your inventory!</green>"))
                  player.sendMessage(plugin.mm.deserialize("<gray>Use </gray><white>/builder help</white><gray> for command list</gray>"))
              }
          }
          EOF

          cat > src/main/kotlin/com/mamad396/builderessentials/commands/WandCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import org.bukkit.inventory.ItemStack

          class WandCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) {
                      sender.sendMessage("Player only!")
                      return true
                  }
                  
                  val wand = ItemStack(Material.WOODEN_AXE)
                  val meta = wand.itemMeta
                  meta.displayName(plugin.mm.deserialize("<gold><bold>🪄 Builder Wand</bold></gold>"))
                  meta.lore(listOf(
                      plugin.mm.deserialize("<gray>Left click block: Set position 1</gray>"),
                      plugin.mm.deserialize("<gray>Right click block: Set position 2</gray>"),
                      plugin.mm.deserialize("<yellow>Select an area, then use shapes!</yellow>")
                  ))
                  meta.isUnbreakable = true
                  wand.itemMeta = meta
                  
                  sender.inventory.addItem(wand)
                  sender.sendMessage(plugin.mm.deserialize("<green>✅ Selection wand added!</green>"))
                  sender.sendMessage(plugin.mm.deserialize("<gray>Left click: Pos1 | Right click: Pos2</gray>"))
                  return true
              }
          }
          EOF

          cat > src/main/kotlin/com/mamad396/builderessentials/commands/FillCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import org.bukkit.inventory.ItemStack

          class FillCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) {
                      sender.sendMessage("Player only!")
                      return true
                  }
                  
                  if (args.isEmpty() || args[0].equals("help", true)) {
                      sender.sendMessage(plugin.mm.deserialize("<gold><bold>❄️ Filler Tools</bold></gold>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/fill snowball</white><gray> - Trail builder (throw to build)</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/fill egg</white><gray> - Point filler (throw to place)</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/fill arrow</white><gray> - Arrow placer (shoot to place)</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/fill pearl</white><gray> - Area filler (teleport to fill)</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/fill trident</white><gray> - Line builder (throw trident)</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/fill all</white><gray> - Get all fillers</gray>"))
                      sender.sendMessage("")
                      sender.sendMessage(plugin.mm.deserialize("<yellow>💡 Hold block in offhand to choose material!</yellow>"))
                      return true
                  }
                  
                  when (args[0].lowercase()) {
                      "snowball" -> giveItem(sender, Material.SNOWBALL, 16, "❄️ Snowball Filler")
                      "egg" -> giveItem(sender, Material.EGG, 16, "🥚 Egg Placer")
                      "arrow" -> {
                          giveItem(sender, Material.BOW, 1, "🏹 Arrow Placer")
                          sender.inventory.addItem(ItemStack(Material.ARROW, 64))
                      }
                      "pearl" -> giveItem(sender, Material.ENDER_PEARL, 16, "💜 Pearl Filler")
                      "trident" -> giveItem(sender, Material.TRIDENT, 1, "🔱 Trident Builder")
                      "all" -> {
                          sender.inventory.addItem(ItemStack(Material.SNOWBALL, 16))
                          sender.inventory.addItem(ItemStack(Material.EGG, 16))
                          sender.inventory.addItem(ItemStack(Material.ENDER_PEARL, 16))
                          sender.inventory.addItem(ItemStack(Material.TRIDENT))
                          sender.inventory.addItem(ItemStack(Material.BOW))
                          sender.inventory.addItem(ItemStack(Material.ARROW, 64))
                          sender.sendMessage(plugin.mm.deserialize("<green>✅ All filler tools added!</green>"))
                      }
                      else -> sender.sendMessage(plugin.mm.deserialize("<red>Unknown filler type!</red>"))
                  }
                  return true
              }
              
              private fun giveItem(player: Player, material: Material, amount: Int, name: String) {
                  val item = ItemStack(material, amount)
                  val meta = item.itemMeta
                  meta.displayName(plugin.mm.deserialize("<white>$name</white>"))
                  item.itemMeta = meta
                  player.inventory.addItem(item)
                  player.sendMessage(plugin.mm.deserialize("<green>✅ $name added!</green>"))
              }
          }
          EOF

          cat > src/main/kotlin/com/mamad396/builderessentials/commands/ShapeCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import com.mamad396.builderessentials.shapes.ShapeGenerator
          import org.bukkit.Material
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player

          class ShapeCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              private val shapeGen = ShapeGenerator(plugin)
              
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) {
                      sender.sendMessage("Player only!")
                      return true
                  }
                  
                  if (args.isEmpty() || args[0].equals("help", true)) {
                      sender.sendMessage(plugin.mm.deserialize("<gold><bold>📐 Shape Generator</bold></gold>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>circle</white><gray> - 2D circle</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>sphere</white><gray> - 3D ball</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>cube</white><gray> - Box</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>cylinder</white><gray> - Tube</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>pyramid</white><gray> - Pyramid</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>cone</white><gray> - Cone</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>dome</white><gray> - Half sphere</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>torus</white><gray> - Donut</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>spiral</white><gray> - Spiral tower</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>staircase</white><gray> - Stairs</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<gray>Usage: </gray><white>/shapes sphere 5</white>"))
                      sender.sendMessage(plugin.mm.deserialize("<gray>Add 'hollow': </gray><white>/shapes sphere 5 hollow</white>"))
                      return true
                  }
                  
                  val shape = args[0].lowercase()
                  val radius = args.getOrNull(1)?.toIntOrNull() ?: 5
                  val height = args.getOrNull(2)?.toIntOrNull() ?: 5
                  val hollow = args.any { it.equals("hollow", true) }
                  
                  val center = sender.location
                  val material = plugin.brushMaterial[sender.uniqueId] 
                      ?: sender.inventory.itemInMainHand.type.takeIf { it.isBlock } 
                      ?: Material.STONE
                  
                  try {
                      when (shape) {
                          "circle" -> shapeGen.generateCircle(sender, center, radius, material, hollow)
                          "sphere" -> shapeGen.generateSphere(sender, center, radius, material, hollow)
                          "cube" -> shapeGen.generateCube(sender, center, radius, material, hollow)
                          "cylinder" -> shapeGen.generateCylinder(sender, center, radius, height, material, hollow)
                          "pyramid" -> shapeGen.generatePyramid(sender, center, radius, material)
                          "cone" -> shapeGen.generateCone(sender, center, radius, height, material)
                          "dome" -> shapeGen.generateDome(sender, center, radius, material)
                          "torus" -> shapeGen.generateTorus(sender, center, radius, material)
                          "spiral" -> shapeGen.generateSpiral(sender, center, radius, height, material)
                          "staircase" -> shapeGen.generateStaircase(sender, center, radius, height, material)
                          else -> sender.sendMessage(plugin.mm.deserialize("<red>Unknown shape! Use /shapes help</red>"))
                      }
                  } catch (e: Exception) {
                      sender.sendMessage(plugin.mm.deserialize("<red>Error generating shape!</red>"))
                      plugin.logger.warning("Shape error: ${e.message}")
                  }
                  return true
              }
          }
          EOF

          cat > src/main/kotlin/com/mamad396/builderessentials/commands/TerrainCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Location
          import org.bukkit.Material
          import org.bukkit.block.data.BlockData
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import kotlin.random.Random

          class TerrainCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) {
                      sender.sendMessage("Player only!")
                      return true
                  }
                  
                  if (args.isEmpty() || args[0].equals("help", true)) {
                      sender.sendMessage(plugin.mm.deserialize("<gold><bold>🏔️ Terrain Tools</bold></gold>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/terrain height <amount></white><gray> - Raise/lower ground</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/terrain flat</white><gray> - Flatten area</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/terrain noise <scale></white><gray> - Natural terrain</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/terrain erosion <strength></white><gray> - Erode blocks</gray>"))
                      return true
                  }
                  
                  val radius = plugin.brushSize.getOrDefault(sender.uniqueId, 5)
                  val center = sender.location
                  val undoMap = HashMap<Location, BlockData>()
                  
                  try {
                      when (args[0].lowercase()) {
                          "height" -> {
                              val amount = args.getOrNull(1)?.toIntOrNull() ?: 1
                              for (x in -radius..radius) for (z in -radius..radius) {
                                  if (x * x + z * z <= radius * radius) {
                                      for (y in -Math.abs(amount)..Math.abs(amount)) {
                                          val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                                          if (amount > 0 && loc.block.type == Material.AIR) {
                                              undoMap[loc.clone()] = loc.block.blockData
                                              loc.block.type = Material.GRASS_BLOCK
                                          }
                                      }
                                  }
                              }
                          }
                          "flat" -> {
                              val targetY = center.blockY
                              for (x in -radius..radius) for (z in -radius..radius) {
                                  if (x * x + z * z <= radius * radius) {
                                      val loc = center.clone().add(x.toDouble(), 0.0, z.toDouble())
                                      val highest = loc.world?.getHighestBlockAt(loc) ?: continue
                                      val highestY = highest.y
                                      if (highestY != targetY) {
                                          undoMap[highest.location.clone()] = highest.blockData
                                          highest.type = Material.GRASS_BLOCK
                                      }
                                  }
                              }
                          }
                          "noise" -> {
                              val scale = args.getOrNull(1)?.toDoubleOrNull() ?: 0.1
                              for (x in -radius..radius) for (z in -radius..radius) {
                                  if (x * x + z * z <= radius * radius) {
                                      val noise = Math.sin(x * scale) * Math.cos(z * scale) * 5
                                      val loc = center.clone().add(x.toDouble(), noise, z.toDouble())
                                      if (loc.block.type == Material.AIR) {
                                          undoMap[loc.clone()] = loc.block.blockData
                                          loc.block.type = Material.STONE
                                      }
                                  }
                              }
                          }
                          "erosion" -> {
                              val strength = args.getOrNull(1)?.toDoubleOrNull() ?: 0.3
                              for (x in -radius..radius) for (z in -radius..radius) {
                                  if (x * x + z * z <= radius * radius && Random.nextDouble() < strength) {
                                      val loc = center.clone().add(x.toDouble(), -1.0, z.toDouble())
                                      val block = loc.block
                                      if (block.type != Material.AIR && block.type != Material.BEDROCK) {
                                          undoMap[loc.clone()] = block.blockData
                                          block.type = Material.AIR
                                      }
                                  }
                              }
                          }
                          else -> {
                              sender.sendMessage(plugin.mm.deserialize("<red>Unknown terrain type!</red>"))
                              return true
                          }
                      }
                      
                      if (undoMap.isNotEmpty()) {
                          plugin.addUndo(sender.uniqueId, undoMap)
                          sender.sendMessage(plugin.mm.deserialize("<green>✅ Terrain modified! (${undoMap.size} blocks)</green>"))
                      } else {
                          sender.sendMessage(plugin.mm.deserialize("<yellow>No blocks changed.</yellow>"))
                      }
                  } catch (e: Exception) {
                      sender.sendMessage(plugin.mm.deserialize("<red>Terrain error!</red>"))
                      plugin.logger.warning("Terrain error: ${e.message}")
                  }
                  return true
              }
          }
