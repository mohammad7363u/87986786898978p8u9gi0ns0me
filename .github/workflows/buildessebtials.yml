                          ))
                          player.sendMessage(plugin.mm.deserialize(
                              "<gray>X: $dx | Y: $dy | Z: $dz | Vol: ${dx * dy * dz}</gray>"
                          ))
                          event.isCancelled = true
                      }
                      else -> {}
                  }
              }
