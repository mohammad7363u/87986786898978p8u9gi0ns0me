          cat > src/main/kotlin/com/mamad396/builderessentials/commands/SchematicCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import java.io.File

          class SchematicCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              private val schemFolder = File(plugin.dataFolder, "schematics")
              
              init {
                  schemFolder.mkdirs()
              }
              
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) {
                      sender.sendMessage("Player only!")
                      return true
                  }
                  
                  if (args.isEmpty()) {
                      sender.sendMessage(plugin.mm.deserialize(
                          """
                          <gold><bold>📋 Schematic Manager</bold></gold>
                          
                          <white>/schematic save <name></white> <gray>- Save selected area</gray>
                          <white>/schematic load <name></white> <gray>- Load schematic</gray>
                          <white>/schematic list</white> <gray>- List all schematics</gray>
                          <white>/schematic delete <name></white> <gray>- Delete schematic</gray>
                          
                          <yellow><bold>💡 Tip:</bold></yellow> <gray>Use wand to select area first!</gray>
                          """.trimIndent()
                      ))
                      return true
                  }
                  
                  when (args[0].lowercase()) {
                      "save" -> {
                          if (args.size < 2) {
                              sender.sendMessage(plugin.mm.deserialize("<red>Usage: /schematic save <name></red>"))
                              return true
                          }
                          val pos1 = plugin.wandPos1[sender.uniqueId]
                          val pos2 = plugin.wandPos2[sender.uniqueId]
                          if (pos1 == null || pos2 == null) {
                              sender.sendMessage(plugin.mm.deserialize("<red>Select an area with wand first!</red>"))
                              return true
                          }
                          saveSchematic(sender, args[1], pos1, pos2)
                      }
                      "load" -> {
                          if (args.size < 2) {
                              sender.sendMessage(plugin.mm.deserialize("<red>Usage: /schematic load <name></red>"))
                              return true
                          }
                          loadSchematic(sender, args[1])
                      }
                      "list" -> listSchematics(sender)
                      "delete" -> {
                          if (args.size < 2) {
                              sender.sendMessage(plugin.mm.deserialize("<red>Usage: /schematic delete <name></red>"))
                              return true
                          }
                          deleteSchematic(sender, args[1])
                      }
                  }
                  return true
              }
              
              private fun saveSchematic(player: Player, name: String, pos1: org.bukkit.Location, pos2: org.bukkit.Location) {
                  val file = File(schemFolder, "$name.schem")
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  try {
                      val minX = minOf(pos1.blockX, pos2.blockX)
                      val maxX = maxOf(pos1.blockX, pos2.blockX)
                      val minY = minOf(pos1.blockY, pos2.blockY)
                      val maxY = maxOf(pos1.blockY, pos2.blockY)
                      val minZ = minOf(pos1.blockZ, pos2.blockZ)
                      val maxZ = maxOf(pos1.blockZ, pos2.blockZ)
                      
                      // Save as simple text format
                      file.bufferedWriter().use { writer ->
                          writer.write("${maxX - minX + 1},${maxY - minY + 1},${maxZ - minZ + 1}\n")
                          for (x in minX..maxX) {
                              for (y in minY..maxY) {
                                  for (z in minZ..maxZ) {
                                      val loc = org.bukkit.Location(pos1.world, x.toDouble(), y.toDouble(), z.toDouble())
                                      val block = loc.block
                                      if (block.type != org.bukkit.Material.AIR) {
                                          writer.write("${x - minX},${y - minY},${z - minZ}:${block.type.name}\n")
                                      }
                                  }
                              }
                          }
                      }
                      
                      player.sendMessage(plugin.mm.deserialize("<green>✅ Schematic saved: $name</green>"))
                  } catch (e: Exception) {
                      player.sendMessage(plugin.mm.deserialize("<red>Failed to save schematic!</red>"))
                  }
              }
              
              private fun loadSchematic(player: Player, name: String) {
                  val file = File(schemFolder, "$name.schem")
                  if (!file.exists()) {
                      player.sendMessage(plugin.mm.deserialize("<red>Schematic not found!</red>"))
                      return
                  }
                  
                  try {
                      val lines = file.readLines()
                      val dimensions = lines[0].split(",").map { it.toInt() }
                      val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                      val startLoc = player.location
                      
                      for (i in 1 until lines.size) {
                          val parts = lines[i].split(":")
                          val coords = parts[0].split(",").map { it.toInt() }
                          val material = org.bukkit.Material.valueOf(parts[1])
                          
                          val loc = startLoc.clone().add(coords[0].toDouble(), coords[1].toDouble(), coords[2].toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                      
                      plugin.addUndo(player.uniqueId, undoMap)
                      player.sendMessage(plugin.mm.deserialize("<green>✅ Schematic loaded: $name (${undoMap.size} blocks)</green>"))
                  } catch (e: Exception) {
                      player.sendMessage(plugin.mm.deserialize("<red>Failed to load schematic!</red>"))
                  }
              }
              
              private fun listSchematics(player: Player) {
                  val files = schemFolder.listFiles { _, name -> name.endsWith(".schem") }
                  if (files.isNullOrEmpty()) {
                      player.sendMessage(plugin.mm.deserialize("<gray>No schematics saved yet!</gray>"))
                      return
                  }
                  
                  player.sendMessage(plugin.mm.deserialize("<gold><bold>📋 Saved Schematics:</bold></gold>"))
                  files.forEach { file ->
                      player.sendMessage(plugin.mm.deserialize("<white>• ${file.nameWithoutExtension}</white> <gray>(${file.length() / 1024} KB)</gray>"))
                  }
              }
              
              private fun deleteSchematic(player: Player, name: String) {
                  val file = File(schemFolder, "$name.schem")
                  if (!file.exists()) {
                      player.sendMessage(plugin.mm.deserialize("<red>Schematic not found!</red>"))
                      return
                  }
                  
                  file.delete()
                  player.sendMessage(plugin.mm.deserialize("<green>✅ Schematic deleted: $name</green>"))
              }
          }
