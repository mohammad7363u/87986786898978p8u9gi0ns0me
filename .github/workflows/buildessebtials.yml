          # 6. WandListener - Selection wand
          cat > src/main/java/com/mamad396/builderessentials/listeners/WandListener.java << 'EOF'
          package com.mamad396.builderessentials.listeners;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Material;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.block.Action;
          import org.bukkit.event.player.PlayerInteractEvent;

          public class WandListener implements Listener {
              private final BuilderEssentials plugin;
              
              public WandListener(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              @EventHandler
              public void onWandUse(PlayerInteractEvent event) {
                  if (event.getItem() == null) return;
                  if (event.getItem().getType() != Material.WOODEN_AXE) return;
                  if (!plugin.getConfig().getBoolean("tools.selection-wand.enabled", true)) return;
                  if (event.getClickedBlock() == null) return;
                  
                  event.setCancelled(true);
                  
                  if (event.getAction() == Action.LEFT_CLICK_BLOCK) {
                      plugin.wandPos1.put(event.getPlayer().getUniqueId(), 
                          event.getClickedBlock().getLocation().clone());
                      plugin.sendMessage(event.getPlayer(), 
                          "&a📍 &7Position &e1 &7set! (&f" + 
                          event.getClickedBlock().getX() + "&7, &f" + 
                          event.getClickedBlock().getY() + "&7, &f" + 
                          event.getClickedBlock().getZ() + "&7)");
                      plugin.playSound(event.getPlayer(), "success");
                      
                  } else if (event.getAction() == Action.RIGHT_CLICK_BLOCK) {
                      plugin.wandPos2.put(event.getPlayer().getUniqueId(), 
                          event.getClickedBlock().getLocation().clone());
                      plugin.sendMessage(event.getPlayer(), 
                          "&a📍 &7Position &e2 &7set! (&f" + 
                          event.getClickedBlock().getX() + "&7, &f" + 
                          event.getClickedBlock().getY() + "&7, &f" + 
                          event.getClickedBlock().getZ() + "&7)");
                      plugin.playSound(event.getPlayer(), "success");
                      
                      // Calculate and show volume
                      org.bukkit.Location pos1 = plugin.wandPos1.get(event.getPlayer().getUniqueId());
                      org.bukkit.Location pos2 = plugin.wandPos2.get(event.getPlayer().getUniqueId());
                      if (pos1 != null && pos2 != null) {
                          int dx = Math.abs(pos2.getBlockX() - pos1.getBlockX()) + 1;
                          int dy = Math.abs(pos2.getBlockY() - pos1.getBlockY()) + 1;
                          int dz = Math.abs(pos2.getBlockZ() - pos1.getBlockZ()) + 1;
                          int volume = dx * dy * dz;
                          plugin.sendMessage(event.getPlayer(), 
