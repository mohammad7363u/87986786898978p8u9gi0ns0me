          package com.mamad396.builderessentials.listeners;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.Particle;
          import org.bukkit.Sound;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.entity.Player;
          import org.bukkit.entity.Snowball;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.entity.ProjectileHitEvent;
          import org.bukkit.util.Vector;
          import java.util.*;

          public class SnowballListener implements Listener {
              private final BuilderEssentials plugin;
              
              public SnowballListener(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              @EventHandler
              public void onSnowballHit(ProjectileHitEvent event) {
                  if (!(event.getEntity() instanceof Snowball)) return;
                  if (!plugin.getConfig().getBoolean("tools.snowball-filler.enabled", true)) return;
                  
                  Snowball snowball = (Snowball) event.getEntity();
                  if (!(snowball.getShooter() instanceof Player)) return;
                  
                  Player player = (Player) snowball.getShooter();
                  if (!plugin.hasToolPermission(player, "snowball-filler")) return;
                  if (!plugin.checkCooldown(player.getUniqueId())) {
                      plugin.sendMessage(player, "&cPlease wait before using again!");
                      return;
                  }
                  
                  Material material = plugin.getBrushMaterial(player.getUniqueId());
                  if (!material.isBlock()) material = Material.STONE;
                  
                  Location startLoc = player.getEyeLocation().clone();
                  Location endLoc = snowball.getLocation().clone();
                  Vector direction = endLoc.toVector().subtract(startLoc.toVector()).normalize();
                  
                  double distance = startLoc.distance(endLoc);
                  int maxDistance = plugin.getConfig().getInt("tools.snowball-filler.max-distance", 50);
                  int blocksToPlace = (int) Math.min(distance, maxDistance);
                  
                  Map<Location, BlockData> undoMap = new LinkedHashMap<>();
                  Location current = startLoc.clone();
                  
                  for (int i = 0; i < blocksToPlace; i++) {
                      current.add(direction);
                      Location blockLoc = current.clone();
                      
                      if (blockLoc.getBlock().getType().isEmpty() || 
                          blockLoc.getBlock().isLiquid()) {
                          undoMap.put(blockLoc.clone(), blockLoc.getBlock().getBlockData().clone());
                          blockLoc.getBlock().setType(material, false);
                          
                          if (i % 3 == 0) {
                              player.getWorld().spawnParticle(Particle.SNOWFLAKE,
                                  blockLoc.clone().add(0.5, 0.5, 0.5),
                                  2, 0.1, 0.1, 0.1, 0);
                          }
                      }
                  }
                  
                  if (!undoMap.isEmpty()) {
                      plugin.addUndo(player.getUniqueId(), undoMap);
                      plugin.sendMessage(player, "&a❄️ Placed &e" + undoMap.size() + " &ablocks!");
                      plugin.playSound(player, "fill");
                  }
                  
                  snowball.remove();
              }
          }
