name: Build BuilderEssentials v3.0 - Part 1

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Create directory structure
        run: |
          mkdir -p src/main/java/com/mamad396/builderessentials/commands
          mkdir -p src/main/java/com/mamad396/builderessentials/listeners
          mkdir -p src/main/java/com/mamad396/builderessentials/shapes
          mkdir -p src/main/java/com/mamad396/builderessentials/utils
          mkdir -p src/main/java/com/mamad396/builderessentials/data
          mkdir -p src/main/resources
          mkdir -p releases

      - name: Create plugin.yml
        run: |
          cat > src/main/resources/plugin.yml << 'EOF'
          name: BuilderEssentials
          version: 3.0.0
          main: com.mamad396.builderessentials.BuilderEssentials
          api-version: '1.20'
          author: mamad396
          description: GOD MODE Building Plugin - 70+ Professional Tools
          softdepend: [FastAsyncWorldEdit]
          
          commands:
            be:
              description: Main builder menu
              aliases: [builder, buildertools, bt, bmenu]
            wand:
              description: Get selection wand
              aliases: [selwand, selecttool]
            fill:
              description: Projectile filler tools
              aliases: [filler, spray, paintgun]
            shapes:
              description: Shape generator
              aliases: [gen, generate, shapegen, sg]
            terrain:
              description: Terrain manipulation tools
              aliases: [terra, land, ground, tm]
            tree:
              description: Tree generator
              aliases: [treegen, planttree, grow]
            schematic:
              description: Schematic file manager
              aliases: [schem, blueprint, bp, saveschem]
            undo:
              description: Undo last building action
              aliases: [back, revert, rollback]
            redo:
              description: Redo last undone action
              aliases: [forward, reapply, redoaction]
            palette:
              description: Block color palette manager
              aliases: [colors, blockswatch, swatch, blockpalette]
            brush:
              description: Paint brush settings
              aliases: [br, brushsize, paintbrush, brushtool]
            grid:
              description: Visual build grid overlay
              aliases: [snap, guide, gridlines, buildgrid]
            measure:
              description: Distance measurement tool
              aliases: [distance, ruler, tape, measuretool, mt]
            copy:
              description: Copy selected region to clipboard
              aliases: [copyregion, copysel, cp]
            paste:
              description: Paste clipboard at location
              aliases: [pasteregion, pastesel, pt]
            cut:
              description: Cut selected region to clipboard
              aliases: [cutregion, cutsel, ct]
            rotate:
              description: Rotate clipboard (90/180/270 degrees)
              aliases: [rot, turn, rotclip]
            flip:
              description: Flip clipboard on axis (x/y/z)
              aliases: [mirror, reflect, flipclip]
            stack:
              description: Stack clipboard multiple times
              aliases: [repeat, duplicate, multiply, stackclip]
            mask:
              description: Set replacement mask for paste
              aliases: [filtermode, replacemask, pastemask]
            drain:
              description: Remove nearby water and lava
              aliases: [dry, empty, removeliquid, drainliquid]
            preview:
              description: Toggle particle block preview
              aliases: [outline, ghost, showpreview, previewmode]
            replace:
              description: Replace blocks in selected region
              aliases: [swap, change, convert, replaceblocks]
            walls:
              description: Generate walls from selection
              aliases: [wall, buildwall, fenceregion]
            hollow:
              description: Hollow out a solid structure
              aliases: [emptyinside, shell, hollowout]
            smooth:
              description: Smooth rough terrain
              aliases: [blend, soften, smoothterrain]
            naturalize:
              description: Add grass/dirt layer to surface
              aliases: [nature, grassify, natural, naturize]
            beadmin:
              description: Admin settings for BuilderEssentials
              aliases: [bea, beadminmenu]
              permission: builder.admin
          EOF

      - name: Create config.yml
        run: |
          cat > src/main/resources/config.yml << 'EOF'
          # ╔══════════════════════════════════════════════════════════╗
          # ║        BuilderEssentials v3.0 - GOD MODE Config         ║
          # ║           Better than Essentials™ for Building          ║
          # ╚══════════════════════════════════════════════════════════╝

          config-version: 3.0.0
          
          # Plugin messaging prefix
          prefix: "&8&l[&6&l🏗️&8&l] &7"
          
          # ═══════════════════════════════════════════
          # PERFORMANCE SETTINGS
          # ═══════════════════════════════════════════
          performance:
            # Process blocks asynchronously (prevents lag)
            async-processing: true
            # Blocks placed per batch tick
            batch-size: 500
            # Maximum blocks processed per server tick
            max-blocks-per-tick: 1000
            # Number of parallel processing threads
            parallel-threads: 4
          
          # ═══════════════════════════════════════════
          # LIMITS & RESTRICTIONS
          # ═══════════════════════════════════════════
          limits:
            # Maximum blocks per single action
            max-blocks-per-action: 100000
            # Maximum shape/brush radius
            max-radius: 100
            # Cooldown between actions (milliseconds)
            cooldown-ms: 500
            # Daily block placement limit per player (0 = unlimited)
            per-player-daily-limit: 500000
          
          # ═══════════════════════════════════════════
          # DATABASE SETTINGS
          # ═══════════════════════════════════════════
          database:
            type: sqlite
            auto-save: true
            save-interval-seconds: 300
          
          # ═══════════════════════════════════════════
          # PREVIEW SYSTEM
          # ═══════════════════════════════════════════
          preview:
            enabled: true
            # Particle type for block preview
            particle: ELECTRIC_SPARK
            # Density of preview particles (0.1 - 1.0)
            density: 0.3
            # How long preview particles last (ticks)
            duration-ticks: 100
          
          # ═══════════════════════════════════════════
          # SOUND EFFECTS
          # ═══════════════════════════════════════════
          sounds:
            success: BLOCK_NOTE_BLOCK_CHIME
            error: BLOCK_NOTE_BLOCK_BASS
            complete: ENTITY_PLAYER_LEVELUP
            undo: BLOCK_NOTE_BLOCK_HAT
            redo: BLOCK_NOTE_BLOCK_HAT
            paint: BLOCK_STONE_PLACE
            fill: BLOCK_SNOW_PLACE
            drain: BUCKET_EMPTY
          
          # ═══════════════════════════════════════════
          # UNDO SYSTEM
          # ═══════════════════════════════════════════
          undo:
            # Maximum actions stored per player
            max-history: 50
            # Clear redo history on new action
            clear-redo-on-action: true
          
          # ═══════════════════════════════════════════
          # TOOL CONFIGURATIONS
          # ═══════════════════════════════════════════
          tools:
            # ❄️ SNOWBALL FILLER
            snowball-filler:
              enabled: true
              permission: builder.filler.snowball
              max-distance: 50
              particle-trail: true
              default: true
            
            # 🥚 EGG FILLER
            egg-filler:
              enabled: true
              permission: builder.filler.egg
              default: true
            
            # 🏹 ARROW PLACER
            arrow-placer:
              enabled: true
              permission: builder.filler.arrow
              default: true
            
            # 💜 ENDER PEARL FILLER
            ender-pearl-fill:
              enabled: true
              permission: builder.filler.pearl
              radius: 3
              default: true
            
            # 🔱 TRIDENT BUILDER
            trident-builder:
              enabled: true
              permission: builder.filler.trident
              line-width: 1
              default: true
            
            # 🪄 SELECTION WAND
            selection-wand:
              enabled: true
              permission: builder.wand
              item: WOODEN_AXE
              left-click-action: SET_POS1
              right-click-action: SET_POS2
              default: true
            
            # 🖌️ PAINT WAND
            paint-wand:
              enabled: true
              permission: builder.paint
              item: BLAZE_ROD
              default: true
            
            # ⚡ FAST BREAK
            fast-break:
              enabled: true
              permission: builder.fastbreak
              break-radius: 1
              require-creative: true
              default: true
            
            # ⛏️ VEIN MINER
            vein-miner:
              enabled: true
              permission: builder.veinminer
              max-vein: 64
              require-sneak: true
              default: true
            
            # 📏 MEASURE TOOL
            measure-tool:
              enabled: true
              permission: builder.measure
              item: COMPASS
              show-volume: true
              show-dimensions: true
              default: true
            
            # 🖌️ BRUSH SETTINGS
            brush-size:
              min: 1
              max: 20
              default: 3
            
            # 🍩 TORUS SETTINGS
            torus:
              minor-radius: 3
          
          # ═══════════════════════════════════════════
          # PERMISSION NODES
          # ═══════════════════════════════════════════
          permissions:
            admin: builder.admin
            default: builder.use
            vip: builder.vip
            premium: builder.premium
            unlimited: builder.unlimited
          
          # ═══════════════════════════════════════════
          # LOAD MESSAGE (shown on server start)
          # ═══════════════════════════════════════════
          load-message:
            - "&6╔══════════════════════════════════════╗"
            - "&6║ &e&l🏗️ BuilderEssentials v3.0 🏗️ &6║"
            - "&6║ &7GOD MODE - Better than Essentials &6║"
            - "&6║ &7Made by &fmamad396 &7with &c❤️ &6║"
            - "&6║ &a⚡ Async &7| &a🎨 Preview &7| &a🔄 Edit &6║"
            - "&6║ &e/be help &7- Show all commands &6║"
            - "&6╚══════════════════════════════════════╝"
          EOF

      - name: Create pom.xml
        run: |
          cat > pom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              
              <groupId>com.mamad396</groupId>
              <artifactId>BuilderEssentials</artifactId>
              <version>3.0.0</version>
              <packaging>jar</packaging>
              
              <name>BuilderEssentials</name>
              <description>GOD MODE Building Plugin - 70+ Professional Tools</description>
              <url>https://github.com/mamad396/BuilderEssentials</url>
              
              <properties>
                  <java.version>17</java.version>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
                  <maven.compiler.source>17</maven.compiler.source>
                  <maven.compiler.target>17</maven.compiler.target>
              </properties>
              
              <repositories>
                  <!-- PaperMC Repository -->
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>
              
              <dependencies>
                  <!-- Paper API -->
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.20.4-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
                  
                  <!-- SQLite JDBC Driver -->
                  <dependency>
                      <groupId>org.xerial</groupId>
                      <artifactId>sqlite-jdbc</artifactId>
                      <version>3.42.0.0</version>
                  </dependency>
              </dependencies>
              
              <build>
                  <finalName>${project.artifactId}-${project.version}</finalName>
                  <plugins>
                      <!-- Maven Compiler Plugin -->
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <source>17</source>
                              <target>17</target>
                              <compilerArgs>
                                  <arg>-Xlint:none</arg>
                              </compilerArgs>
                          </configuration>
                      </plugin>
                      
                      <!-- Maven Shade Plugin (for SQLite bundled) -->
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-shade-plugin</artifactId>
                          <version>3.5.1</version>
                          <executions>
                              <execution>
                                  <phase>package</phase>
                                  <goals>
                                      <goal>shade</goal>
                                  </goals>
                                  <configuration>
                                      <createDependencyReducedPom>false</createDependencyReducedPom>
                                  </configuration>
                              </execution>
                          </executions>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

      - name: Build
        run: mvn clean package -B -q

      - name: Copy and push
        run: |
          mkdir -p releases
          cp target/BuilderEssentials-3.0.0.jar releases/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add releases/BuilderEssentials-3.0.0.jar
          git commit -m "Part 1: Base structure" || echo "no changes"
          git push origin main --force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuilderEssentials-Part1
          path: target/BuilderEssentials-3.0.0.jar

      - name: Part 2 - Create main class
        run: |
          cat > src/main/java/com/mamad396/builderessentials/BuilderEssentials.java << 'EOF'
          package com.mamad396.builderessentials;

          import com.mamad396.builderessentials.commands.*;
          import com.mamad396.builderessentials.listeners.*;
          import com.mamad396.builderessentials.utils.AsyncBlockPlacer;
          import com.mamad396.builderessentials.data.DatabaseManager;
          import org.bukkit.Bukkit;
          import org.bukkit.ChatColor;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.Sound;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.entity.Player;
          import org.bukkit.plugin.java.JavaPlugin;
          import java.util.*;
          import java.util.concurrent.ConcurrentHashMap;

          public class BuilderEssentials extends JavaPlugin {
              
              private static BuilderEssentials instance;
              
              // Position selection maps
              public final Map<UUID, Location> wandPos1 = new ConcurrentHashMap<>();
              public final Map<UUID, Location> wandPos2 = new ConcurrentHashMap<>();
              
              // Brush settings
              public final Map<UUID, Integer> brushSize = new ConcurrentHashMap<>();
              public final Map<UUID, Material> brushMaterial = new ConcurrentHashMap<>();
              
              // Undo/Redo history
              public final Map<UUID, Stack<Map<Location, BlockData>>> undoHistory = new ConcurrentHashMap<>();
              public final Map<UUID, Stack<Map<Location, BlockData>>> redoHistory = new ConcurrentHashMap<>();
              
              // Palette storage
              public final Map<UUID, Map<String, List<Material>>> palettes = new ConcurrentHashMap<>();
              
              // Grid system
              public final Map<UUID, Boolean> gridToggled = new ConcurrentHashMap<>();
              public final Map<UUID, Boolean> snapGrid = new ConcurrentHashMap<>();
              public final Map<UUID, Integer> gridSize = new ConcurrentHashMap<>();
              
              // Preview mode
              public final Map<UUID, Boolean> previewEnabled = new ConcurrentHashMap<>();
              
              // Clipboard for copy/paste
              public final Map<UUID, Map<Location, BlockData>> clipboard = new ConcurrentHashMap<>();
              public final Map<UUID, Location> clipboardOrigin = new ConcurrentHashMap<>();
              
              // Cooldown
              public final Map<UUID, Long> lastAction = new ConcurrentHashMap<>();
              
              // Mask for paste
              public final Map<UUID, Material> maskMaterial = new ConcurrentHashMap<>();
              
              // Daily block counter
              public final Map<UUID, Integer> dailyBlockCount = new ConcurrentHashMap<>();
              
              // Managers
              public DatabaseManager databaseManager;
              public AsyncBlockPlacer asyncPlacer;
              
              @Override
              public void onEnable() {
                  instance = this;
                  saveDefaultConfig();
                  
                  // Initialize managers
                  this.databaseManager = new DatabaseManager(this);
                  this.asyncPlacer = new AsyncBlockPlacer(this);
                  
                  // Register all commands
                  registerAllCommands();
                  
                  // Register all listeners
                  registerAllListeners();
                  
                  // Start auto-save task
                  startAutoSaveTask();
                  
                  // Print startup banner
                  printStartupBanner();
                  
                  getLogger().info("§a✅ BuilderEssentials v3.0 GOD MODE enabled successfully!");
              }
              
              @Override
              public void onDisable() {
                  // Save all data
                  saveAllData();
                  
                  // Shutdown services
                  if (asyncPlacer != null) {
                      asyncPlacer.shutdown();
                  }
                  if (databaseManager != null) {
                      databaseManager.closeConnection();
                  }
                  
                  getLogger().info("§cBuilderEssentials v3.0 disabled. Goodbye!");
              }
              
              private void registerAllCommands() {
                  getCommand("be").setExecutor(new MainCommand(this));
                  getCommand("wand").setExecutor(new WandCommand(this));
                  getCommand("fill").setExecutor(new FillCommand(this));
                  getCommand("shapes").setExecutor(new ShapeCommand(this));
                  getCommand("terrain").setExecutor(new TerrainCommand(this));
                  getCommand("tree").setExecutor(new TreeCommand(this));
                  getCommand("schematic").setExecutor(new SchematicCommand(this));
                  getCommand("undo").setExecutor(new UndoCommand(this));
                  getCommand("redo").setExecutor(new RedoCommand(this));
                  getCommand("palette").setExecutor(new PaletteCommand(this));
                  getCommand("brush").setExecutor(new BrushCommand(this));
                  getCommand("grid").setExecutor(new GridCommand(this));
                  getCommand("measure").setExecutor(new MeasureCommand(this));
                  getCommand("copy").setExecutor(new CopyCommand(this));
                  getCommand("paste").setExecutor(new PasteCommand(this));
                  getCommand("cut").setExecutor(new CutCommand(this));
                  getCommand("rotate").setExecutor(new RotateCommand(this));
                  getCommand("flip").setExecutor(new FlipCommand(this));
                  getCommand("stack").setExecutor(new StackCommand(this));
                  getCommand("mask").setExecutor(new MaskCommand(this));
                  getCommand("drain").setExecutor(new DrainCommand(this));
                  getCommand("preview").setExecutor(new PreviewCommand(this));
                  getCommand("replace").setExecutor(new ReplaceCommand(this));
                  getCommand("walls").setExecutor(new WallsCommand(this));
                  getCommand("hollow").setExecutor(new HollowCommand(this));
                  getCommand("smooth").setExecutor(new SmoothCommand(this));
                  getCommand("naturalize").setExecutor(new NaturalizeCommand(this));
                  getCommand("beadmin").setExecutor(new BeAdminCommand(this));
              }
              
              private void registerAllListeners() {
                  Bukkit.getPluginManager().registerEvents(new SnowballListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new EggListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new ArrowListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new PearlListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new TridentListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new WandListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new PaintListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new FastBreakListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new VeinMinerListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new MeasureListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new GridListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new BlockPhysicsListener(this), this);
              }
              
              private void startAutoSaveTask() {
                  int interval = getConfig().getInt("database.save-interval-seconds", 300) * 20;
                  Bukkit.getScheduler().runTaskTimerAsynchronously(this, this::saveAllData, interval, interval);
              }
              
              private void printStartupBanner() {
                  for (String line : getConfig().getStringList("load-message")) {
                      getLogger().info(ChatColor.translateAlternateColorCodes('&', line));
                  }
              }
              
              private void saveAllData() {
                  if (databaseManager != null) {
                      for (Map.Entry<UUID, Map<String, List<Material>>> entry : palettes.entrySet()) {
                          for (Map.Entry<String, List<Material>> palEntry : entry.getValue().entrySet()) {
                              databaseManager.savePalette(entry.getKey(), palEntry.getKey(), palEntry.getValue());
                          }
                      }
                  }
              }
              
              /**
               * Add action to undo history
               */
              public void addUndo(UUID uuid, Map<Location, BlockData> blocks) {
                  if (blocks == null || blocks.isEmpty()) return;
                  
                  Stack<Map<Location, BlockData>> stack = undoHistory.computeIfAbsent(uuid, k -> new Stack<>());
                  stack.push(new HashMap<>(blocks));
                  
                  int maxHistory = getConfig().getInt("undo.max-history", 50);
                  while (stack.size() > maxHistory) {
                      stack.remove(0);
                  }
                  
                  if (getConfig().getBoolean("undo.clear-redo-on-action", true)) {
                      redoHistory.computeIfPresent(uuid, (k, v) -> {
                          v.clear();
                          return v;
                      });
                  }
              }
              
              /**
               * Check if player is on cooldown
               */
              public boolean checkCooldown(UUID uuid) {
                  if (uuid == null) return true;
                  
                  long now = System.currentTimeMillis();
                  long last = lastAction.getOrDefault(uuid, 0L);
                  int cooldownMs = getConfig().getInt("limits.cooldown-ms", 500);
                  
                  if (now - last < cooldownMs) {
                      return false;
                  }
                  
                  lastAction.put(uuid, now);
                  return true;
              }
              
              /**
               * Check if player has permission for tool
               */
              public boolean hasToolPermission(Player player, String toolPath) {
                  if (player == null) return false;
                  if (player.hasPermission("builder.admin") || player.hasPermission("builder.unlimited")) return true;
                  
                  String perm = getConfig().getString("tools." + toolPath + ".permission", "builder.use");
                  return player.hasPermission(perm);
              }
              
              /**
               * Play configured sound to player
               */
              public void playSound(Player player, String soundType) {
                  if (player == null) return;
                  try {
                      String soundName = getConfig().getString("sounds." + soundType, "BLOCK_NOTE_BLOCK_CHIME");
                      Sound sound = Sound.valueOf(soundName.toUpperCase());
                      player.playSound(player.getLocation(), sound, 0.5f, 1.0f);
                  } catch (Exception ignored) {
                      // Sound not found, skip
                  }
              }
              
              /**
               * Send formatted message to player
               */
              public void sendMessage(Player player, String message) {
                  if (player == null || message == null) return;
                  String prefix = getConfig().getString("prefix", "&8&l[&6&l🏗️&8&l] &7");
                  player.sendMessage(ChatColor.translateAlternateColorCodes('&', prefix + message));
              }
              
              /**
               * Get default brush size for player
               */
              public int getBrushSize(UUID uuid) {
                  return brushSize.getOrDefault(uuid, getConfig().getInt("tools.brush-size.default", 3));
              }
              
              /**
               * Get default brush material for player
               */
              public Material getBrushMaterial(UUID uuid) {
                  return brushMaterial.getOrDefault(uuid, Material.STONE);
              }
              
              /**
               * Get singleton instance
               */
              public static BuilderEssentials getInstance() {
                  return instance;
              }
          }
          EOF

      - name: Part 2 - Create DatabaseManager
        run: |
          cat > src/main/java/com/mamad396/builderessentials/data/DatabaseManager.java << 'EOF'
          package com.mamad396.builderessentials.data;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Material;
          import java.io.File;
          import java.sql.*;
          import java.util.*;

          public class DatabaseManager {
              
              private final BuilderEssentials plugin;
              private Connection connection;
              
              public DatabaseManager(BuilderEssentials plugin) {
                  this.plugin = plugin;
                  initializeDatabase();
              }
              
              private void initializeDatabase() {
                  try {
                      // Create data directory
                      File dataFolder = new File(plugin.getDataFolder(), "data");
                      if (!dataFolder.exists()) {
                          dataFolder.mkdirs();
                      }
                      
                      // Load SQLite JDBC driver
                      Class.forName("org.sqlite.JDBC");
                      
                      // Connect to database
                      String dbPath = "jdbc:sqlite:" + dataFolder.getAbsolutePath() + "/builderessentials.db";
                      connection = DriverManager.getConnection(dbPath);
                      
                      // Create tables
                      try (Statement statement = connection.createStatement()) {
                          // Palettes table
                          statement.execute(
                              "CREATE TABLE IF NOT EXISTS palettes (" +
                              "  uuid VARCHAR(36) NOT NULL," +
                              "  name VARCHAR(100) NOT NULL," +
                              "  materials TEXT NOT NULL," +
                              "  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP," +
                              "  PRIMARY KEY (uuid, name)" +
                              ")"
                          );
                          
                          // Schematics table
                          statement.execute(
                              "CREATE TABLE IF NOT EXISTS schematics (" +
                              "  id INTEGER PRIMARY KEY AUTOINCREMENT," +
                              "  name VARCHAR(255) NOT NULL UNIQUE," +
                              "  owner_uuid VARCHAR(36) NOT NULL," +
                              "  data BLOB," +
                              "  size_x INTEGER DEFAULT 0," +
                              "  size_y INTEGER DEFAULT 0," +
                              "  size_z INTEGER DEFAULT 0," +
                              "  block_count INTEGER DEFAULT 0," +
                              "  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP" +
                              ")"
                          );
                          
                          // Player statistics table
                          statement.execute(
                              "CREATE TABLE IF NOT EXISTS player_stats (" +
                              "  uuid VARCHAR(36) PRIMARY KEY," +
                              "  blocks_placed BIGINT DEFAULT 0," +
                              "  actions_performed BIGINT DEFAULT 0," +
                              "  undo_count BIGINT DEFAULT 0," +
                              "  last_active TIMESTAMP DEFAULT CURRENT_TIMESTAMP" +
                              ")"
                          );
                      }
                      
                      plugin.getLogger().info("§a💾 SQLite Database connected successfully!");
                      
                  } catch (Exception e) {
                      plugin.getLogger().severe("§cFailed to initialize database: " + e.getMessage());
                      e.printStackTrace();
                  }
              }
              
              /**
               * Save a palette to database
               */
              public void savePalette(UUID uuid, String name, List<Material> materials) {
                  if (connection == null) return;
                  
                  String sql = "INSERT OR REPLACE INTO palettes (uuid, name, materials) VALUES (?, ?, ?)";
                  
                  try (PreparedStatement ps = connection.prepareStatement(sql)) {
                      ps.setString(1, uuid.toString());
                      ps.setString(2, name.toLowerCase());
                      
                      // Convert material list to comma-separated string
                      StringBuilder sb = new StringBuilder();
                      for (Material mat : materials) {
                          if (sb.length() > 0) sb.append(",");
                          sb.append(mat.name());
                      }
                      ps.setString(3, sb.toString());
                      
                      ps.executeUpdate();
                  } catch (SQLException e) {
                      plugin.getLogger().warning("Failed to save palette '" + name + "': " + e.getMessage());
                  }
              }
              
              /**
               * Load all palettes for a player
               */
              public Map<String, List<Material>> loadPalettes(UUID uuid) {
                  Map<String, List<Material>> result = new LinkedHashMap<>();
                  
                  if (connection == null) return result;
                  
                  String sql = "SELECT name, materials FROM palettes WHERE uuid = ? ORDER BY name";
                  
                  try (PreparedStatement ps = connection.prepareStatement(sql)) {
                      ps.setString(1, uuid.toString());
                      
                      try (ResultSet rs = ps.executeQuery()) {
                          while (rs.next()) {
                              String name = rs.getString("name");
                              String materialsStr = rs.getString("materials");
                              
                              List<Material> materials = new ArrayList<>();
                              if (materialsStr != null && !materialsStr.isEmpty()) {
                                  for (String matName : materialsStr.split(",")) {
                                      try {
                                          Material mat = Material.valueOf(matName.trim().toUpperCase());
                                          materials.add(mat);
                                      } catch (IllegalArgumentException ignored) {
                                          // Skip invalid material names
                                      }
                                  }
                              }
                              
                              result.put(name, materials);
                          }
                      }
                  } catch (SQLException e) {
                      plugin.getLogger().warning("Failed to load palettes: " + e.getMessage());
                  }
                  
                  return result;
              }
              
              /**
               * Delete a palette
               */
              public void deletePalette(UUID uuid, String name) {
                  if (connection == null) return;
                  
                  String sql = "DELETE FROM palettes WHERE uuid = ? AND name = ?";
                  
                  try (PreparedStatement ps = connection.prepareStatement(sql)) {
                      ps.setString(1, uuid.toString());
                      ps.setString(2, name.toLowerCase());
                      ps.executeUpdate();
                  } catch (SQLException e) {
                      plugin.getLogger().warning("Failed to delete palette: " + e.getMessage());
                  }
              }
              
              /**
               * Update player statistics
               */
              public void updatePlayerStats(UUID uuid, int blocksPlaced, int actionsDone) {
                  if (connection == null) return;
                  
                  String sql = "INSERT INTO player_stats (uuid, blocks_placed, actions_performed, last_active) " +
                              "VALUES (?, ?, ?, CURRENT_TIMESTAMP) " +
                              "ON CONFLICT(uuid) DO UPDATE SET " +
                              "blocks_placed = blocks_placed + ?," +
                              "actions_performed = actions_performed + ?," +
                              "last_active = CURRENT_TIMESTAMP";
                              
                  try (PreparedStatement ps = connection.prepareStatement(sql)) {
                      ps.setString(1, uuid.toString());
                      ps.setInt(2, blocksPlaced);
                      ps.setInt(3, actionsDone);
                      ps.setInt(4, blocksPlaced);
                      ps.setInt(5, actionsDone);
                      ps.executeUpdate();
                  } catch (SQLException e) {
                      plugin.getLogger().warning("Failed to update stats: " + e.getMessage());
                  }
              }
              
              /**
               * Close database connection
               */
              public void closeConnection() {
                  try {
                      if (connection != null && !connection.isClosed()) {
                          connection.close();
                          plugin.getLogger().info("§7Database connection closed.");
                      }
                  } catch (SQLException e) {
                      plugin.getLogger().warning("Error closing database: " + e.getMessage());
                  }
              }
          }
