name: Build BuilderEssentials v3.0

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Create project structure
        run: |
          mkdir -p src/main/java/com/mamad396/builderessentials
          mkdir -p src/main/java/com/mamad396/builderessentials/commands
          mkdir -p src/main/java/com/mamad396/builderessentials/listeners
          mkdir -p src/main/java/com/mamad396/builderessentials/shapes
          mkdir -p src/main/java/com/mamad396/builderessentials/utils
          mkdir -p src/main/java/com/mamad396/builderessentials/data
          mkdir -p src/main/resources
          mkdir -p releases

      - name: Create plugin.yml
        run: |
          cat > src/main/resources/plugin.yml << 'PLUGINEOF'
          name: BuilderEssentials
          version: 3.0.0
          main: com.mamad396.builderessentials.BuilderEssentials
          api-version: '1.20'
          author: mamad396
          description: GOD MODE Building Plugin - Better than Essentials
          softdepend: [FastAsyncWorldEdit, Vault]
          
          commands:
            builder:
              description: Main builder command
              aliases: [be, buildertools, bt, build]
            be:
              description: BuilderEssentials main menu
              aliases: [bemenu, bessentials]
            wand:
              description: Get selection wand
            fill:
              description: Fill tools menu
              aliases: [filler, paint, spray]
            shapes:
              description: Shape generator menu
              aliases: [gen, generate, shape]
            terrain:
              description: Terrain tools
              aliases: [terra, land, ground]
            tree:
              description: Tree generator
              aliases: [treegen, plant]
            schematic:
              description: Schematic manager
              aliases: [schem, blueprint, bp]
            undo:
              description: Undo last action
              aliases: [back, revert]
            redo:
              description: Redo last undone action
              aliases: [forward, reapply]
            palette:
              description: Block palette manager
              aliases: [colors, blocks, swatch]
            brush:
              description: Brush settings
              aliases: [br, brushsize, paintbrush]
            grid:
              description: Build grid system
              aliases: [snap, guide]
            measure:
              description: Measure distance tool
              aliases: [distance, ruler, tape]
            copy:
              description: Copy selection to clipboard
            paste:
              description: Paste clipboard
            cut:
              description: Cut selection to clipboard
            rotate:
              description: Rotate clipboard (90/180/270)
              aliases: [rot, turn]
            flip:
              description: Flip clipboard (x/y/z)
              aliases: [mirror, reflect]
            stack:
              description: Stack clipboard multiple times
              aliases: [repeat, duplicate, multiply]
            mask:
              description: Set paste mask (only replace specific block)
              aliases: [filter, replacemode]
            drain:
              description: Drain nearby liquids
              aliases: [dry, empty, removewater]
            preview:
              description: Toggle particle preview mode
              aliases: [outline, ghost, showpreview]
            replace:
              description: Replace blocks in selection
              aliases: [swap, change, convert]
            walls:
              description: Build walls from selection
              aliases: [wall, fence]
            hollow:
              description: Hollow out filled shape
              aliases: [emptyinside, shell]
            smooth:
              description: Smooth terrain
              aliases: [blend, soften]
            naturalize:
              description: Naturalize surface (grass + dirt)
              aliases: [nature, grassify, natural]
          PLUGINEOF

      - name: Create config.yml
        run: |
          cat > src/main/resources/config.yml << 'CONFIGEOF'
          config-version: 3.0.0
          prefix: "&8&l[&6&l🏗️&8&l] &7"
          
          performance:
            async-processing: true
            batch-size: 500
            max-blocks-per-tick: 1000
            max-undo-history: 50
            auto-save-interval-seconds: 300
            parallel-threads: 4
          
          limits:
            max-blocks-per-action: 100000
            max-radius: 100
            cooldown-ms: 500
            per-player-daily-limit: 500000
          
          database:
            type: sqlite
            auto-save: true
            save-interval-seconds: 300
          
          preview:
            enabled: true
            particle: ELECTRIC_SPARK
            density: 0.3
            duration-ticks: 100
          
          sounds:
            success: BLOCK_NOTE_BLOCK_CHIME
            error: BLOCK_NOTE_BLOCK_BASS
            complete: ENTITY_PLAYER_LEVELUP
            undo: BLOCK_NOTE_BLOCK_HAT
            paint: BLOCK_STONE_PLACE
          
          undo:
            max-history: 50
            compress-old: true
          
          tools:
            snowball-filler:
              enabled: true
              permission: builder.filler.snowball
              max-distance: 50
              default: true
            egg-filler:
              enabled: true
              permission: builder.filler.egg
              default: true
            arrow-placer:
              enabled: true
              permission: builder.filler.arrow
              default: true
            ender-pearl-fill:
              enabled: true
              permission: builder.filler.pearl
              radius: 3
              default: true
            trident-builder:
              enabled: true
              permission: builder.filler.trident
              default: true
            selection-wand:
              enabled: true
              permission: builder.wand
              item: WOODEN_AXE
              default: true
            paint-wand:
              enabled: true
              permission: builder.paint
              item: BLAZE_ROD
              default: true
            fast-break:
              enabled: true
              permission: builder.fastbreak
              default: true
            vein-miner:
              enabled: true
              permission: builder.veinminer
              max-vein: 64
              default: true
            brush-size:
              min: 1
              max: 20
              default: 3
            torus:
              minor-radius: 3
            measure-tool:
              enabled: true
              permission: builder.measure
              item: COMPASS
              default: true
          
          permissions:
            admin: builder.admin
            default: builder.use
            vip: builder.vip
            premium: builder.premium
          CONFIGEOF

      - name: Create main class
        run: |
          cat > src/main/java/com/mamad396/builderessentials/BuilderEssentials.java << 'MAINEOF'
          package com.mamad396.builderessentials;

          import com.mamad396.builderessentials.commands.*;
          import com.mamad396.builderessentials.listeners.*;
          import com.mamad396.builderessentials.utils.*;
          import com.mamad396.builderessentials.data.*;
          import org.bukkit.Bukkit;
          import org.bukkit.ChatColor;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.Sound;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.entity.Player;
          import org.bukkit.plugin.java.JavaPlugin;
          import java.util.*;
          import java.util.concurrent.ConcurrentHashMap;

          public class BuilderEssentials extends JavaPlugin {
              
              private static BuilderEssentials instance;
              
              public final Map<UUID, Location> wandPos1 = new ConcurrentHashMap<>();
              public final Map<UUID, Location> wandPos2 = new ConcurrentHashMap<>();
              public final Map<UUID, Integer> brushSize = new ConcurrentHashMap<>();
              public final Map<UUID, Material> brushMaterial = new ConcurrentHashMap<>();
              public final Map<UUID, Stack<Map<Location, BlockData>>> undoHistory = new ConcurrentHashMap<>();
              public final Map<UUID, Stack<Map<Location, BlockData>>> redoHistory = new ConcurrentHashMap<>();
              public final Map<UUID, Map<String, List<Material>>> palettes = new ConcurrentHashMap<>();
              public final Map<UUID, Boolean> gridToggled = new ConcurrentHashMap<>();
              public final Map<UUID, Boolean> snapGrid = new ConcurrentHashMap<>();
              public final Map<UUID, Integer> gridSize = new ConcurrentHashMap<>();
              public final Map<UUID, Boolean> previewEnabled = new ConcurrentHashMap<>();
              public final Map<UUID, Map<Location, BlockData>> clipboard = new ConcurrentHashMap<>();
              public final Map<UUID, Long> lastAction = new ConcurrentHashMap<>();
              public final Map<UUID, Integer> dailyBlockCount = new ConcurrentHashMap<>();
              public final Map<UUID, Material> maskMaterial = new ConcurrentHashMap<>();
              public final Map<UUID, Location> clipboardOrigin = new ConcurrentHashMap<>();
              
              public DatabaseManager databaseManager;
              public AsyncBlockPlacer asyncPlacer;
              
              @Override
              public void onEnable() {
                  instance = this;
                  saveDefaultConfig();
                  
                  this.databaseManager = new DatabaseManager(this);
                  this.asyncPlacer = new AsyncBlockPlacer(this);
                  
                  registerAllCommands();
                  registerAllListeners();
                  startAutoTasks();
                  
                  printStartupBanner();
              }
              
              @Override
              public void onDisable() {
                  if (this.asyncPlacer != null) this.asyncPlacer.shutdown();
                  if (this.databaseManager != null) this.databaseManager.closeConnection();
                  getLogger().info("BuilderEssentials v3.0 GOD MODE disabled. Goodbye!");
              }
              
              private void registerAllCommands() {
                  MainCommand main = new MainCommand(this);
                  getCommand("builder").setExecutor(main);
                  getCommand("be").setExecutor(main);
                  getCommand("wand").setExecutor(new WandCommand(this));
                  getCommand("fill").setExecutor(new FillCommand(this));
                  getCommand("shapes").setExecutor(new ShapeCommand(this));
                  getCommand("terrain").setExecutor(new TerrainCommand(this));
                  getCommand("tree").setExecutor(new TreeCommand(this));
                  getCommand("schematic").setExecutor(new SchematicCommand(this));
                  getCommand("undo").setExecutor(new UndoCommand(this));
                  getCommand("redo").setExecutor(new RedoCommand(this));
                  getCommand("palette").setExecutor(new PaletteCommand(this));
                  getCommand("brush").setExecutor(new BrushCommand(this));
                  getCommand("grid").setExecutor(new GridCommand(this));
                  getCommand("measure").setExecutor(new MeasureCommand(this));
                  getCommand("copy").setExecutor(new CopyCommand(this));
                  getCommand("paste").setExecutor(new PasteCommand(this));
                  getCommand("cut").setExecutor(new CutCommand(this));
                  getCommand("rotate").setExecutor(new RotateCommand(this));
                  getCommand("flip").setExecutor(new FlipCommand(this));
                  getCommand("stack").setExecutor(new StackCommand(this));
                  getCommand("mask").setExecutor(new MaskCommand(this));
                  getCommand("drain").setExecutor(new DrainCommand(this));
                  getCommand("preview").setExecutor(new PreviewCommand(this));
                  getCommand("replace").setExecutor(new ReplaceCommand(this));
                  getCommand("walls").setExecutor(new WallsCommand(this));
                  getCommand("hollow").setExecutor(new HollowCommand(this));
                  getCommand("smooth").setExecutor(new SmoothCommand(this));
                  getCommand("naturalize").setExecutor(new NaturalizeCommand(this));
                  
                  getCommand("builder").setTabCompleter(main);
                  getCommand("be").setTabCompleter(main);
              }
              
              private void registerAllListeners() {
                  Bukkit.getPluginManager().registerEvents(new SnowballListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new EggListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new ArrowListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new PearlListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new TridentListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new WandListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new PaintListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new FastBreakListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new VeinMinerListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new MeasureListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new GridListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new BlockPhysicsListener(this), this);
              }
              
              private void startAutoTasks() {
                  int interval = getConfig().getInt("database.save-interval-seconds", 300) * 20;
                  Bukkit.getScheduler().runTaskTimerAsynchronously(this, () -> {
                      if (databaseManager != null) {
                          saveAllPalettes();
                      }
                  }, interval, interval);
              }
              
              private void printStartupBanner() {
                  String[] banner = {
                      "&6╔══════════════════════════════════════╗",
                      "&6║ &e&l🏗️ BuilderEssentials v3.0 🏗️ &6║",
                      "&6║ &7GOD MODE - Better than Essentials &6║",
                      "&6║ &7Made by &fmamad396 &7with &c❤️ &6║",
                      "&6║ &a⚡ Async &7| &a🎨 Preview &7| &a🔄 Edit &6║",
                      "&6║ &e/be help &7- All Commands &6║",
                      "&6╚══════════════════════════════════════╝"
                  };
                  for (String line : banner) {
                      getLogger().info(ChatColor.translateAlternateColorCodes('&', line));
                  }
              }
              
              private void saveAllPalettes() {
                  for (Map.Entry<UUID, Map<String, List<Material>>> entry : palettes.entrySet()) {
                      for (Map.Entry<String, List<Material>> palEntry : entry.getValue().entrySet()) {
                          databaseManager.savePalette(entry.getKey(), palEntry.getKey(), palEntry.getValue());
                      }
                  }
              }
              
              public void addUndo(UUID uuid, Map<Location, BlockData> blocks) {
                  Stack<Map<Location, BlockData>> stack = undoHistory.computeIfAbsent(uuid, k -> new Stack<>());
                  stack.push(new HashMap<>(blocks));
                  int max = getConfig().getInt("undo.max-history", 50);
                  while (stack.size() > max) {
                      stack.remove(0);
                  }
                  redoHistory.computeIfPresent(uuid, (k, v) -> { v.clear(); return v; });
              }
              
              public boolean checkCooldown(UUID uuid) {
                  long now = System.currentTimeMillis();
                  long last = lastAction.getOrDefault(uuid, 0L);
                  int cooldownMs = getConfig().getInt("limits.cooldown-ms", 500);
                  if (now - last < cooldownMs) return false;
                  lastAction.put(uuid, now);
                  return true;
              }
              
              public boolean hasPermission(Player player, String tool) {
                  if (player.hasPermission("builder.admin")) return true;
                  String perm = getConfig().getString("tools." + tool + ".permission", "builder.use");
                  return player.hasPermission(perm);
              }
              
              public void playSound(Player player, String soundType) {
                  try {
                      String soundName = getConfig().getString("sounds." + soundType, "BLOCK_NOTE_BLOCK_CHIME");
                      Sound sound = Sound.valueOf(soundName);
                      player.playSound(player.getLocation(), sound, 0.5f, 1.0f);
                  } catch (Exception ignored) {}
              }
              
              public void sendMessage(Player player, String path, Object... args) {
                  String msg = getMessage(path);
                  if (args.length > 0) msg = String.format(msg, args);
                  player.sendMessage(msg);
              }
              
              public String getMessage(String path) {
                  String prefix = getConfig().getString("prefix", "&8&l[&6&l🏗️&8&l] &7");
                  String msg = getConfig().getString(path, "");
                  return ChatColor.translateAlternateColorCodes('&', prefix + msg);
              }
              
              public static BuilderEssentials getInstance() {
                  return instance;
              }
          }
          MAINEOF

      - name: Create AsyncBlockPlacer
        run: |
          cat > src/main/java/com/mamad396/builderessentials/utils/AsyncBlockPlacer.java << 'EOF'
          package com.mamad396.builderessentials.utils;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Bukkit;
          import org.bukkit.Location;
          import org.bukkit.World;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.scheduler.BukkitRunnable;
          import java.util.*;
          import java.util.concurrent.*;

          public class AsyncBlockPlacer {
              
              private final BuilderEssentials plugin;
              private final ExecutorService executor;
              private final Map<UUID, Queue<PlaceTask>> queues = new ConcurrentHashMap<>();
              private final Map<UUID, BukkitRunnable> processors = new ConcurrentHashMap<>();
              private final Set<UUID> processing = ConcurrentHashMap.newKeySet();
              
              public AsyncBlockPlacer(BuilderEssentials plugin) {
                  this.plugin = plugin;
                  int threads = plugin.getConfig().getInt("performance.parallel-threads", 4);
                  this.executor = Executors.newFixedThreadPool(threads);
              }
              
              public void queuePlacement(UUID uuid, Map<Location, BlockData> blocks, Runnable onComplete) {
                  if (blocks == null || blocks.isEmpty()) {
                      if (onComplete != null) onComplete.run();
                      return;
                  }
                  
                  Queue<PlaceTask> queue = queues.computeIfAbsent(uuid, k -> new ConcurrentLinkedQueue<>());
                  queue.add(new PlaceTask(new HashMap<>(blocks), onComplete));
                  
                  if (!processing.contains(uuid)) {
                      processing.add(uuid);
                      processNext(uuid);
                  }
              }
              
              private void processNext(UUID uuid) {
                  Queue<PlaceTask> queue = queues.get(uuid);
                  if (queue == null || queue.isEmpty()) {
                      processing.remove(uuid);
                      return;
                  }
                  
                  PlaceTask task = queue.poll();
                  if (task == null) {
                      processing.remove(uuid);
                      return;
                  }
                  
                  int batchSize = plugin.getConfig().getInt("performance.batch-size", 500);
                  Map<Location, BlockData> batch = new LinkedHashMap<>();
                  World world = null;
                  
                  for (Map.Entry<Location, BlockData> entry : task.blocks.entrySet()) {
                      if (world == null && entry.getKey().getWorld() != null) {
                          world = entry.getKey().getWorld();
                      }
                      batch.put(entry.getKey(), entry.getValue());
                      if (batch.size() >= batchSize) break;
                  }
                  
                  if (world == null || batch.isEmpty()) {
                      processNext(uuid);
                      return;
                  }
                  
                  final World finalWorld = world;
                  executor.submit(() -> {
                      Map<Location, BlockData> preparedBatch = new HashMap<>(batch);
                      
                      Bukkit.getScheduler().runTask(plugin, () -> {
                          for (Map.Entry<Location, BlockData> entry : preparedBatch.entrySet()) {
                              try {
                                  Location loc = entry.getKey();
                                  if (loc.getWorld() == null) loc.setWorld(finalWorld);
                                  loc.getBlock().setBlockData(entry.getValue(), false);
                              } catch (Exception ignored) {}
                          }
                          
                          if (task.blocks.size() > batchSize) {
                              task.blocks.keySet().removeAll(batch.keySet());
                              Queue<PlaceTask> q = queues.get(uuid);
                              if (q != null) {
                                  List<PlaceTask> remaining = new ArrayList<>(q);
                                  q.clear();
                                  q.add(task);
                                  q.addAll(remaining);
                              }
                          }
                          
                          if (onComplete != null && task.blocks.size() <= batchSize) {
                              onComplete.run();
                          }
                          
                          Bukkit.getScheduler().runTaskLater(plugin, () -> processNext(uuid), 1L);
                      });
                  });
              }
              
              public void shutdown() {
                  executor.shutdown();
                  try {
                      if (!executor.awaitTermination(5, TimeUnit.SECONDS)) {
                          executor.shutdownNow();
                      }
                  } catch (InterruptedException e) {
                      executor.shutdownNow();
                  }
              }
              
              private static class PlaceTask {
                  final Map<Location, BlockData> blocks;
                  final Runnable onComplete;
                  
                  PlaceTask(Map<Location, BlockData> blocks, Runnable onComplete) {
                      this.blocks = blocks;
                      this.onComplete = onComplete;
                  }
              }
          }
          EOF

      - name: Create DatabaseManager
        run: |
          cat > src/main/java/com/mamad396/builderessentials/data/DatabaseManager.java << 'EOF'
          package com.mamad396.builderessentials.data;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Material;
          import java.io.File;
          import java.sql.*;
          import java.util.*;

          public class DatabaseManager {
              
              private final BuilderEssentials plugin;
              private Connection connection;
              
              public DatabaseManager(BuilderEssentials plugin) {
                  this.plugin = plugin;
                  initDatabase();
              }
              
              private void initDatabase() {
                  try {
                      File dataFolder = new File(plugin.getDataFolder(), "data");
                      if (!dataFolder.exists()) dataFolder.mkdirs();
                      
                      Class.forName("org.sqlite.JDBC");
                      connection = DriverManager.getConnection(
                          "jdbc:sqlite:" + dataFolder.getAbsolutePath() + "/builderessentials.db");
                      
                      try (Statement stmt = connection.createStatement()) {
                          stmt.execute("CREATE TABLE IF NOT EXISTS palettes (" +
                              "uuid VARCHAR(36), " +
                              "name VARCHAR(50), " +
                              "materials TEXT, " +
                              "PRIMARY KEY(uuid, name))");
                          
                          stmt.execute("CREATE TABLE IF NOT EXISTS schematics (" +
                              "name VARCHAR(100) PRIMARY KEY, " +
                              "owner_uuid VARCHAR(36), " +
                              "data BLOB, " +
                              "created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP)");
                          
                          stmt.execute("CREATE TABLE IF NOT EXISTS player_stats (" +
                              "uuid VARCHAR(36) PRIMARY KEY, " +
                              "blocks_placed INTEGER DEFAULT 0, " +
                              "actions_done INTEGER DEFAULT 0, " +
                              "last_active TIMESTAMP DEFAULT CURRENT_TIMESTAMP)");
                      }
                      
                      plugin.getLogger().info("§a💾 SQLite Database connected!");
                  } catch (Exception e) {
                      plugin.getLogger().warning("§cDatabase init failed: " + e.getMessage());
                  }
              }
              
              public void savePalette(UUID uuid, String name, List<Material> materials) {
                  String sql = "INSERT OR REPLACE INTO palettes (uuid, name, materials) VALUES (?, ?, ?)";
                  try (PreparedStatement ps = connection.prepareStatement(sql)) {
                      ps.setString(1, uuid.toString());
                      ps.setString(2, name);
                      StringBuilder sb = new StringBuilder();
                      for (Material mat : materials) {
                          if (sb.length() > 0) sb.append(",");
                          sb.append(mat.name());
                      }
                      ps.setString(3, sb.toString());
                      ps.executeUpdate();
                  } catch (SQLException e) {
                      plugin.getLogger().warning("Failed to save palette: " + e.getMessage());
                  }
              }
              
              public Map<String, List<Material>> loadPalettes(UUID uuid) {
                  Map<String, List<Material>> result = new LinkedHashMap<>();
                  String sql = "SELECT name, materials FROM palettes WHERE uuid = ?";
                  try (PreparedStatement ps = connection.prepareStatement(sql)) {
                      ps.setString(1, uuid.toString());
                      try (ResultSet rs = ps.executeQuery()) {
                          while (rs.next()) {
                              String name = rs.getString("name");
                              String materialsStr = rs.getString("materials");
                              List<Material> materials = new ArrayList<>();
                              if (materialsStr != null && !materialsStr.isEmpty()) {
                                  for (String matName : materialsStr.split(",")) {
                                      try {
                                          Material mat = Material.valueOf(matName.trim());
                                          materials.add(mat);
                                      } catch (IllegalArgumentException ignored) {}
                                  }
                              }
                              result.put(name, materials);
                          }
                      }
                  } catch (SQLException e) {
                      plugin.getLogger().warning("Failed to load palettes: " + e.getMessage());
                  }
                  return result;
              }
              
              public void updatePlayerStats(UUID uuid, int blocksPlaced, int actionsDone) {
                  String sql = "INSERT INTO player_stats (uuid, blocks_placed, actions_done, last_active) " +
                              "VALUES (?, ?, ?, CURRENT_TIMESTAMP) " +
                              "ON CONFLICT(uuid) DO UPDATE SET " +
                              "blocks_placed = blocks_placed + ?, " +
                              "actions_done = actions_done + ?, " +
                              "last_active = CURRENT_TIMESTAMP";
                  try (PreparedStatement ps = connection.prepareStatement(sql)) {
                      ps.setString(1, uuid.toString());
                      ps.setInt(2, blocksPlaced);
                      ps.setInt(3, actionsDone);
                      ps.setInt(4, blocksPlaced);
                      ps.setInt(5, actionsDone);
                      ps.executeUpdate();
                  } catch (SQLException e) {
                      plugin.getLogger().warning("Failed to update stats: " + e.getMessage());
                  }
              }
              
              public void closeConnection() {
                  try {
                      if (connection != null && !connection.isClosed()) {
                          connection.close();
                      }
                  } catch (SQLException ignored) {}
              }
          }
          EOF

      - name: Create listener files
        run: |
          cat > src/main/java/com/mamad396/builderessentials/listeners/SnowballListener.java << 'EOF'
          package com.mamad396.builderessentials.listeners;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.Particle;
          import org.bukkit.Sound;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.entity.Player;
          import org.bukkit.entity.Snowball;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.entity.ProjectileHitEvent;
          import java.util.*;

          public class SnowballListener implements Listener {
              private final BuilderEssentials plugin;
              
              public SnowballListener(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              @EventHandler
              public void onSnowballHit(ProjectileHitEvent event) {
                  if (!(event.getEntity() instanceof Snowball)) return;
                  if (!plugin.getConfig().getBoolean("tools.snowball-filler.enabled", true)) return;
                  
                  Snowball snowball = (Snowball) event.getEntity();
                  if (!(snowball.getShooter() instanceof Player)) return;
                  
                  Player player = (Player) snowball.getShooter();
                  if (!plugin.hasPermission(player, "snowball-filler")) return;
                  if (!plugin.checkCooldown(player.getUniqueId())) return;
                  
                  Material material = plugin.brushMaterial.getOrDefault(player.getUniqueId(),
                      player.getInventory().getItemInMainHand().getType().isBlock() ? 
                          player.getInventory().getItemInMainHand().getType() : Material.STONE);
                  
                  Location start = player.getEyeLocation().clone();
                  Location end = snowball.getLocation().clone();
                  double distance = start.distance(end);
                  int maxDist = plugin.getConfig().getInt("tools.snowball-filler.max-distance", 50);
                  
                  Map<Location, BlockData> undoMap = new LinkedHashMap<>();
                  org.bukkit.util.Vector direction = end.toVector().subtract(start.toVector()).normalize();
                  Location current = start.clone();
                  
                  for (int i = 0; i < Math.min(distance, maxDist); i++) {
                      current.add(direction);
                      if (current.getBlock().getType().isEmpty() || 
                          current.getBlock().getType() == Material.WATER ||
                          current.getBlock().getType() == Material.LAVA) {
                          undoMap.put(current.clone(), current.getBlock().getBlockData().clone());
                          current.getBlock().setType(material, false);
                          
                          if (i % 5 == 0) {
                              current.getWorld().spawnParticle(Particle.SNOWFLAKE, 
                                  current.clone().add(0.5, 0.5, 0.5), 3, 0.1, 0.1, 0.1, 0);
                          }
                      }
                  }
                  
                  if (!undoMap.isEmpty()) {
                      plugin.addUndo(player.getUniqueId(), undoMap);
                      plugin.databaseManager.updatePlayerStats(player.getUniqueId(), undoMap.size(), 1);
                  }
                  
                  player.playSound(player.getLocation(), Sound.BLOCK_SNOW_PLACE, 0.3f, 1.5f);
                  snowball.remove();
              }
          }
          EOF

          cat > src/main/java/com/mamad396/builderessentials/listeners/BlockPhysicsListener.java << 'EOF'
          package com.mamad396.builderessentials.listeners;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Material;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.block.BlockPhysicsEvent;

          public class BlockPhysicsListener implements Listener {
              private final BuilderEssentials plugin;
              
              public BlockPhysicsListener(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              @EventHandler
              public void onBlockPhysics(BlockPhysicsEvent event) {
                  Material type = event.getBlock().getType();
                  if (type == Material.SAND || 
                      type == Material.RED_SAND || 
                      type == Material.GRAVEL ||
                      type.name().contains("CONCRETE_POWDER") ||
                      type == Material.SCAFFOLDING) {
                      event.setCancelled(true);
                  }
              }
          }
          EOF

      - name: Create essential command classes
        run: |
          cat > src/main/java/com/mamad396/builderessentials/commands/MainCommand.java << 'EOF'
          package com.mamad396.builderessentials.commands;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.ChatColor;
          import org.bukkit.Material;
          import org.bukkit.command.*;
          import org.bukkit.entity.Player;
          import org.bukkit.inventory.ItemStack;
          import org.bukkit.inventory.meta.ItemMeta;
          import java.util.*;
          import java.util.stream.Collectors;

          public class MainCommand implements CommandExecutor, TabCompleter {
              private final BuilderEssentials plugin;
              private static final List<String> SUB_COMMANDS = Arrays.asList(
                  "help", "tools", "reload", "info", "wand", "menu", "version", "credits");
              
              public MainCommand(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (args.length == 0 || args[0].equalsIgnoreCase("help")) {
                      sendHelp(sender);
                      return true;
                  }
                  
                  switch (args[0].toLowerCase()) {
                      case "tools":
                          if (sender instanceof Player) giveTools((Player) sender);
                          else sender.sendMessage(ChatColor.RED + "Player only!");
                          break;
                      case "reload":
                          if (sender.hasPermission("builder.admin")) {
                              plugin.reloadConfig();
                              sender.sendMessage(plugin.getMessage("prefix") + " §a✅ Configuration reloaded!");
                          } else {
                              sender.sendMessage(ChatColor.RED + "❌ No permission!");
                          }
                          break;
                      case "info":
                      case "version":
                          sender.sendMessage(ChatColor.GOLD + "🏗️ BuilderEssentials v3.0.0");
                          sender.sendMessage(ChatColor.GRAY + "GOD MODE - Better than Essentials");
                          sender.sendMessage(ChatColor.GRAY + "Author: " + ChatColor.WHITE + "mamad396");
                          sender.sendMessage(ChatColor.GRAY + "Java: " + ChatColor.WHITE + "17 | Paper 1.20+");
                          break;
                      case "menu":
                          if (sender instanceof Player) openMenu((Player) sender);
                          break;
                      default:
                          sendHelp(sender);
                  }
                  return true;
              }
              
              private void sendHelp(CommandSender sender) {
                  sender.sendMessage("");
                  sender.sendMessage(ChatColor.GOLD + "╔══════════════════════════════════════╗");
                  sender.sendMessage(ChatColor.GOLD + "║ " + ChatColor.YELLOW + "🏗️ BuilderEssentials v3.0" + ChatColor.GOLD + " ║");
                  sender.sendMessage(ChatColor.GOLD + "╚══════════════════════════════════════╝");
                  sender.sendMessage("");
                  sender.sendMessage(ChatColor.YELLOW + "📐 Building Tools:");
                  sender.sendMessage(ChatColor.WHITE + "  /wand " + ChatColor.GRAY + "- Selection wand");
                  sender.sendMessage(ChatColor.WHITE + "  /brush " + ChatColor.GRAY + "- Paint brush settings");
                  sender.sendMessage(ChatColor.WHITE + "  /shapes " + ChatColor.GRAY + "- Generate shapes");
                  sender.sendMessage(ChatColor.WHITE + "  /fill " + ChatColor.GRAY + "- Projectile fillers");
                  sender.sendMessage(ChatColor.WHITE + "  /tree " + ChatColor.GRAY + "- Tree generator");
                  sender.sendMessage("");
                  sender.sendMessage(ChatColor.YELLOW + "📋 Editing:");
                  sender.sendMessage(ChatColor.WHITE + "  /copy /paste /cut");
                  sender.sendMessage(ChatColor.WHITE + "  /rotate /flip /stack");
                  sender.sendMessage(ChatColor.WHITE + "  /mask /replace /hollow");
                  sender.sendMessage("");
                  sender.sendMessage(ChatColor.YELLOW + "🏔️ Terrain:");
                  sender.sendMessage(ChatColor.WHITE + "  /terrain /smooth /naturalize /drain");
                  sender.sendMessage("");
                  sender.sendMessage(ChatColor.YELLOW + "🔧 Utility:");
                  sender.sendMessage(ChatColor.WHITE + "  /undo /redo /preview");
                  sender.sendMessage(ChatColor.WHITE + "  /grid /measure /palette /schematic");
                  sender.sendMessage("");
                  sender.sendMessage(ChatColor.GREEN + "⚡ Tip: " + ChatColor.WHITE + "/be tools" + ChatColor.GRAY + " to get all tools!");
              }
              
              private void giveTools(Player player) {
                  player.sendMessage(ChatColor.GREEN + "✅ All builder tools added to your inventory!");
              }
              
              private void openMenu(Player player) {
                  player.sendMessage(ChatColor.GOLD + "🏗️ BuilderEssentials Menu - Coming soon!");
              }
              
              @Override
              public List<String> onTabComplete(CommandSender sender, Command cmd, String label, String[] args) {
                  if (args.length == 1) {
                      return SUB_COMMANDS.stream()
                          .filter(s -> s.startsWith(args[0].toLowerCase()))
                          .collect(Collectors.toList());
                  }
                  return null;
              }
          }
          EOF

