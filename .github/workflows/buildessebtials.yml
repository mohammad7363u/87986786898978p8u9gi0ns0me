          # DrainCommand
          cat > src/main/java/com/mamad396/builderessentials/commands/DrainCommand.java << 'EOF'
          package com.mamad396.builderessentials.commands;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.entity.Player;
          import org.bukkit.command.*;
          import java.util.*;

          public class DrainCommand implements CommandExecutor {
              private final BuilderEssentials plugin;
              public DrainCommand(BuilderEssentials plugin) { this.plugin = plugin; }
              
              @Override
              public boolean onCommand(CommandSender s, Command c, String l, String[] a) {
                  if (!(s instanceof Player)) return true;
                  Player p = (Player) s;
                  if (!p.hasPermission("builder.drain")) { p.sendMessage("§cNo permission!"); return true; }
                  
                  int radius = plugin.brushSize.getOrDefault(p.getUniqueId(), 10);
                  Map<Location, BlockData> undoMap = new HashMap<>();
                  
                  for (int x = -radius; x <= radius; x++)
                      for (int y = -radius; y <= radius; y++)
                          for (int z = -radius; z <= radius; z++) {
                              if (x*x + y*y + z*z > radius*radius) continue;
                              Location loc = p.getLocation().clone().add(x, y, z);
                              if (loc.getBlock().getType() == Material.WATER || 
                                  loc.getBlock().getType() == Material.LAVA) {
                                  undoMap.put(loc.clone(), loc.getBlock().getBlockData().clone());
                              }
                          }
                  
                  plugin.asyncPlacer.queuePlacement(p.getUniqueId(), undoMap, () -> {
                      p.sendMessage("§a💧 Drained " + undoMap.size() + " liquid blocks!");
                  });
                  return true;
              }
          }
          EOF

