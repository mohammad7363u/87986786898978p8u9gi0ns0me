          class PaletteCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) { sender.sendMessage("Player only!"); return true }
                  if (args.isEmpty()) {
                      sender.sendMessage(plugin.mm.deserialize("<gold>🎨 /palette save/load/list/delete <name></gold>"))
                      return true
                  }
                  
                  when (args[0].lowercase()) {
                      "save" -> {
                          if (args.size < 2) return true
                          val mats: MutableList<Material> = mutableListOf()
                          for (i in 0..8) {
                              val item: ItemStack? = sender.inventory.getItem(i)
                              if (item != null && item.type.isBlock) mats.add(item.type)
                          }
                          if (mats.isEmpty()) { sender.sendMessage("No blocks in hotbar!"); return true }
                          plugin.palettes.getOrPut(sender.uniqueId) { mutableMapOf() }[args[1]] = mats
                          sender.sendMessage(plugin.mm.deserialize("<green>✅ Palette saved!</green>"))
                      }
                      "load" -> {
                          if (args.size < 2) return true
                          val mats: MutableList<Material>? = plugin.palettes[sender.uniqueId]?.get(args[1])
                          if (mats == null) { sender.sendMessage("Not found!"); return true }
                          mats.forEachIndexed { index: Int, mat: Material ->
                              if (index < 9) sender.inventory.setItem(index, ItemStack(mat, 1))
                          }
                          sender.sendMessage(plugin.mm.deserialize("<green>✅ Palette loaded!</green>"))
                      }
                      "list" -> {
                          val pals: MutableMap<String, MutableList<Material>>? = plugin.palettes[sender.uniqueId]
                          if (pals == null || pals.isEmpty()) { sender.sendMessage("No palettes!"); return true }
                          pals.keys.forEach { name: String -> sender.sendMessage("• $name") }
                      }
                      "delete" -> {
                          if (args.size < 2) return true
                          plugin.palettes[sender.uniqueId]?.remove(args[1])
                          sender.sendMessage(plugin.mm.deserialize("<green>✅ Palette deleted!</green>"))
                      }
                  }
                  return true
              }
          }
