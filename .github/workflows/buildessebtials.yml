          import org.bukkit.event.block.Action
          import org.bukkit.event.player.PlayerInteractEvent

          class MeasureListener(private val plugin: BuilderEssentials) : Listener {
              private val pos1: MutableMap<java.util.UUID, Location> = mutableMapOf()
              
              @EventHandler
              fun onInteract(event: PlayerInteractEvent) {
                  val item = event.item ?: return
                  if (item.type != Material.COMPASS) return
                  val player = event.player
                  
                  when (event.action) {
                      Action.LEFT_CLICK_BLOCK, Action.LEFT_CLICK_AIR -> {
                          val loc: Location = event.clickedBlock?.location ?: player.location
                          pos1[player.uniqueId] = loc.clone()
                          player.sendMessage(plugin.mm.deserialize("<green>📏 Start: ${loc.blockX}, ${loc.blockY}, ${loc.blockZ}</green>"))
                          event.isCancelled = true
                      }
                      Action.RIGHT_CLICK_BLOCK, Action.RIGHT_CLICK_AIR -> {
                          val start: Location = pos1[player.uniqueId] ?: return
                          val end: Location = event.clickedBlock?.location ?: player.location
                          val dist: Double = start.distance(end)
                          val dx: Int = Math.abs(end.blockX - start.blockX)
                          val dy: Int = Math.abs(end.blockY - start.blockY)
                          val dz: Int = Math.abs(end.blockZ - start.blockZ)
                          player.sendMessage(plugin.mm.deserialize("<gold>📏 Distance: ${"%.1f".format(dist)} blocks</gold>"))
                          player.sendMessage(plugin.mm.deserialize("<gray>X: $dx, Y: $dy, Z: $dz | Volume: ${dx * dy * dz}</gray>"))
                          event.isCancelled = true
                      }
                      else -> {}
                  }
              }
          }
          EOF

          # GridListener
          cat > src/main/kotlin/com/mamad396/builderessentials/listeners/GridListener.kt << 'EOF'
          package com.mamad396.builderessentials.listeners

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Particle
          import org.bukkit.event.EventHandler
          import org.bukkit.event.Listener
          import org.bukkit.event.player.PlayerMoveEvent
          import org.bukkit.scheduler.BukkitRunnable

          class GridListener(private val plugin: BuilderEssentials) : Listener {
              private val activeGrids: MutableMap<java.util.UUID, BukkitRunnable> = mutableMapOf()
              
              @EventHandler
              fun onMove(event: PlayerMoveEvent) {
                  val player = event.player
                  val hasGrid: Boolean = plugin.gridToggled.getOrDefault(player.uniqueId, false)
                  val isSnapping: Boolean = plugin.snapGrid.getOrDefault(player.uniqueId, false)
                  
                  if (isSnapping && (event.from.blockX != event.to?.blockX ?: event.from.blockX || event.from.blockZ != event.to?.blockZ ?: event.from.blockZ)) {
                      val gridSize: Int = plugin.gridSize.getOrDefault(player.uniqueId, 16)
                      val snappedX: Int = (player.location.blockX / gridSize) * gridSize + gridSize / 2
                      val snappedZ: Int = (player.location.blockZ / gridSize) * gridSize + gridSize / 2
                      val newLoc = player.location.clone()
                      newLoc.x = snappedX + 0.5
                      newLoc.z = snappedZ + 0.5
                      player.teleport(newLoc)
                  }
                  
                  if (hasGrid) {
                      activeGrids[player.uniqueId]?.cancel()
                      val task = object : BukkitRunnable() {
                          override fun run() {
                              if (!player.isOnline) { cancel(); return }
                              val gridSize: Int = plugin.gridSize.getOrDefault(player.uniqueId, 16)
                              val centerX: Int = (player.location.blockX / gridSize) * gridSize
                              val centerZ: Int = (player.location.blockZ / gridSize) * gridSize
                              for (x in -2..2) for (z in -2..2) {
                                  player.world.spawnParticle(Particle.END_ROD, 
                                      (centerX + x * gridSize + gridSize / 2 + 0.5).toDouble(),
                                      player.location.y,
                                      (centerZ + z * gridSize + gridSize / 2 + 0.5).toDouble(),
                                      1, 0.0, 0.0, 0.0, 0.0)
                              }
                          }
                      }
                      task.runTaskTimer(plugin, 0L, 20L)
                      activeGrids[player.uniqueId] = task
                  } else {
                      activeGrids[player.uniqueId]?.cancel()
                      activeGrids.remove(player.uniqueId)
                  }
              }
          }
          EOF

      - name: Create ShapeGenerator
        run: |
          cat > src/main/kotlin/com/mamad396/builderessentials/shapes/ShapeGenerator.kt << 'EOF'
          package com.mamad396.builderessentials.shapes

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Location
          import org.bukkit.Material
          import org.bukkit.block.data.BlockData
          import org.bukkit.entity.Player
          import kotlin.math.*

          class ShapeGenerator(private val plugin: BuilderEssentials) {
              
              fun generateCircle(player: Player, center: Location, radius: Int, material: Material, hollow: Boolean) {
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  for (x in -radius..radius) for (z in -radius..radius) {
                      val d: Double = sqrt((x * x + z * z).toDouble())
                      if (d <= radius + 0.5 && (!hollow || d >= radius - 0.5)) {
                          val loc: Location = center.clone().add(x.toDouble(), 0.0, z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>⭕ Circle done!</green>"))
              }
              
              fun generateSphere(player: Player, center: Location, radius: Int, material: Material, hollow: Boolean) {
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  for (x in -radius..radius) for (y in -radius..radius) for (z in -radius..radius) {
                      val d: Double = sqrt((x * x + y * y + z * z).toDouble())
                      if (d <= radius + 0.5 && (!hollow || d >= radius - 0.5)) {
                          val loc: Location = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🔵 Sphere done!</green>"))
              }
              
              fun generateCube(player: Player, center: Location, size: Int, material: Material, hollow: Boolean) {
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  val half: Int = size / 2
                  for (x in -half..half) for (y in -half..half) for (z in -half..half) {
                      if (!hollow || x == -half || x == half || y == -half || y == half || z == -half || z == half) {
                          val loc: Location = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>📦 Cube done!</green>"))
              }
              
              fun generateCylinder(player: Player, center: Location, radius: Int, height: Int, material: Material, hollow: Boolean) {
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  for (x in -radius..radius) for (z in -radius..radius) {
                      val d: Double = sqrt((x * x + z * z).toDouble())
                      if (d <= radius + 0.5) {
                          for (y in 0 until height) {
                              if (!hollow || d >= radius - 0.5 || y == 0 || y == height - 1) {
                                  val loc: Location = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                                  undoMap[loc.clone()] = loc.block.blockData
                                  loc.block.type = material
                              }
                          }
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🫙 Cylinder done!</green>"))
              }
              
              fun generatePyramid(player: Player, center: Location, size: Int, material: Material) {
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  for (y in 0 until size) {
                      val s: Int = size - y
                      for (x in -s/2..s/2) for (z in -s/2..s/2) {
                          val loc: Location = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🔺 Pyramid done!</green>"))
              }
              
              fun generateCone(player: Player, center: Location, radius: Int, height: Int, material: Material) {
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  for (y in 0 until height) {
                      val r: Int = (radius * (height - y) / height.toDouble()).toInt()
                      for (x in -r..r) for (z in -r..r) {
                          if (sqrt((x * x + z * z).toDouble()) <= r + 0.5) {
                              val loc: Location = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                              undoMap[loc.clone()] = loc.block.blockData
                              loc.block.type = material
                          }
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>📐 Cone done!</green>"))
              }
              
              fun generateDome(player: Player, center: Location, radius: Int, material: Material) {
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  for (x in -radius..radius) for (y in 0..radius) for (z in -radius..radius) {
                      val d: Double = sqrt((x * x + y * y + z * z).toDouble())
                      if (d <= radius + 0.5 && d >= radius - 0.5) {
                          val loc: Location = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🏛️ Dome done!</green>"))
              }
              
              fun generateTorus(player: Player, center: Location, radius: Int, material: Material) {
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  val mr: Int = plugin.config.getInt("tools.torus.minor-radius", 3)
                  for (x in -radius-mr..radius+mr) for (y in -radius-mr..radius+mr) for (z in -radius-mr..radius+mr) {
                      val d1: Double = sqrt((x * x + z * z).toDouble()) - radius
                      val d: Double = sqrt((d1 * d1 + y * y).toDouble())
                      if (d <= mr + 0.3) {
                          val loc: Location = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🍩 Torus done!</green>"))
              }
              
              fun generateSpiral(player: Player, center: Location, radius: Int, height: Int, material: Material) {
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  for (step in 0..height * 10) {
                      val angle: Double = step * 0.5
                      val y: Double = step.toDouble() / (height * 10) * height
                      val x: Int = (cos(angle) * radius).toInt()
                      val z: Int = (sin(angle) * radius).toInt()
                      val loc: Location = center.clone().add(x.toDouble(), y, z.toDouble())
                      undoMap[loc.clone()] = loc.block.blockData
                      loc.block.type = material
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🌀 Spiral done!</green>"))
              }
              
              fun generateStaircase(player: Player, center: Location, width: Int, height: Int, material: Material) {
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  for (step in 0 until height) for (w in 0 until width) for (d in 0..step) {
                      val loc: Location = center.clone().add(w.toDouble(), step.toDouble(), d.toDouble())
                      undoMap[loc.clone()] = loc.block.blockData
                      loc.block.type = material
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🪜 Staircase done!</green>"))
              }
          }
          EOF

      - name: Create pom.xml
        run: |
          cat > pom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.mamad396</groupId>
              <artifactId>BuilderEssentials</artifactId>
              <version>1.0</version>
              <packaging>jar</packaging>
              
              <properties>
                  <kotlin.version>1.9.22</kotlin.version>
                  <java.version>21</java.version>
              </properties>
              
              <repositories>
                  <repository><id>papermc</id><url>https://repo.papermc.io/repository/maven-public/</url></repository>
              </repositories>
              
              <dependencies>
                  <dependency><groupId>io.papermc.paper</groupId><artifactId>paper-api</artifactId><version>1.21-R0.1-SNAPSHOT</version><scope>provided</scope></dependency>
                  <dependency><groupId>org.jetbrains.kotlin</groupId><artifactId>kotlin-stdlib</artifactId><version>${kotlin.version}</version></dependency>
              </dependencies>
              
              <build>
                  <sourceDirectory>src/main/kotlin</sourceDirectory>
                  <plugins>
                      <plugin>
                          <groupId>org.jetbrains.kotlin</groupId>
                          <artifactId>kotlin-maven-plugin</artifactId>
                          <version>${kotlin.version}</version>
                          <executions><execution><id>compile</id><phase>compile</phase><goals><goal>compile</goal></goals></execution></executions>
                          <configuration><jvmTarget>21</jvmTarget></configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-shade-plugin</artifactId>
                          <version>3.5.1</version>
                          <executions><execution><phase>package</phase><goals><goal>shade</goal></goals></execution></executions>
                      </plugin>
                  </plugins>
              </build>
          </project>
