          cat > src/main/kotlin/com/mamad396/builderessentials/commands/TerrainCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import kotlin.math.abs
          import kotlin.random.Random

          class TerrainCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) {
                      sender.sendMessage("Player only!")
                      return true
                  }
                  
                  if (args.isEmpty()) {
                      sender.sendMessage(plugin.mm.deserialize(
                          """
                          <gold><bold>🏔️ Terrain Tools</bold></gold>
                          
                          <white>/terrain height <amount></white> <gray>- Raise/lower terrain</gray>
                          <white>/terrain smooth <radius></white> <gray>- Smooth terrain</gray>
                          <white>/terrain flat</white> <gray>- Flatten area</gray>
                          <white>/terrain noise <scale></white> <gray>- Natural noise terrain</gray>
                          <white>/terrain erosion</white> <gray>- Erosion effect</gray>
                          
                          <yellow><bold>💡 Tip:</bold></yellow> <gray>Use wand to select area first!</gray>
                          """.trimIndent()
                      ))
                      return true
                  }
                  
                  val radius = plugin.brushSize.getOrDefault(sender.uniqueId, 5)
                  val center = sender.location
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  when (args[0].lowercase()) {
                      "height" -> {
                          val amount = args.getOrNull(1)?.toIntOrNull() ?: 1
                          for (x in -radius..radius) {
                              for (z in -radius..radius) {
                                  if (x * x + z * z <= radius * radius) {
                                      for (y in -amount..amount) {
                                          val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                                          if (amount > 0 && loc.block.type == Material.AIR) {
                                              undoMap[loc.clone()] = loc.block.blockData
                                              loc.block.type = Material.GRASS_BLOCK
                                          } else if (amount < 0 && loc.block.type != Material.AIR && loc.block.type != Material.BEDROCK) {
                                              undoMap[loc.clone()] = loc.block.blockData
                                              loc.block.type = Material.AIR
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      "smooth" -> {
                          val iterations = args.getOrNull(1)?.toIntOrNull() ?: 3
                          repeat(iterations) {
                              val changes = mutableMapOf<org.bukkit.Location, Material>()
                              for (x in -radius..radius) {
                                  for (z in -radius..radius) {
                                      if (x * x + z * z <= radius * radius) {
                                          val loc = center.clone().add(x.toDouble(), 0.0, z.toDouble())
                                          val highest = loc.world?.getHighestBlockAt(loc) ?: continue
                                          val avg = getAverageHeight(loc, 3)
                                          if (abs(highest.y - avg) > 0.5) {
                                              val newY = ((highest.y + avg) / 2).toInt()
                                              val newLoc = org.bukkit.Location(loc.world, loc.x, newY.toDouble(), loc.z)
                                              changes[newLoc] = highest.type
                                          }
                                      }
                                  }
                              }
                              changes.forEach { (loc, mat) ->
                                  undoMap[loc.clone()] = loc.block.blockData
                                  loc.block.type = mat
                              }
                          }
                      }
                      "flat" -> {
                          val targetY = center.blockY
                          for (x in -radius..radius) {
                              for (z in -radius..radius) {
                                  if (x * x + z * z <= radius * radius) {
                                      val loc = center.clone().add(x.toDouble(), 0.0, z.toDouble())
                                      val highest = loc.world?.getHighestBlockAt(loc) ?: continue
                                      if (highest.y != targetY.toDouble()) {
                                          for (y in minOf(highest.y.toInt(), targetY)..maxOf(highest.y.toInt(), targetY)) {
                                              val modLoc = org.bukkit.Location(loc.world, loc.x, y.toDouble(), loc.z)
                                              undoMap[modLoc.clone()] = modLoc.block.blockData
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      "noise" -> {
                          val scale = args.getOrNull(1)?.toDoubleOrNull() ?: 0.1
                          val height = args.getOrNull(2)?.toIntOrNull() ?: 10
                          for (x in -radius..radius) {
                              for (z in -radius..radius) {
                                  if (x * x + z * z <= radius * radius) {
                                      val noise = (Math.sin(x * scale) + Math.cos(z * scale)) * height / 2
                                      val loc = center.clone().add(x.toDouble(), noise, z.toDouble())
                                      if (loc.block.type == Material.AIR) {
                                          undoMap[loc.clone()] = loc.block.blockData
                                          loc.block.type = if (noise > 0) Material.GRASS_BLOCK else Material.STONE
                                      }
                                  }
                              }
                          }
                      }
                      "erosion" -> {
                          val strength = args.getOrNull(1)?.toDoubleOrNull() ?: 0.5
                          for (x in -radius..radius) {
                              for (z in -radius..radius) {
                                  if (x * x + z * z <= radius * radius && Random.nextDouble() < strength) {
                                      val loc = center.clone().add(x.toDouble(), -1.0, z.toDouble())
                                      val block = loc.block
                                      if (block.type != Material.AIR && block.type != Material.BEDROCK) {
                                          undoMap[loc.clone()] = block.blockData
                                          block.type = Material.AIR
                                      }
                                  }
                              }
                          }
                      }
                  }
                  
                  if (undoMap.isNotEmpty()) {
                      plugin.addUndo(sender.uniqueId, undoMap)
                      sender.sendMessage(plugin.mm.deserialize("<green>✅ Terrain modified! (${undoMap.size} blocks)</green>"))
                  }
                  return true
              }
              
              private fun getAverageHeight(location: org.bukkit.Location, radius: Int): Double {
                  var total = 0.0
                  var count = 0
                  for (x in -radius..radius) {
                      for (z in -radius..radius) {
                          val loc = location.clone().add(x.toDouble(), 0.0, z.toDouble())
                          val highest = loc.world?.getHighestBlockYAt(loc) ?: continue
                          total += highest
                          count++
                      }
                  }
                  return if (count > 0) total / count else location.y
              }
          }
