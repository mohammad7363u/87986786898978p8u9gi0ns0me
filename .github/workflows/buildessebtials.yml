          cat > src/main/kotlin/com/mamad396/builderessentials/shapes/ShapeGenerator.kt << 'EOF'
          package com.mamad396.builderessentials.shapes

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Location
          import org.bukkit.Material
          import org.bukkit.block.data.BlockData
          import org.bukkit.entity.Player
          import kotlin.math.*

          class ShapeGenerator(private val plugin: BuilderEssentials) {
              
              fun generateCircle(player: Player, center: Location, radius: Int, material: Material, hollow: Boolean) {
                  val undoMap = HashMap<Location, BlockData>()
                  for (x in -radius..radius) for (z in -radius..radius) {
                      val d = sqrt((x * x + z * z).toDouble())
                      if (d <= radius + 0.5 && (!hollow || d >= radius - 0.5)) {
                          val loc = center.clone().add(x.toDouble(), 0.0, z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>⭕ Circle: ${undoMap.size} blocks</green>"))
              }
              
              fun generateSphere(player: Player, center: Location, radius: Int, material: Material, hollow: Boolean) {
                  val undoMap = HashMap<Location, BlockData>()
                  for (x in -radius..radius) for (y in -radius..radius) for (z in -radius..radius) {
                      val d = sqrt((x * x + y * y + z * z).toDouble())
                      if (d <= radius + 0.5 && (!hollow || d >= radius - 0.5)) {
                          val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🔵 Sphere: ${undoMap.size} blocks</green>"))
              }
              
              fun generateCube(player: Player, center: Location, size: Int, material: Material, hollow: Boolean) {
                  val undoMap = HashMap<Location, BlockData>()
                  val half = size / 2
                  for (x in -half..half) for (y in -half..half) for (z in -half..half) {
                      if (!hollow || x == -half || x == half || y == -half || y == half || z == -half || z == half) {
                          val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>📦 Cube: ${undoMap.size} blocks</green>"))
              }
              
              fun generateCylinder(player: Player, center: Location, radius: Int, height: Int, material: Material, hollow: Boolean) {
                  val undoMap = HashMap<Location, BlockData>()
                  for (x in -radius..radius) for (z in -radius..radius) {
                      val d = sqrt((x * x + z * z).toDouble())
                      if (d <= radius + 0.5) {
                          for (y in 0 until height) {
                              if (!hollow || d >= radius - 0.5 || y == 0 || y == height - 1) {
                                  val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                                  undoMap[loc.clone()] = loc.block.blockData
                                  loc.block.type = material
                              }
                          }
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🫙 Cylinder: ${undoMap.size} blocks</green>"))
              }
              
              fun generatePyramid(player: Player, center: Location, size: Int, material: Material) {
                  val undoMap = HashMap<Location, BlockData>()
                  for (y in 0 until size) {
                      val s = size - y
                      for (x in -s/2..s/2) for (z in -s/2..s/2) {
                          val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🔺 Pyramid: ${undoMap.size} blocks</green>"))
              }
              
              fun generateCone(player: Player, center: Location, radius: Int, height: Int, material: Material) {
                  val undoMap = HashMap<Location, BlockData>()
                  for (y in 0 until height) {
                      val r = (radius * (height - y) / height.toDouble()).toInt()
                      for (x in -r..r) for (z in -r..r) {
                          if (sqrt((x * x + z * z).toDouble()) <= r + 0.5) {
                              val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                              undoMap[loc.clone()] = loc.block.blockData
                              loc.block.type = material
                          }
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>📐 Cone: ${undoMap.size} blocks</green>"))
              }
              
              fun generateDome(player: Player, center: Location, radius: Int, material: Material) {
                  val undoMap = HashMap<Location, BlockData>()
                  for (x in -radius..radius) for (y in 0..radius) for (z in -radius..radius) {
                      val d = sqrt((x * x + y * y + z * z).toDouble())
                      if (d <= radius + 0.5 && d >= radius - 0.5) {
                          val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🏛️ Dome: ${undoMap.size} blocks</green>"))
              }
              
              fun generateTorus(player: Player, center: Location, radius: Int, material: Material) {
                  val undoMap = HashMap<Location, BlockData>()
                  val mr = plugin.config.getInt("tools.torus.minor-radius", 3)
                  for (x in -radius-mr..radius+mr) for (y in -radius-mr..radius+mr) for (z in -radius-mr..radius+mr) {
                      val d1 = sqrt((x * x + z * z).toDouble()) - radius
                      val d = sqrt((d1 * d1 + y * y).toDouble())
                      if (d <= mr + 0.3) {
                          val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                          undoMap[loc.clone()] = loc.block.blockData
                          loc.block.type = material
                      }
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🍩 Torus: ${undoMap.size} blocks</green>"))
              }
              
              fun generateSpiral(player: Player, center: Location, radius: Int, height: Int, material: Material) {
                  val undoMap = HashMap<Location, BlockData>()
                  val steps = height * 10
                  for (step in 0..steps) {
                      val angle = step * 0.5
                      val y = step.toDouble() / steps * height
                      val x = (cos(angle) * radius).toInt()
                      val z = (sin(angle) * radius).toInt()
                      val loc = center.clone().add(x.toDouble(), y, z.toDouble())
                      undoMap[loc.clone()] = loc.block.blockData
                      loc.block.type = material
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🌀 Spiral: ${undoMap.size} blocks</green>"))
              }
              
              fun generateStaircase(player: Player, center: Location, width: Int, height: Int, material: Material) {
                  val undoMap = HashMap<Location, BlockData>()
                  for (step in 0 until height) for (w in 0 until width) for (d in 0..step) {
                      val loc = center.clone().add(w.toDouble(), step.toDouble(), d.toDouble())
                      undoMap[loc.clone()] = loc.block.blockData
                      loc.block.type = material
                  }
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🪜 Staircase: ${undoMap.size} blocks</green>"))
              }
          }
          EOF

