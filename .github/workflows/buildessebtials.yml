name: Build BuilderEssentials

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Create project structure
        run: |
          mkdir -p src/main/kotlin/com/mamad396/builderessentials/commands
          mkdir -p src/main/kotlin/com/mamad396/builderessentials/listeners
          mkdir -p src/main/kotlin/com/mamad396/builderessentials/shapes
          mkdir -p src/main/resources
          mkdir -p releases

      - name: Create plugin.yml
        run: |
          cat > src/main/resources/plugin.yml << 'EOF'
          name: BuilderEssentials
          version: 1.0
          main: com.mamad396.builderessentials.BuilderEssentials
          api-version: '1.21'
          author: mamad396
          description: 70+ building tools for professional builders
          softdepend: [FastAsyncWorldEdit]
          
          commands:
            builder:
              description: Main builder command
              aliases: [be, buildertools, bt]
            wand:
              description: Get selection wand
            fill:
              description: Fill tools menu
              aliases: [filler, paint]
            shapes:
              description: Shape generator menu
              aliases: [gen, generate]
            terrain:
              description: Terrain tools
              aliases: [terra, land]
            tree:
              description: Tree generator
              aliases: [treegen]
            schematic:
              description: Schematic manager
              aliases: [schem, blueprint]
            undo:
              description: Undo last action
            redo:
              description: Redo action
            palette:
              description: Block palette manager
              aliases: [colors, blocks]
            brush:
              description: Brush settings
              aliases: [br]
            grid:
              description: Toggle build grid
            measure:
              description: Measure distance
          EOF

      - name: Create config.yml
        run: |
          cat > src/main/resources/config.yml << 'EOF'
          config-version: 1.0
          prefix: "<dark_gray>[<gold>🏗️</gold>]</dark_gray> <gray>"
          max-undo-history: 50
          max-blocks-per-action: 100000

          tools:
            snowball-filler:
              enabled: true
              max-distance: 50
            egg-filler:
              enabled: true
            arrow-placer:
              enabled: true
            ender-pearl-fill:
              enabled: true
              radius: 3
            trident-builder:
              enabled: true
            selection-wand:
              enabled: true
            paint-wand:
              enabled: true
            fast-break:
              enabled: true
            vein-miner:
              enabled: true
              max-vein: 64
            brush-size:
              min: 1
              max: 20
              default: 3
            torus:
              minor-radius: 3
            measure-tool:
              enabled: true
          EOF

      - name: Create main plugin class
        run: |
          cat > src/main/kotlin/com/mamad396/builderessentials/BuilderEssentials.kt << 'EOF'
          package com.mamad396.builderessentials

          import com.mamad396.builderessentials.commands.*
          import com.mamad396.builderessentials.listeners.*
          import net.kyori.adventure.text.minimessage.MiniMessage
          import org.bukkit.Location
          import org.bukkit.Material
          import org.bukkit.block.data.BlockData
          import org.bukkit.plugin.java.JavaPlugin
          import java.util.UUID
          import java.util.Stack
          import java.util.concurrent.ConcurrentHashMap

          class BuilderEssentials : JavaPlugin() {
              companion object {
                  lateinit var instance: BuilderEssentials
                      private set
              }

              val mm: MiniMessage = MiniMessage.miniMessage()
              
              val wandPos1: MutableMap<UUID, Location> = ConcurrentHashMap()
              val wandPos2: MutableMap<UUID, Location> = ConcurrentHashMap()
              val brushSize: MutableMap<UUID, Int> = ConcurrentHashMap()
              val brushMaterial: MutableMap<UUID, Material> = ConcurrentHashMap()
              val undoHistory: MutableMap<UUID, Stack<MutableMap<Location, BlockData>>> = ConcurrentHashMap()
              val redoHistory: MutableMap<UUID, Stack<MutableMap<Location, BlockData>>> = ConcurrentHashMap()
              val palettes: MutableMap<UUID, MutableMap<String, MutableList<Material>>> = ConcurrentHashMap()
              val gridToggled: MutableMap<UUID, Boolean> = ConcurrentHashMap()
              val snapGrid: MutableMap<UUID, Boolean> = ConcurrentHashMap()
              val gridSize: MutableMap<UUID, Int> = ConcurrentHashMap()

              override fun onEnable() {
                  instance = this
                  saveDefaultConfig()
                  registerCommands()
                  registerListeners()
                  logger.info("🏗️ BuilderEssentials v1.0 enabled!")
              }

              override fun onDisable() {
                  logger.info("BuilderEssentials disabled!")
              }

              private fun registerCommands() {
                  getCommand("builder")?.setExecutor(MainCommand(this))
                  getCommand("wand")?.setExecutor(WandCommand(this))
                  getCommand("fill")?.setExecutor(FillCommand(this))
                  getCommand("shapes")?.setExecutor(ShapeCommand(this))
                  getCommand("terrain")?.setExecutor(TerrainCommand(this))
                  getCommand("tree")?.setExecutor(TreeCommand(this))
                  getCommand("schematic")?.setExecutor(SchematicCommand(this))
                  getCommand("undo")?.setExecutor(UndoCommand(this))
                  getCommand("redo")?.setExecutor(RedoCommand(this))
                  getCommand("palette")?.setExecutor(PaletteCommand(this))
                  getCommand("brush")?.setExecutor(BrushCommand(this))
                  getCommand("grid")?.setExecutor(GridCommand(this))
                  getCommand("measure")?.setExecutor(MeasureCommand(this))
              }

              private fun registerListeners() {
                  val pm = server.pluginManager
                  pm.registerEvents(SnowballListener(this), this)
                  pm.registerEvents(EggListener(this), this)
                  pm.registerEvents(ArrowListener(this), this)
                  pm.registerEvents(PearlListener(this), this)
                  pm.registerEvents(TridentListener(this), this)
                  pm.registerEvents(WandListener(this), this)
                  pm.registerEvents(PaintListener(this), this)
                  pm.registerEvents(FastBreakListener(this), this)
                  pm.registerEvents(VeinMinerListener(this), this)
                  pm.registerEvents(MeasureListener(this), this)
                  pm.registerEvents(GridListener(this), this)
              }

              fun addUndo(uuid: UUID, blocks: MutableMap<Location, BlockData>) {
                  val stack = undoHistory.getOrPut(uuid) { Stack() }
                  stack.push(blocks)
                  if (stack.size > config.getInt("max-undo-history", 50)) {
                      stack.removeAt(0)
                  }
                  redoHistory[uuid]?.clear()
              }
          }
          EOF

      - name: Create all command classes
        run: |
          # MainCommand
          cat > src/main/kotlin/com/mamad396/builderessentials/commands/MainCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import org.bukkit.inventory.ItemStack

          class MainCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (args.isEmpty() || args[0].equals("help", true)) {
                      sender.sendMessage(plugin.mm.deserialize("<gold><bold>🏗️ BuilderEssentials v1.0</bold></gold>"))
                      sender.sendMessage(plugin.mm.deserialize("<gray>70+ Building Tools for Professional Builders</gray>"))
                      sender.sendMessage("")
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/builder tools</yellow><gray> - Get all building tools</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/wand</yellow><gray> - Get selection wand</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/fill</yellow><gray> - Filler tools menu</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/shapes</yellow><gray> - Shape generator</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/terrain</yellow><gray> - Terrain tools</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/tree</yellow><gray> - Tree generator</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/schematic</yellow><gray> - Schematic manager</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/undo</yellow> <gray>/redo</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/palette</yellow><gray> - Block palettes</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/brush</yellow><gray> - Brush settings</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/grid</yellow><gray> - Grid system</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>/measure</yellow><gray> - Measure tool</gray>"))
                      return true
                  }
                  
                  if (args[0].equals("tools", true)) {
                      if (sender !is Player) { sender.sendMessage("Player only!"); return true }
                      giveTools(sender)
                      return true
                  }
                  
                  if (args[0].equals("reload", true) && sender.hasPermission("builder.admin")) {
                      plugin.reloadConfig()
                      sender.sendMessage(plugin.mm.deserialize("<green>✅ Configuration reloaded!</green>"))
                      return true
                  }
                  
                  return true
              }
              
              private fun giveTools(player: Player) {
                  player.inventory.addItem(ItemStack(Material.WOODEN_AXE))
                  player.inventory.addItem(ItemStack(Material.BLAZE_ROD))
                  player.inventory.addItem(ItemStack(Material.SNOWBALL, 16))
                  player.inventory.addItem(ItemStack(Material.EGG, 16))
                  player.inventory.addItem(ItemStack(Material.ENDER_PEARL, 16))
                  player.inventory.addItem(ItemStack(Material.TRIDENT))
                  player.inventory.addItem(ItemStack(Material.BOW))
                  player.inventory.addItem(ItemStack(Material.ARROW, 64))
                  player.inventory.addItem(ItemStack(Material.COMPASS))
                  player.sendMessage(plugin.mm.deserialize("<green>✅ All builder tools added to inventory!</green>"))
              }
          }
          EOF

          # WandCommand
          cat > src/main/kotlin/com/mamad396/builderessentials/commands/WandCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import org.bukkit.inventory.ItemStack

          class WandCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) { sender.sendMessage("Player only!"); return true }
                  val wand = ItemStack(Material.WOODEN_AXE)
                  val meta = wand.itemMeta
                  meta.displayName(plugin.mm.deserialize("<gold><bold>🪄 Builder Wand</bold></gold>"))
                  meta.lore(listOf(
                      plugin.mm.deserialize("<gray>Left click: Set pos1</gray>"),
                      plugin.mm.deserialize("<gray>Right click: Set pos2</gray>")
                  ))
                  wand.itemMeta = meta
                  sender.inventory.addItem(wand)
                  sender.sendMessage(plugin.mm.deserialize("<green>✅ Wand added!</green>"))
                  return true
              }
          }
          EOF

          # FillCommand
          cat > src/main/kotlin/com/mamad396/builderessentials/commands/FillCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import org.bukkit.inventory.ItemStack

          class FillCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) { sender.sendMessage("Player only!"); return true }
                  if (args.isEmpty()) {
                      sender.sendMessage(plugin.mm.deserialize("<gold>❄️ Filler Tools:</gold>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>Snowball</white><gray> - Trail filler</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>Egg</white><gray> - Point filler</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>Arrow</white><gray> - Block placer</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>Ender Pearl</white><gray> - Area fill</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>Trident</white><gray> - Line builder</gray>"))
                      return true
                  }
                  when (args[0].lowercase()) {
                      "all" -> {
                          sender.inventory.addItem(ItemStack(Material.SNOWBALL, 16))
                          sender.inventory.addItem(ItemStack(Material.EGG, 16))
                          sender.inventory.addItem(ItemStack(Material.ENDER_PEARL, 16))
                          sender.inventory.addItem(ItemStack(Material.TRIDENT))
                          sender.inventory.addItem(ItemStack(Material.BOW))
                          sender.inventory.addItem(ItemStack(Material.ARROW, 64))
                          sender.sendMessage(plugin.mm.deserialize("<green>✅ All filler tools added!</green>"))
                      }
                  }
                  return true
              }
          }
          EOF

          # ShapeCommand
          cat > src/main/kotlin/com/mamad396/builderessentials/commands/ShapeCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import com.mamad396.builderessentials.shapes.ShapeGenerator
          import org.bukkit.Material
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player

          class ShapeCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              private val shapeGen = ShapeGenerator(plugin)
              
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) { sender.sendMessage("Player only!"); return true }
                  if (args.isEmpty()) {
                      sender.sendMessage(plugin.mm.deserialize("<gold>📐 Shapes: circle, sphere, cube, cylinder, pyramid, cone, dome, torus, spiral, staircase</gold>"))
                      return true
                  }
                  
                  val material: Material = plugin.brushMaterial[sender.uniqueId] ?: Material.STONE
                  val center: org.bukkit.Location = sender.location
                  val radius: Int = args.getOrNull(1)?.toIntOrNull() ?: 5
                  val hollow: Boolean = args.getOrNull(2)?.equals("hollow", true) ?: false
                  
                  when (args[0].lowercase()) {
                      "circle" -> shapeGen.generateCircle(sender, center, radius, material, hollow)
                      "sphere" -> shapeGen.generateSphere(sender, center, radius, material, hollow)
                      "cube" -> shapeGen.generateCube(sender, center, radius, material, hollow)
                      "cylinder" -> shapeGen.generateCylinder(sender, center, radius, args.getOrNull(2)?.toIntOrNull() ?: 5, material, hollow)
                      "pyramid" -> shapeGen.generatePyramid(sender, center, radius, material)
                      "cone" -> shapeGen.generateCone(sender, center, radius, args.getOrNull(2)?.toIntOrNull() ?: 5, material)
                      "dome" -> shapeGen.generateDome(sender, center, radius, material)
                      "torus" -> shapeGen.generateTorus(sender, center, radius, material)
                      "spiral" -> shapeGen.generateSpiral(sender, center, radius, args.getOrNull(2)?.toIntOrNull() ?: 10, material)
                      "staircase" -> shapeGen.generateStaircase(sender, center, args.getOrNull(1)?.toIntOrNull() ?: 3, args.getOrNull(2)?.toIntOrNull() ?: 5, material)
                  }
                  return true
              }
          }
          EOF

          # TerrainCommand
          cat > src/main/kotlin/com/mamad396/builderessentials/commands/TerrainCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Location
          import org.bukkit.Material
          import org.bukkit.block.data.BlockData
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import kotlin.random.Random

          class TerrainCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) { sender.sendMessage("Player only!"); return true }
                  if (args.isEmpty()) {
                      sender.sendMessage(plugin.mm.deserialize("<gold>🏔️ Terrain: height, smooth, flat, noise, erosion</gold>"))
                      return true
                  }
                  
                  val radius: Int = plugin.brushSize.getOrDefault(sender.uniqueId, 5)
                  val center: Location = sender.location
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  
                  when (args[0].lowercase()) {
                      "height" -> {
                          val amount: Int = args.getOrNull(1)?.toIntOrNull() ?: 1
                          for (x in -radius..radius) for (z in -radius..radius) {
                              if (x * x + z * z <= radius * radius) {
                                  for (y in -Math.abs(amount)..Math.abs(amount)) {
                                      val loc: Location = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                                      if (amount > 0 && loc.block.type == Material.AIR) {
                                          undoMap[loc.clone()] = loc.block.blockData
                                          loc.block.type = Material.GRASS_BLOCK
                                      }
                                  }
                              }
                          }
                      }
                      "flat" -> {
                          val targetY: Int = center.blockY
                          for (x in -radius..radius) for (z in -radius..radius) {
                              if (x * x + z * z <= radius * radius) {
                                  val loc: Location = center.clone().add(x.toDouble(), 0.0, z.toDouble())
                                  val highest: org.bukkit.block.Block = loc.world?.getHighestBlockAt(loc) ?: continue
                                  val highestY: Int = highest.y
                                  if (highestY != targetY) {
                                      undoMap[highest.location.clone()] = highest.blockData
                                      highest.type = Material.GRASS_BLOCK
                                  }
                              }
                          }
                      }
                      "noise" -> {
                          val scale: Double = args.getOrNull(1)?.toDoubleOrNull() ?: 0.1
                          for (x in -radius..radius) for (z in -radius..radius) {
                              if (x * x + z * z <= radius * radius) {
                                  val noise: Double = Math.sin(x * scale) * Math.cos(z * scale) * 5
                                  val loc: Location = center.clone().add(x.toDouble(), noise, z.toDouble())
                                  if (loc.block.type == Material.AIR) {
                                      undoMap[loc.clone()] = loc.block.blockData
                                      loc.block.type = Material.STONE
                                  }
                              }
                          }
                      }
                      "erosion" -> {
                          val strength: Double = args.getOrNull(1)?.toDoubleOrNull() ?: 0.3
                          for (x in -radius..radius) for (z in -radius..radius) {
                              if (x * x + z * z <= radius * radius && Random.nextDouble() < strength) {
                                  val loc: Location = center.clone().add(x.toDouble(), -1.0, z.toDouble())
                                  val block: org.bukkit.block.Block = loc.block
                                  if (block.type != Material.AIR && block.type != Material.BEDROCK) {
                                      undoMap[loc.clone()] = block.blockData
                                      block.type = Material.AIR
                                  }
                              }
                          }
                      }
                  }
                  
                  if (undoMap.isNotEmpty()) {
                      plugin.addUndo(sender.uniqueId, undoMap)
                      sender.sendMessage(plugin.mm.deserialize("<green>✅ Terrain modified! (${undoMap.size} blocks)</green>"))
                  }
                  return true
              }
          }
          EOF

          # TreeCommand
          cat > src/main/kotlin/com/mamad396/builderessentials/commands/TreeCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.TreeType
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player

          class TreeCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) { sender.sendMessage("Player only!"); return true }
                  if (args.isEmpty()) {
                      sender.sendMessage(plugin.mm.deserialize("<gold>🌳 Types: oak, spruce, birch, jungle, acacia, dark_oak, cherry, mangrove, big_oak, big_jungle</gold>"))
                      return true
                  }
                  
                  val treeType: TreeType = when (args[0].lowercase()) {
                      "oak" -> TreeType.TREE
                      "spruce" -> TreeType.REDWOOD
                      "birch" -> TreeType.BIRCH
                      "jungle" -> TreeType.SMALL_JUNGLE
                      "acacia" -> TreeType.ACACIA
                      "dark_oak" -> TreeType.DARK_OAK
                      "cherry" -> TreeType.CHERRY
                      "mangrove" -> TreeType.MANGROVE
                      "big_oak" -> TreeType.BIG_TREE
                      "big_jungle" -> TreeType.JUNGLE
                      else -> { sender.sendMessage("Unknown type!"); return true }
                  }
                  
                  val success: Boolean = sender.world.generateTree(sender.location, treeType)
                  sender.sendMessage(plugin.mm.deserialize(if (success) "<green>🌳 Tree generated!</green>" else "<red>Failed!</red>"))
                  return true
              }
          }
          EOF

          # SchematicCommand
          cat > src/main/kotlin/com/mamad396/builderessentials/commands/SchematicCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Location
          import org.bukkit.Material
          import org.bukkit.block.data.BlockData
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import java.io.File

          class SchematicCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              private val folder: File = File(plugin.dataFolder, "schematics")
              
              init { folder.mkdirs() }
              
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) { sender.sendMessage("Player only!"); return true }
                  if (args.isEmpty()) {
                      sender.sendMessage(plugin.mm.deserialize("<gold>📋 /schematic save/load/list/delete <name></gold>"))
                      return true
                  }
                  
                  when (args[0].lowercase()) {
                      "save" -> { if (args.size >= 2) saveSchematic(sender, args[1]) }
                      "load" -> { if (args.size >= 2) loadSchematic(sender, args[1]) }
                      "list" -> {
                          val files: Array<File>? = folder.listFiles()
                          files?.forEach { sender.sendMessage("• ${it.nameWithoutExtension}") }
                              ?: sender.sendMessage("No schematics saved!")
                      }
                      "delete" -> {
                          if (args.size >= 2) {
                              val file: File = File(folder, "${args[1]}.schem")
                              if (file.delete()) sender.sendMessage(plugin.mm.deserialize("<green>Deleted!</green>"))
                          }
                      }
                  }
                  return true
              }
              
              private fun saveSchematic(player: Player, name: String) {
                  val pos1: Location? = plugin.wandPos1[player.uniqueId]
                  val pos2: Location? = plugin.wandPos2[player.uniqueId]
                  if (pos1 == null || pos2 == null) { player.sendMessage("Select area first!"); return }
                  
                  val file: File = File(folder, "$name.schem")
                  file.bufferedWriter().use { writer ->
                      val minX: Int = minOf(pos1.blockX, pos2.blockX)
                      val maxX: Int = maxOf(pos1.blockX, pos2.blockX)
                      val minY: Int = minOf(pos1.blockY, pos2.blockY)
                      val maxY: Int = maxOf(pos1.blockY, pos2.blockY)
                      val minZ: Int = minOf(pos1.blockZ, pos2.blockZ)
                      val maxZ: Int = maxOf(pos1.blockZ, pos2.blockZ)
                      
                      writer.write("${maxX - minX + 1},${maxY - minY + 1},${maxZ - minZ + 1}\n")
                      for (x in minX..maxX) for (y in minY..maxY) for (z in minZ..maxZ) {
                          val loc: Location = Location(pos1.world, x.toDouble(), y.toDouble(), z.toDouble())
                          val type: Material = loc.block.type
                          if (type != Material.AIR) writer.write("${x - minX},${y - minY},${z - minZ}:$type\n")
                      }
                  }
                  player.sendMessage(plugin.mm.deserialize("<green>✅ Saved: $name</green>"))
              }
              
              private fun loadSchematic(player: Player, name: String) {
                  val file: File = File(folder, "$name.schem")
                  if (!file.exists()) { player.sendMessage("Not found!"); return }
                  
                  val lines: List<String> = file.readLines()
                  val start: Location = player.location
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  
                  for (i in 1 until lines.size) {
                      val parts: List<String> = lines[i].split(":")
                      val coords: List<Int> = parts[0].split(",").map { it.toInt() }
                      val loc: Location = start.clone().add(coords[0].toDouble(), coords[1].toDouble(), coords[2].toDouble())
                      undoMap[loc.clone()] = loc.block.blockData
                      loc.block.type = Material.valueOf(parts[1])
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>✅ Loaded: $name</green>"))
              }
