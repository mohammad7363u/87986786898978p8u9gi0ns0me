          package com.mamad396.builderessentials.listeners

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Location
          import org.bukkit.Material
          import org.bukkit.Particle
          import org.bukkit.Sound
          import org.bukkit.block.data.BlockData
          import org.bukkit.entity.Player
          import org.bukkit.entity.Snowball
          import org.bukkit.event.EventHandler
          import org.bukkit.event.Listener
          import org.bukkit.event.entity.ProjectileHitEvent
          import org.bukkit.scheduler.BukkitRunnable
          import java.util.concurrent.ConcurrentHashMap

          class SnowballListener(private val plugin: BuilderEssentials) : Listener {
              private val activeSnowballs: MutableMap<Snowball, Material> = ConcurrentHashMap()

              @EventHandler
              fun onHit(event: ProjectileHitEvent) {
                  if (event.entity !is Snowball) return
                  val snowball: Snowball = event.entity as Snowball
                  val player: Player = snowball.shooter as? Player ?: return
                  if (!plugin.config.getBoolean("tools.snowball-filler.enabled", true)) return
                  
                  val material: Material = plugin.brushMaterial[player.uniqueId] 
                      ?: player.inventory.itemInOffHand.type.takeIf { it.isBlock } 
                      ?: player.inventory.itemInMainHand.type.takeIf { it.isBlock } 
                      ?: Material.STONE
                  
                  activeSnowballs[snowball] = material
                  
                  val startLoc: Location = player.eyeLocation.clone()
                  val endLoc: Location = snowball.location.clone()
                  val direction = endLoc.toVector().subtract(startLoc.toVector()).normalize()
                  val distance: Double = startLoc.distance(endLoc)
                  val undoMap: MutableMap<Location, BlockData> = mutableMapOf()
                  
                  var current: Location = startLoc.clone()
                  for (i in 0 until distance.toInt()) {
                      current = current.add(direction)
                      val block = current.block
                      if (block.type == Material.AIR || block.type == Material.WATER || block.type == Material.LAVA) {
                          undoMap[current.clone()] = block.blockData
                          block.type = material
                          current.world?.spawnParticle(Particle.SNOWFLAKE, current.clone().add(0.5, 0.5, 0.5), 3, 0.2, 0.2, 0.2, 0.0)
                          current.world?.playSound(current, Sound.BLOCK_STONE_PLACE, 0.1f, 1.5f)
                      }
                  }
                  
                  if (undoMap.isNotEmpty()) plugin.addUndo(player.uniqueId, undoMap)
                  snowball.remove()
              }
          }
