          package com.mamad396.builderessentials.listeners;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Material;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.block.BlockPhysicsEvent;

          public class BlockPhysicsListener implements Listener {
              private final BuilderEssentials plugin;
              
              public BlockPhysicsListener(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              @EventHandler
              public void onBlockPhysics(BlockPhysicsEvent event) {
                  Material material = event.getBlock().getType();
                  
                  // Cancel physics for gravity-affected blocks during building
                  if (material == Material.SAND || 
                      material == Material.RED_SAND || 
                      material == Material.GRAVEL ||
                      material.name().contains("CONCRETE_POWDER") ||
                      material == Material.SCAFFOLDING) {
                      event.setCancelled(true);
                  }
              }
          }
