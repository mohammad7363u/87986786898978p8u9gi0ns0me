        run: |
          cat > src/main/java/com/mamad396/builderessentials/utils/AsyncBlockPlacer.java << 'EOF'
          package com.mamad396.builderessentials.utils;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Bukkit;
          import org.bukkit.Location;
          import org.bukkit.World;
          import org.bukkit.block.data.BlockData;
          import java.util.*;
          import java.util.concurrent.*;

          public class AsyncBlockPlacer {
              
              private final BuilderEssentials plugin;
              private final ExecutorService executorService;
              private final Map<UUID, Queue<PlaceTask>> taskQueues = new ConcurrentHashMap<>();
              private final Set<UUID> processingPlayers = ConcurrentHashMap.newKeySet();
              
              public AsyncBlockPlacer(BuilderEssentials plugin) {
                  this.plugin = plugin;
                  int threads = plugin.getConfig().getInt("performance.parallel-threads", 4);
                  this.executorService = Executors.newFixedThreadPool(threads);
              }
              
              /**
               * Place blocks asynchronously with batched processing
               */
              public void placeBlocksAsync(UUID uuid, Map<Location, BlockData> blocks, Runnable callback) {
                  if (blocks == null || blocks.isEmpty()) {
                      if (callback != null) {
                          Bukkit.getScheduler().runTask(plugin, callback);
                      }
                      return;
                  }
                  
                  // Add to queue
                  Queue<PlaceTask> queue = taskQueues.computeIfAbsent(uuid, 
                      k -> new ConcurrentLinkedQueue<>());
                  queue.add(new PlaceTask(new LinkedHashMap<>(blocks), callback));
                  
                  // Start processing if not already
                  if (processingPlayers.add(uuid)) {
                      processNextBatch(uuid);
                  }
              }
              
              private void processNextBatch(UUID uuid) {
                  Queue<PlaceTask> queue = taskQueues.get(uuid);
                  if (queue == null || queue.isEmpty()) {
                      processingPlayers.remove(uuid);
                      return;
                  }
                  
                  PlaceTask task = queue.peek();
                  if (task == null) {
                      processingPlayers.remove(uuid);
                      return;
                  }
                  
                  int batchSize = plugin.getConfig().getInt("performance.batch-size", 500);
                  
                  // Extract a batch
                  Map<Location, BlockData> batch = new LinkedHashMap<>();
                  Iterator<Map.Entry<Location, BlockData>> iterator = task.blocks.entrySet().iterator();
                  
                  int count = 0;
                  while (iterator.hasNext() && count < batchSize) {
                      Map.Entry<Location, BlockData> entry = iterator.next();
                      batch.put(entry.getKey(), entry.getValue());
                      iterator.remove();
                      count++;
                  }
                  
                  if (batch.isEmpty()) {
                      queue.poll();
                      if (task.callback != null) {
                          Bukkit.getScheduler().runTask(plugin, task.callback);
                      }
                      Bukkit.getScheduler().runTaskLater(plugin, () -> processNextBatch(uuid), 1L);
                      return;
                  }
                  
                  final Map<Location, BlockData> finalBatch = new HashMap<>(batch);
                  
                  // Process in thread pool
                  executorService.submit(() -> {
                      // Prepare blocks
                      Map<Location, BlockData> prepared = new LinkedHashMap<>();
                      World world = null;
                      
                      for (Map.Entry<Location, BlockData> entry : finalBatch.entrySet()) {
                          Location loc = entry.getKey();
                          if (loc != null && loc.getWorld() != null) {
                              if (world == null) world = loc.getWorld();
                              prepared.put(loc.clone(), entry.getValue().clone());
                          }
                      }
                      
                      final World finalWorld = world;
                      
                      // Place on main thread
                      Bukkit.getScheduler().runTask(plugin, () -> {
                          int placed = 0;
                          for (Map.Entry<Location, BlockData> entry : prepared.entrySet()) {
                              try {
                                  Location loc = entry.getKey();
                                  if (loc.getWorld() == null && finalWorld != null) {
                                      loc.setWorld(finalWorld);
                                  }
                                  loc.getBlock().setBlockData(entry.getValue(), false);
                                  placed++;
                              } catch (Exception e) {
                                  // Skip problematic blocks
                              }
                          }
                          
                          // Update stats
                          if (placed > 0) {
                              plugin.databaseManager.updatePlayerStats(uuid, placed, 1);
                          }
                          
                          // Process next batch
                          if (task.blocks.isEmpty()) {
                              queue.poll();
                              if (task.callback != null) {
                                  task.callback.run();
                              }
                          }
                          
                          Bukkit.getScheduler().runTaskLater(plugin, 
                              () -> processNextBatch(uuid), 1L);
                      });
                  });
              }
              
              /**
               * Place blocks synchronously (for small operations)
               */
              public void placeBlocksSync(UUID uuid, Map<Location, BlockData> blocks) {
                  if (blocks == null || blocks.isEmpty()) return;
                  
                  Bukkit.getScheduler().runTask(plugin, () -> {
                      int placed = 0;
                      for (Map.Entry<Location, BlockData> entry : blocks.entrySet()) {
                          try {
                              Location loc = entry.getKey();
                              loc.getBlock().setBlockData(entry.getValue(), false);
                              placed++;
                          } catch (Exception ignored) {}
                      }
                      if (placed > 0) {
                          plugin.databaseManager.updatePlayerStats(uuid, placed, 1);
                      }
                  });
              }
              
              public void shutdown() {
                  executorService.shutdown();
                  try {
                      if (!executorService.awaitTermination(5, TimeUnit.SECONDS)) {
                          executorService.shutdownNow();
                      }
                  } catch (InterruptedException e) {
                      executorService.shutdownNow();
                  }
                  taskQueues.clear();
                  processingPlayers.clear();
              }
              
              /**
               * Internal task class
               */
              private static class PlaceTask {
                  final Map<Location, BlockData> blocks;
                  final Runnable callback;
                  
                  PlaceTask(Map<Location, BlockData> blocks, Runnable callback) {
                      this.blocks = blocks;
                      this.callback = callback;
                  }
              }
          }
