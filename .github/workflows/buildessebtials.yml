      - name: Create ShapeGenerator utility
        run: |
          cat > src/main/kotlin/com/mamad396/builderessentials/shapes/ShapeGenerator.kt << 'EOF'
          package com.mamad396.builderessentials.shapes

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.entity.Player
          import kotlin.math.*

          class ShapeGenerator(private val plugin: BuilderEssentials) {
              
              fun generateCircle(player: Player, center: org.bukkit.Location, radius: Int, material: Material, hollow: Boolean) {
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  for (x in -radius..radius) {
                      for (z in -radius..radius) {
                          val distance = sqrt((x * x + z * z).toDouble())
                          if (distance <= radius + 0.5) {
                              if (hollow && distance < radius - 0.5) continue
                              val loc = center.clone().add(x.toDouble(), 0.0, z.toDouble())
                              undoMap[loc.clone()] = loc.block.blockData
                              loc.block.type = material
                          }
                      }
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>⭕ Circle generated! (${undoMap.size} blocks)</green>"))
              }
              
              fun generateSphere(player: Player, center: org.bukkit.Location, radius: Int, material: Material, hollow: Boolean) {
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  for (x in -radius..radius) {
                      for (y in -radius..radius) {
                          for (z in -radius..radius) {
                              val distance = sqrt((x * x + y * y + z * z).toDouble())
                              if (distance <= radius + 0.5) {
                                  if (hollow && distance < radius - 0.5) continue
                                  val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                                  undoMap[loc.clone()] = loc.block.blockData
                                  loc.block.type = material
                              }
                          }
                      }
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🔵 Sphere generated! (${undoMap.size} blocks)</green>"))
              }
              
              fun generateCube(player: Player, center: org.bukkit.Location, size: Int, material: Material, hollow: Boolean) {
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  val halfSize = size / 2
                  
                  for (x in -halfSize..halfSize) {
                      for (y in -halfSize..halfSize) {
                          for (z in -halfSize..halfSize) {
                              if (hollow && 
                                  x > -halfSize && x < halfSize && 
                                  y > -halfSize && y < halfSize && 
                                  z > -halfSize && z < halfSize) continue
                              
                              val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                              undoMap[loc.clone()] = loc.block.blockData
                              loc.block.type = material
                          }
                      }
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>📦 Cube generated! (${undoMap.size} blocks)</green>"))
              }
              
              fun generateCylinder(player: Player, center: org.bukkit.Location, radius: Int, height: Int, material: Material, hollow: Boolean) {
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  for (x in -radius..radius) {
                      for (y in 0 until height) {
                          for (z in -radius..radius) {
                              val distance = sqrt((x * x + z * z).toDouble())
                              if (distance <= radius + 0.5) {
                                  if (hollow && distance < radius - 0.5 && y > 0 && y < height - 1) continue
                                  val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                                  undoMap[loc.clone()] = loc.block.blockData
                                  loc.block.type = material
                              }
                          }
                      }
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🫙 Cylinder generated! (${undoMap.size} blocks)</green>"))
              }
              
              fun generatePyramid(player: Player, center: org.bukkit.Location, size: Int, material: Material) {
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  for (y in 0 until size) {
                      val currentSize = size - y
                      for (x in -currentSize/2..currentSize/2) {
                          for (z in -currentSize/2..currentSize/2) {
                              val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                              undoMap[loc.clone()] = loc.block.blockData
                              loc.block.type = material
                          }
                      }
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🔺 Pyramid generated! (${undoMap.size} blocks)</green>"))
              }
              
              fun generateCone(player: Player, center: org.bukkit.Location, radius: Int, height: Int, material: Material) {
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  for (y in 0 until height) {
                      val currentRadius = (radius * (height - y) / height.toDouble()).toInt()
                      for (x in -currentRadius..currentRadius) {
                          for (z in -currentRadius..currentRadius) {
                              val distance = sqrt((x * x + z * z).toDouble())
                              if (distance <= currentRadius + 0.5) {
                                  val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                                  undoMap[loc.clone()] = loc.block.blockData
                                  loc.block.type = material
                              }
                          }
                      }
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>📐 Cone generated! (${undoMap.size} blocks)</green>"))
              }
              
              fun generateDome(player: Player, center: org.bukkit.Location, radius: Int, material: Material) {
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  for (x in -radius..radius) {
                      for (y in 0..radius) {
                          for (z in -radius..radius) {
                              val distance = sqrt((x * x + y * y + z * z).toDouble())
                              if (distance <= radius + 0.5 && distance >= radius - 0.5) {
                                  val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                                  undoMap[loc.clone()] = loc.block.blockData
                                  loc.block.type = material
                              }
                          }
                      }
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🏛️ Dome generated! (${undoMap.size} blocks)</green>"))
              }
              
              fun generateTorus(player: Player, center: org.bukkit.Location, radius: Int, material: Material) {
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  val minorRadius = plugin.config.getInt("tools.torus.minor-radius", 3)
                  
                  for (x in -radius-minorRadius..radius+minorRadius) {
                      for (y in -radius-minorRadius..radius+minorRadius) {
                          for (z in -radius-minorRadius..radius+minorRadius) {
                              val d1 = sqrt((x * x + z * z).toDouble()) - radius
                              val distance = sqrt((d1 * d1 + y * y).toDouble())
                              if (distance <= minorRadius + 0.3) {
                                  val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                                  undoMap[loc.clone()] = loc.block.blockData
                                  loc.block.type = material
                              }
                          }
                      }
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🍩 Torus generated! (${undoMap.size} blocks)</green>"))
              }
              
              fun generateSpiral(player: Player, center: org.bukkit.Location, radius: Int, height: Int, material: Material) {
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  val steps = height * 10
                  
                  for (step in 0..steps) {
                      val angle = step * 0.5
                      val y = step.toDouble() / height / 10 * height
                      val x = (cos(angle) * radius).toInt()
                      val z = (sin(angle) * radius).toInt()
                      val loc = center.clone().add(x.toDouble(), y, z.toDouble())
                      undoMap[loc.clone()] = loc.block.blockData
                      loc.block.type = material
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🌀 Spiral generated! (${undoMap.size} blocks)</green>"))
              }
              
              fun generateStaircase(player: Player, center: org.bukkit.Location, width: Int, height: Int, material: Material) {
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  for (step in 0 until height) {
                      for (w in 0 until width) {
                          for (d in 0..step) {
                              val loc = center.clone().add(w.toDouble(), step.toDouble(), d.toDouble())
                              undoMap[loc.clone()] = loc.block.blockData
                              loc.block.type = material
                          }
                      }
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>🪜 Staircase generated! (${undoMap.size} blocks)</green>"))
              }
          }
          EOF

      - name: Create pom.xml
        run: |
          cat > pom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.mamad396</groupId>
              <artifactId>BuilderEssentials</artifactId>
              <version>1.0</version>
              <packaging>jar</packaging>
              
              <properties>
                  <kotlin.version>1.9.22</kotlin.version>
                  <java.version>21</java.version>
              </properties>
              
              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>
              
              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
                  <dependency>
                      <groupId>org.jetbrains.kotlin</groupId>
                      <artifactId>kotlin-stdlib</artifactId>
                      <version>${kotlin.version}</version>
                      <scope>compile</scope>
                  </dependency>
              </dependencies>
              
              <build>
                  <sourceDirectory>src/main/kotlin</sourceDirectory>
                  <plugins>
                      <plugin>
                          <groupId>org.jetbrains.kotlin</groupId>
                          <artifactId>kotlin-maven-plugin</artifactId>
                          <version>${kotlin.version}</version>
                          <executions>
                              <execution>
                                  <id>compile</id>
                                  <phase>compile</phase>
                                  <goals><goal>compile</goal></goals>
                              </execution>
                          </executions>
                          <configuration>
                              <jvmTarget>21</jvmTarget>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <source>21</source>
                              <target>21</target>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-shade-plugin</artifactId>
                          <version>3.5.1</version>
                          <executions>
                              <execution>
                                  <phase>package</phase>
                                  <goals><goal>shade</goal></goals>
                                  <configuration>
                                      <relocations>
                                          <relocation>
                                              <pattern>kotlin</pattern>
                                              <shadedPattern>com.mamad396.builderessentials.kotlin</shadedPattern>
                                          </relocation>
                                      </relocations>
                                  </configuration>
                              </execution>
                          </executions>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

