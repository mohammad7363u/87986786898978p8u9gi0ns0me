          # CopyCommand
          cat > src/main/java/com/mamad396/builderessentials/commands/CopyCommand.java << 'EOF'
          package com.mamad396.builderessentials.commands;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Location;
          import org.bukkit.entity.Player;
          import org.bukkit.command.*;
          import java.util.*;

          public class CopyCommand implements CommandExecutor {
              private final BuilderEssentials plugin;
              public CopyCommand(BuilderEssentials plugin) { this.plugin = plugin; }
              
              @Override
              public boolean onCommand(CommandSender s, Command c, String l, String[] a) {
                  if (!(s instanceof Player)) return true;
                  Player p = (Player) s;
                  if (!p.hasPermission("builder.copy")) { p.sendMessage("§cNo permission!"); return true; }
                  
                  Location pos1 = plugin.wandPos1.get(p.getUniqueId());
                  Location pos2 = plugin.wandPos2.get(p.getUniqueId());
                  if (pos1 == null || pos2 == null) { p.sendMessage("§cSelect area first!"); return true; }
                  
                  Map<Location, org.bukkit.block.data.BlockData> copy = new HashMap<>();
                  int minX = Math.min(pos1.getBlockX(), pos2.getBlockX());
                  int maxX = Math.max(pos1.getBlockX(), pos2.getBlockX());
                  int minY = Math.min(pos1.getBlockY(), pos2.getBlockY());
                  int maxY = Math.max(pos1.getBlockY(), pos2.getBlockY());
                  int minZ = Math.min(pos1.getBlockZ(), pos2.getBlockZ());
                  int maxZ = Math.max(pos1.getBlockZ(), pos2.getBlockZ());
                  
                  for (int x = minX; x <= maxX; x++)
                      for (int y = minY; y <= maxY; y++)
                          for (int z = minZ; z <= maxZ; z++) {
                              Location loc = new Location(pos1.getWorld(), x, y, z);
                              copy.put(loc.clone(), loc.getBlock().getBlockData().clone());
                          }
                  
                  plugin.clipboard.put(p.getUniqueId(), copy);
                  p.sendMessage("§a📋 Copied " + copy.size() + " blocks!");
                  return true;
              }
          }
          EOF

          # PasteCommand
          cat > src/main/java/com/mamad396/builderessentials/commands/PasteCommand.java << 'EOF'
          package com.mamad396.builderessentials.commands;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.entity.Player;
          import org.bukkit.command.*;
          import java.util.*;

          public class PasteCommand implements CommandExecutor {
              private final BuilderEssentials plugin;
              public PasteCommand(BuilderEssentials plugin) { this.plugin = plugin; }
              
              @Override
              public boolean onCommand(CommandSender s, Command c, String l, String[] a) {
                  if (!(s instanceof Player)) return true;
                  Player p = (Player) s;
                  if (!p.hasPermission("builder.paste")) { p.sendMessage("§cNo permission!"); return true; }
                  
                  Map<Location, BlockData> clipboard = plugin.clipboard.get(p.getUniqueId());
                  if (clipboard == null || clipboard.isEmpty()) { p.sendMessage("§cNothing copied!"); return true; }
                  
                  Location start = p.getLocation();
                  Material mask = plugin.maskMaterial.get(p.getUniqueId());
                  Map<Location, BlockData> undoMap = new HashMap<>();
                  
                  for (Map.Entry<Location, BlockData> entry : clipboard.entrySet()) {
                      Location pasteLoc = start.clone().add(
                          entry.getKey().getX() - getMinLoc(clipboard).getX(),
                          entry.getKey().getY() - getMinLoc(clipboard).getY(),
                          entry.getKey().getZ() - getMinLoc(clipboard).getZ()
                      );
                      
                      if (mask != null && pasteLoc.getBlock().getType() != mask) continue;
                      
                      undoMap.put(pasteLoc.clone(), pasteLoc.getBlock().getBlockData().clone());
                  }
                  
                  plugin.asyncPlacer.queuePlacement(p.getUniqueId(), undoMap, () -> {
                      p.sendMessage("§a📌 Pasted " + undoMap.size() + " blocks!");
                  });
                  
                  return true;
              }
              
              private Location getMinLoc(Map<Location, ?> map) {
                  int minX = Integer.MAX_VALUE, minY = Integer.MAX_VALUE, minZ = Integer.MAX_VALUE;
                  for (Location loc : map.keySet()) {
                      if (loc.getX() < minX) minX = (int) loc.getX();
                      if (loc.getY() < minY) minY = (int) loc.getY();
                      if (loc.getZ() < minZ) minZ = (int) loc.getZ();
                  }
                  return new Location(null, minX, minY, minZ);
              }
          }
          EOF

          # RotateCommand
          cat > src/main/java/com/mamad396/builderessentials/commands/RotateCommand.java << 'EOF'
          package com.mamad396.builderessentials.commands;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Location;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.entity.Player;
          import org.bukkit.command.*;
          import java.util.*;

          public class RotateCommand implements CommandExecutor {
              private final BuilderEssentials plugin;
              public RotateCommand(BuilderEssentials plugin) { this.plugin = plugin; }
              
              @Override
              public boolean onCommand(CommandSender s, Command c, String l, String[] a) {
                  if (!(s instanceof Player)) return true;
                  Player p = (Player) s;
                  if (!p.hasPermission("builder.rotate")) { p.sendMessage("§cNo permission!"); return true; }
                  
                  Map<Location, BlockData> clipboard = plugin.clipboard.get(p.getUniqueId());
                  if (clipboard == null || clipboard.isEmpty()) { p.sendMessage("§cNothing copied!"); return true; }
                  
                  int angle = a.length > 0 ? Integer.parseInt(a[0]) : 90;
                  Map<Location, BlockData> rotated = rotate90(clipboard, angle);
                  plugin.clipboard.put(p.getUniqueId(), rotated);
                  p.sendMessage("§a🔄 Rotated clipboard by " + angle + "°");
                  return true;
              }
              
              private Map<Location, BlockData> rotate90(Map<Location, BlockData> original, int angle) {
                  Map<Location, BlockData> result = new HashMap<>();
                  Location min = getCenter(original);
                  
                  for (Map.Entry<Location, BlockData> entry : original.entrySet()) {
                      Location loc = entry.getKey();
                      double dx = loc.getX() - min.getX();
                      double dz = loc.getZ() - min.getZ();
                      
                      double newX = dx * Math.cos(Math.toRadians(angle)) - dz * Math.sin(Math.toRadians(angle));
                      double newZ = dx * Math.sin(Math.toRadians(angle)) + dz * Math.cos(Math.toRadians(angle));
                      
                      Location newLoc = new Location(loc.getWorld(), 
                          min.getX() + newX, loc.getY(), min.getZ() + newZ);
                      result.put(newLoc, entry.getValue());
                  }
                  return result;
              }
              
              private Location getCenter(Map<Location, ?> map) {
                  double cx = 0, cz = 0;
                  for (Location loc : map.keySet()) { cx += loc.getX(); cz += loc.getZ(); }
                  return new Location(null, cx / map.size(), 0, cz / map.size());
              }
          }
          EOF

