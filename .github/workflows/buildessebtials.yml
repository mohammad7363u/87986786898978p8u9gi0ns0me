          cat > src/main/kotlin/com/mamad396/builderessentials/commands/SchematicCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Location
          import org.bukkit.Material
          import org.bukkit.block.data.BlockData
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player
          import java.io.File

          class SchematicCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              private val folder = File(plugin.dataFolder, "schematics")
              
              init {
                  if (!folder.exists()) folder.mkdirs()
              }
              
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) {
                      sender.sendMessage("Player only!")
                      return true
                  }
                  
                  if (args.isEmpty() || args[0].equals("help", true)) {
                      sender.sendMessage(plugin.mm.deserialize("<gold><bold>📋 Schematic Manager</bold></gold>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/schematic save <name></white><gray> - Save selection</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/schematic load <name></white><gray> - Load schematic</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/schematic list</white><gray> - List schematics</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<white>/schematic delete <name></white><gray> - Delete schematic</gray>"))
                      sender.sendMessage(plugin.mm.deserialize("<yellow>💡 Use wand to select area first!</yellow>"))
                      return true
                  }
                  
                  try {
                      when (args[0].lowercase()) {
                          "save" -> {
                              if (args.size < 2) { sender.sendMessage("Usage: /schematic save <name>"); return true }
                              saveSchematic(sender, args[1])
                          }
                          "load" -> {
                              if (args.size < 2) { sender.sendMessage("Usage: /schematic load <name>"); return true }
                              loadSchematic(sender, args[1])
                          }
                          "list" -> listSchematics(sender)
                          "delete" -> {
                              if (args.size < 2) { sender.sendMessage("Usage: /schematic delete <name>"); return true }
                              deleteSchematic(sender, args[1])
                          }
                      }
                  } catch (e: Exception) {
                      sender.sendMessage(plugin.mm.deserialize("<red>Schematic error: ${e.message}</red>"))
                  }
                  return true
              }
              
              private fun saveSchematic(player: Player, name: String) {
                  val pos1 = plugin.wandPos1[player.uniqueId]
                  val pos2 = plugin.wandPos2[player.uniqueId]
                  if (pos1 == null || pos2 == null) {
                      player.sendMessage(plugin.mm.deserialize("<red>Select area with wand first!</red>"))
                      return
                  }
                  
                  val file = File(folder, "$name.schem")
                  file.bufferedWriter().use { writer ->
                      val minX = minOf(pos1.blockX, pos2.blockX)
                      val maxX = maxOf(pos1.blockX, pos2.blockX)
                      val minY = minOf(pos1.blockY, pos2.blockY)
                      val maxY = maxOf(pos1.blockY, pos2.blockY)
                      val minZ = minOf(pos1.blockZ, pos2.blockZ)
                      val maxZ = maxOf(pos1.blockZ, pos2.blockZ)
                      
                      writer.write("${maxX - minX + 1},${maxY - minY + 1},${maxZ - minZ + 1}\n")
                      var count = 0
                      for (x in minX..maxX) for (y in minY..maxY) for (z in minZ..maxZ) {
                          val loc = Location(pos1.world, x.toDouble(), y.toDouble(), z.toDouble())
                          val type = loc.block.type
                          if (type != Material.AIR) {
                              writer.write("${x - minX},${y - minY},${z - minZ}:${type.name}\n")
                              count++
                          }
                      }
                      player.sendMessage(plugin.mm.deserialize("<green>✅ Saved '$name' ($count blocks)</green>"))
                  }
              }
              
              private fun loadSchematic(player: Player, name: String) {
                  val file = File(folder, "$name.schem")
                  if (!file.exists()) {
                      player.sendMessage(plugin.mm.deserialize("<red>Schematic '$name' not found!</red>"))
                      return
                  }
                  
                  val lines = file.readLines()
                  if (lines.isEmpty()) return
                  
                  val start = player.location
                  val undoMap = HashMap<Location, BlockData>()
                  
                  for (i in 1 until lines.size) {
                      val parts = lines[i].split(":")
                      if (parts.size != 2) continue
                      val coords = parts[0].split(",").map { it.toInt() }
                      val loc = start.clone().add(coords[0].toDouble(), coords[1].toDouble(), coords[2].toDouble())
                      undoMap[loc.clone()] = loc.block.blockData
                      loc.block.type = Material.valueOf(parts[1])
                  }
                  
                  plugin.addUndo(player.uniqueId, undoMap)
                  player.sendMessage(plugin.mm.deserialize("<green>✅ Loaded '$name' (${undoMap.size} blocks)</green>"))
              }
              
              private fun listSchematics(player: Player) {
                  val files = folder.listFiles { f -> f.name.endsWith(".schem") }
                  if (files.isNullOrEmpty()) {
                      player.sendMessage(plugin.mm.deserialize("<gray>No schematics saved yet.</gray>"))
                      return
                  }
                  player.sendMessage(plugin.mm.deserialize("<gold><bold>📋 Saved Schematics:</bold></gold>"))
                  files.forEach { file ->
                      player.sendMessage(plugin.mm.deserialize("<white>• ${file.nameWithoutExtension}</white><gray> (${file.length() / 1024} KB)</gray>"))
                  }
              }
              
              private fun deleteSchematic(player: Player, name: String) {
                  val file = File(folder, "$name.schem")
                  if (file.delete()) {
                      player.sendMessage(plugin.mm.deserialize("<green>✅ Deleted '$name'</green>"))
                  } else {
                      player.sendMessage(plugin.mm.deserialize("<red>Schematic not found!</red>"))
                  }
              }
          }
          EOF

