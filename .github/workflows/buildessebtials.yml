                          if (args.size < 2) {
                              sender.sendMessage(plugin.mm.deserialize("<red>Usage: /palette save <name></red>"))
                              return true
                          }
                          val palette = mutableListOf<Material>()
                          for (i in 0..8) {
                              val item = sender.inventory.getItem(i)
                              if (item != null && item.type.isBlock) {
                                  palette.add(item.type)
                              }
                          }
                          if (palette.isEmpty()) {
                              sender.sendMessage(plugin.mm.deserialize("<red>No blocks in hotbar!</red>"))
                              return true
                          }
