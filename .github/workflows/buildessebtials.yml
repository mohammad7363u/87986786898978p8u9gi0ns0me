          # StackCommand
          cat > src/main/java/com/mamad396/builderessentials/commands/StackCommand.java << 'EOF'
          package com.mamad396.builderessentials.commands;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Location;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.entity.Player;
          import org.bukkit.command.*;
          import java.util.*;

          public class StackCommand implements CommandExecutor {
              private final BuilderEssentials plugin;
              public StackCommand(BuilderEssentials plugin) { this.plugin = plugin; }
              
              @Override
              public boolean onCommand(CommandSender s, Command c, String l, String[] a) {
                  if (!(s instanceof Player)) return true;
                  Player p = (Player) s;
                  if (!p.hasPermission("builder.stack")) { p.sendMessage("§cNo permission!"); return true; }
                  
                  Map<Location, BlockData> clipboard = plugin.clipboard.get(p.getUniqueId());
                  if (clipboard == null || clipboard.isEmpty()) { p.sendMessage("§cNothing copied! Use /copy first"); return true; }
                  
                  int count = a.length > 0 ? Integer.parseInt(a[0]) : 3;
                  String dir = a.length > 1 ? a[1].toLowerCase() : "up";
                  
                  Map<Location, BlockData> undoMap = new HashMap<>();
                  int height = getHeight(clipboard);
                  
                  for (int i = 1; i <= count; i++) {
                      int offsetX = 0, offsetY = 0, offsetZ = 0;
                      switch (dir) {
                          case "up": offsetY = height * i; break;
                          case "down": offsetY = -height * i; break;
                          case "north": offsetZ = -height * i; break;
                          case "south": offsetZ = height * i; break;
                          case "east": offsetX = height * i; break;
                          case "west": offsetX = -height * i; break;
                      }
                      
                      for (Map.Entry<Location, BlockData> entry : clipboard.entrySet()) {
                          Location pasteLoc = entry.getKey().clone().add(offsetX, offsetY, offsetZ);
                          undoMap.put(pasteLoc, entry.getValue());
                      }
                  }
                  
                  plugin.asyncPlacer.queuePlacement(p.getUniqueId(), undoMap, () -> {
                      p.sendMessage("§a📚 Stacked " + count + " times!");
                  });
                  return true;
              }
              
              private int getHeight(Map<Location, ?> map) {
                  int minY = Integer.MAX_VALUE, maxY = Integer.MIN_VALUE;
                  for (Location loc : map.keySet()) {
                      if (loc.getBlockY() < minY) minY = loc.getBlockY();
                      if (loc.getBlockY() > maxY) maxY = loc.getBlockY();
                  }
                  return maxY - minY + 1;
              }
          }
          EOF

          # FlipCommand
          cat > src/main/java/com/mamad396/builderessentials/commands/FlipCommand.java << 'EOF'
          package com.mamad396.builderessentials.commands;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Location;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.entity.Player;
          import org.bukkit.command.*;
          import java.util.*;

          public class FlipCommand implements CommandExecutor {
              private final BuilderEssentials plugin;
              public FlipCommand(BuilderEssentials plugin) { this.plugin = plugin; }
              
              @Override
              public boolean onCommand(CommandSender s, Command c, String l, String[] a) {
                  if (!(s instanceof Player)) return true;
                  Player p = (Player) s;
                  if (!p.hasPermission("builder.flip")) { p.sendMessage("§cNo permission!"); return true; }
                  
                  Map<Location, BlockData> clipboard = plugin.clipboard.get(p.getUniqueId());
                  if (clipboard == null || clipboard.isEmpty()) { p.sendMessage("§cNothing copied!"); return true; }
                  
                  String axis = a.length > 0 ? a[0].toLowerCase() : "x";
                  Map<Location, BlockData> flipped = flip(clipboard, axis);
                  plugin.clipboard.put(p.getUniqueId(), flipped);
                  p.sendMessage("§a🔁 Flipped on " + axis.toUpperCase() + " axis!");
                  return true;
              }
              
              private Map<Location, BlockData> flip(Map<Location, BlockData> original, String axis) {
                  Map<Location, BlockData> result = new HashMap<>();
                  double[] center = getCenter(original);
                  
                  for (Map.Entry<Location, BlockData> entry : original.entrySet()) {
                      Location loc = entry.getKey().clone();
                      
                      switch (axis) {
                          case "x": loc.setX(2 * center[0] - loc.getX()); break;
                          case "y": loc.setY(2 * center[1] - loc.getY()); break;
                          case "z": loc.setZ(2 * center[2] - loc.getZ()); break;
                      }
                      
                      result.put(loc, entry.getValue());
                  }
                  return result;
              }
              
              private double[] getCenter(Map<Location, ?> map) {
                  double cx = 0, cy = 0, cz = 0;
                  for (Location loc : map.keySet()) {
                      cx += loc.getX(); cy += loc.getY(); cz += loc.getZ();
                  }
                  return new double[]{cx / map.size(), cy / map.size(), cz / map.size()};
              }
          }
          EOF

