          package com.mamad396.builderessentials.listeners

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.event.EventHandler
          import org.bukkit.event.Listener
          import org.bukkit.event.block.BlockBreakEvent
          import java.util.LinkedList

          class VeinMinerListener(private val plugin: BuilderEssentials) : Listener {
              @EventHandler
              fun onBreak(event: BlockBreakEvent) {
                  if (!plugin.config.getBoolean("tools.vein-miner.enabled")) return
                  val player = event.player
                  if (!player.hasPermission("builder.veinminer")) return
                  if (!player.isSneaking) return
                  
                  val block = event.block
                  val targetType = block.type
                  val maxVein = plugin.config.getInt("tools.vein-miner.max-vein")
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  val visited = mutableSetOf<org.bukkit.Location>()
                  val queue = LinkedList<org.bukkit.Location>()
                  
                  queue.add(block.location)
                  
                  while (queue.isNotEmpty() && undoMap.size < maxVein) {
                      val current = queue.poll()
                      if (current in visited) continue
                      visited.add(current)
                      
                      if (current.block.type == targetType) {
                          undoMap[current.clone()] = current.block.blockData
                          current.block.type = Material.AIR
                          
                          // Check adjacent blocks
                          for (dx in -1..1) {
                              for (dy in -1..1) {
                                  for (dz in -1..1) {
                                      if (dx == 0 && dy == 0 && dz == 0) continue
                                      val next = current.clone().add(dx.toDouble(), dy.toDouble(), dz.toDouble())
                                      if (next.block.type == targetType && next !in visited) {
                                          queue.add(next)
                                      }
                                  }
                              }
                          }
                      }
                  }
                  
                  if (undoMap.isNotEmpty()) {
                      plugin.addUndo(player.uniqueId, undoMap)
                  }
              }
          }
