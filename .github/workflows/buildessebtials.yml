                          sender.sendMessage(plugin.mm.deserialize("<gold><bold>🎨 Your Palettes:</bold></gold>"))
                          palettes.forEach { (name, mats) ->
                              sender.sendMessage(plugin.mm.deserialize("<white>• $name</white> <gray>(${mats.size} blocks)</gray>"))
                          }
                      }
                      "delete" -> {
                          if (args.size < 2) {
                              sender.sendMessage(plugin.mm.deserialize("<red>Usage: /palette delete <name></red>"))
                              return true
                          }
                          val removed = plugin.palettes[sender.uniqueId]?.remove(args[1])
                          if (removed != null) {
                              sender.sendMessage(plugin.mm.deserialize("<green>✅ Palette deleted: ${args[1]}</green>"))
                          } else {
                              sender.sendMessage(plugin.mm.deserialize("<red>Palette not found!</red>"))
                          }
                      }
                  }
                  return true
              }
          }
          EOF

          # UndoCommand.kt
          cat > src/main/kotlin/com/mamad396/builderessentials/commands/UndoCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player

          class UndoCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) {
                      sender.sendMessage("Player only!")
                      return true
                  }
                  
                  val history = plugin.undoHistory[sender.uniqueId]
                  if (history == null || history.isEmpty()) {
                      sender.sendMessage(plugin.mm.deserialize("<red>Nothing to undo!</red>"))
                      return true
                  }
                  
                  val lastAction = history.pop()
                  val redoInfo = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  lastAction.forEach { (loc, blockData) ->
                      redoInfo[loc.clone()] = loc.block.blockData
                      loc.block.blockData = blockData
                  }
                  
                  plugin.redoHistory.getOrPut(sender.uniqueId) { java.util.Stack() }.push(redoInfo)
                  
                  sender.sendMessage(plugin.mm.deserialize("<green>↩️ Undo! (${lastAction.size} blocks restored)</green>"))
                  return true
              }
          }
          EOF

