              public boolean onCommand(CommandSender s, Command c, String l, String[] a) {
                  if (!(s instanceof Player)) return true;
                  Player p = (Player) s;
                  
                  if (a.length == 0 || a[0].equalsIgnoreCase("clear")) {
                      plugin.maskMaterial.remove(p.getUniqueId());
                      p.sendMessage("§a✅ Mask cleared! Pasting on all blocks.");
                      return true;
                  }
                  
                  try {
                      Material mat = Material.valueOf(a[0].toUpperCase());
                      plugin.maskMaterial.put(p.getUniqueId(), mat);
                      p.sendMessage("§a🎭 Mask set to: " + mat.name() + " (only replaces this block)");
                  } catch (Exception e) {
                      p.sendMessage("§cInvalid material: " + a[0]);
                  }
                  return true;
              }
          }
