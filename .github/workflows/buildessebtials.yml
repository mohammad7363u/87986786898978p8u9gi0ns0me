          # GridCommand.kt
          cat > src/main/kotlin/com/mamad396/builderessentials/commands/GridCommand.kt << 'EOF'
          package com.mamad396.builderessentials.commands

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.command.Command
          import org.bukkit.command.CommandExecutor
          import org.bukkit.command.CommandSender
          import org.bukkit.entity.Player

          class GridCommand(private val plugin: BuilderEssentials) : CommandExecutor {
              override fun onCommand(sender: CommandSender, command: Command, label: String, args: Array<out String>): Boolean {
                  if (sender !is Player) {
                      sender.sendMessage("Player only!")
                      return true
                  }
                  
                  if (args.isEmpty()) {
                      val isGrid = plugin.gridToggled.getOrDefault(sender.uniqueId, false)
                      val isSnapping = plugin.snapGrid.getOrDefault(sender.uniqueId, false)
                      val size = plugin.gridSize.getOrDefault(sender.uniqueId, 16)
                      
                      sender.sendMessage(plugin.mm.deserialize(
                          """
                          <gold><bold>📐 Grid System</bold></gold>
                          
                          <gray>Grid visible: <white>$isGrid</white></gray>
                          <gray>Snap to grid: <white>$isSnapping</white></gray>
                          <gray>Grid size: <white>$size</white></gray>
                          
                          <white>/grid on</white> <gray>- Show grid overlay</gray>
                          <white>/grid off</white> <gray>- Hide grid overlay</gray>
                          <white>/grid snap</white> <gray>- Toggle snap to grid</gray>
                          <white>/grid size <number></white> <gray>- Set grid size (8, 16, 32, 64)</gray>
                          """.trimIndent()
                      ))
                      return true
                  }
                  
                  when (args[0].lowercase()) {
                      "on" -> {
                          plugin.gridToggled[sender.uniqueId] = true
                          sender.sendMessage(plugin.mm.deserialize("<green>📐 Grid overlay enabled!</green>"))
                      }
                      "off" -> {
                          plugin.gridToggled[sender.uniqueId] = false
                          sender.sendMessage(plugin.mm.deserialize("<red>Grid overlay disabled!</red>"))
                      }
                      "snap" -> {
                          val current = plugin.snapGrid.getOrDefault(sender.uniqueId, false)
                          plugin.snapGrid[sender.uniqueId] = !current
                          sender.sendMessage(plugin.mm.deserialize(
                              if (!current) "<green>📌 Snap to grid enabled!</green>" 
                              else "<red>Snap to grid disabled!</red>"
                          ))
                      }
                      "size" -> {
                          val size = args.getOrNull(1)?.toIntOrNull()
                          if (size == null || size !in listOf(4, 8, 16, 32, 64)) {
                              sender.sendMessage(plugin.mm.deserialize("<red>Valid sizes: 4, 8, 16, 32, 64</red>"))
                              return true
                          }
                          plugin.gridSize[sender.uniqueId] = size
                          sender.sendMessage(plugin.mm.deserialize("<green>✅ Grid size set to $size</green>"))
                      }
                  }
                  return true
              }
          }
          EOF

