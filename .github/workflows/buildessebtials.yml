          package com.mamad396.builderessentials.listeners;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.block.Action;
          import org.bukkit.event.player.PlayerInteractEvent;
          import java.util.*;

          public class MeasureListener implements Listener {
              private final BuilderEssentials plugin;
              private final Map<UUID, Location> measureStartPoints = new HashMap<>();
              
              public MeasureListener(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              @EventHandler
              public void onMeasureTool(PlayerInteractEvent event) {
                  if (event.getItem() == null) return;
                  if (event.getItem().getType() != Material.COMPASS) return;
                  if (!plugin.getConfig().getBoolean("tools.measure-tool.enabled", true)) return;
                  
                  event.setCancelled(true);
                  
                  if (event.getAction() == Action.LEFT_CLICK_BLOCK || 
                      event.getAction() == Action.LEFT_CLICK_AIR) {
                      Location loc = event.getClickedBlock() != null ? 
                          event.getClickedBlock().getLocation() : event.getPlayer().getLocation();
                      measureStartPoints.put(event.getPlayer().getUniqueId(), loc.clone());
                      plugin.sendMessage(event.getPlayer(), 
                          "&a📏 &7Start: &f" + loc.getBlockX() + "&7, &f" + 
                          loc.getBlockY() + "&7, &f" + loc.getBlockZ());
                      
                  } else if (event.getAction() == Action.RIGHT_CLICK_BLOCK || 
                             event.getAction() == Action.RIGHT_CLICK_AIR) {
                      Location start = measureStartPoints.get(event.getPlayer().getUniqueId());
                      if (start == null) {
                          plugin.sendMessage(event.getPlayer(), "&cSet start point first! (Left click)");
                          return;
                      }
                      
                      Location end = event.getClickedBlock() != null ? 
                          event.getClickedBlock().getLocation() : event.getPlayer().getLocation();
                      double distance = start.distance(end);
                      int dx = Math.abs(end.getBlockX() - start.getBlockX());
                      int dy = Math.abs(end.getBlockY() - start.getBlockY());
                      int dz = Math.abs(end.getBlockZ() - start.getBlockZ());
                      
                      plugin.sendMessage(event.getPlayer(), 
                          "&6📏 &7Distance: &f" + String.format("%.1f", distance) + " &7blocks");
                      plugin.sendMessage(event.getPlayer(), 
                          "&7  X: &f" + dx + " &7Y: &f" + dy + " &7Z: &f" + dz + 
                          " &7| Volume: &f" + String.format("%,d", dx * dy * dz));
                  }
              }
          }
