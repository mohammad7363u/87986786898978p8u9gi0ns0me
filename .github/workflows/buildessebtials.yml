name: Build BuilderEssentials v2.0

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Create project structure
        run: |
          mkdir -p src/main/java/com/mamad396/builderessentials
          mkdir -p src/main/java/com/mamad396/builderessentials/commands
          mkdir -p src/main/java/com/mamad396/builderessentials/listeners
          mkdir -p src/main/java/com/mamad396/builderessentials/shapes
          mkdir -p src/main/java/com/mamad396/builderessentials/utils
          mkdir -p src/main/java/com/mamad396/builderessentials/data
          mkdir -p src/main/resources
          mkdir -p releases

      - name: Create plugin.yml
        run: |
          cat > src/main/resources/plugin.yml << 'EOF'
          name: BuilderEssentials
          version: 2.0.0
          main: com.mamad396.builderessentials.BuilderEssentials
          api-version: '1.20'
          author: mamad396
          description: Ultimate building tools v2.0 - Async, Preview, Rotate, Flip & more
          softdepend: [FastAsyncWorldEdit, Vault, WorldGuard, GriefPrevention]
          
          commands:
            builder:
              description: Main builder command
              aliases: [be, buildertools, bt]
            wand:
              description: Get selection wand
            fill:
              description: Fill tools menu
              aliases: [filler, paint]
            shapes:
              description: Shape generator
              aliases: [gen, generate]
            terrain:
              description: Terrain tools
              aliases: [terra, land]
            tree:
              description: Tree generator
            schematic:
              description: Schematic manager
              aliases: [schem, blueprint]
            undo:
              description: Undo last action
            redo:
              description: Redo action
            palette:
              description: Block palette manager
              aliases: [colors, blocks]
            brush:
              description: Brush settings
              aliases: [br]
            grid:
              description: Build grid system
            measure:
              description: Measure distance tool
            copy:
              description: Copy selection
            paste:
              description: Paste clipboard
            rotate:
              description: Rotate clipboard
            flip:
              description: Flip clipboard
            stack:
              description: Stack selection
            mask:
              description: Set paste mask
            drain:
              description: Drain liquids
            preview:
              description: Toggle particle preview
          EOF

      - name: Create config.yml
        run: |
          cat > src/main/resources/config.yml << 'EOF'
          config-version: 2.0.0
          prefix: "&8[&6🏗️&8] &7"
          
          performance:
            async-processing: true
            batch-size: 500
            max-blocks-per-tick: 1000
            max-undo-history: 50
            auto-save-interval: 300
          
          limits:
            max-blocks-per-action: 100000
            max-radius: 100
            cooldown-seconds: 1
            per-player-daily-limit: 500000
          
          database:
            type: sqlite
            auto-save: true
            save-interval: 300
          
          preview:
            enabled: true
            particle: ELECTRIC_SPARK
            density: 0.3
            duration-ticks: 100
          
          undo:
            max-history: 50
            compress-old: true
          
          tools:
            snowball-filler:
              enabled: true
              permission: builder.filler.snowball
              max-distance: 50
            egg-filler:
              enabled: true
              permission: builder.filler.egg
            arrow-placer:
              enabled: true
              permission: builder.filler.arrow
            ender-pearl-fill:
              enabled: true
              permission: builder.filler.pearl
              radius: 3
            trident-builder:
              enabled: true
              permission: builder.filler.trident
            selection-wand:
              enabled: true
              permission: builder.wand
            paint-wand:
              enabled: true
              permission: builder.paint
            fast-break:
              enabled: true
              permission: builder.fastbreak
            vein-miner:
              enabled: true
              permission: builder.veinminer
              max-vein: 64
            brush-size:
              min: 1
              max: 20
              default: 3
            torus:
              minor-radius: 3
            measure-tool:
              enabled: true
              permission: builder.measure
          EOF

      - name: Create main plugin class
        run: |
          cat > src/main/java/com/mamad396/builderessentials/BuilderEssentials.java << 'JAVAEOF'
          package com.mamad396.builderessentials;

          import com.mamad396.builderessentials.commands.*;
          import com.mamad396.builderessentials.listeners.*;
          import com.mamad396.builderessentials.utils.*;
          import com.mamad396.builderessentials.data.*;
          import org.bukkit.Bukkit;
          import org.bukkit.ChatColor;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.plugin.java.JavaPlugin;
          import java.util.*;
          import java.util.concurrent.ConcurrentHashMap;

          public class BuilderEssentials extends JavaPlugin {
              private static BuilderEssentials instance;
              
              public Map<UUID, Location> wandPos1 = new ConcurrentHashMap<>();
              public Map<UUID, Location> wandPos2 = new ConcurrentHashMap<>();
              public Map<UUID, Integer> brushSize = new ConcurrentHashMap<>();
              public Map<UUID, Material> brushMaterial = new ConcurrentHashMap<>();
              public Map<UUID, Stack<Map<Location, BlockData>>> undoHistory = new ConcurrentHashMap<>();
              public Map<UUID, Stack<Map<Location, BlockData>>> redoHistory = new ConcurrentHashMap<>();
              public Map<UUID, Map<String, List<Material>>> palettes = new ConcurrentHashMap<>();
              public Map<UUID, Boolean> gridToggled = new ConcurrentHashMap<>();
              public Map<UUID, Boolean> snapGrid = new ConcurrentHashMap<>();
              public Map<UUID, Integer> gridSize = new ConcurrentHashMap<>();
              public Map<UUID, Boolean> previewEnabled = new ConcurrentHashMap<>();
              public Map<UUID, Map<Location, BlockData>> clipboard = new ConcurrentHashMap<>();
              public Map<UUID, Long> lastAction = new ConcurrentHashMap<>();
              public Map<UUID, Integer> dailyBlockCount = new ConcurrentHashMap<>();
              public Map<UUID, Material> maskMaterial = new ConcurrentHashMap<>();
              
              public DatabaseManager databaseManager;
              public AsyncBlockPlacer asyncPlacer;
              
              @Override
              public void onEnable() {
                  instance = this;
                  saveDefaultConfig();
                  
                  databaseManager = new DatabaseManager(this);
                  asyncPlacer = new AsyncBlockPlacer(this);
                  
                  registerCommands();
                  registerListeners();
                  startTasks();
                  
                  getLogger().info("§6🏗️ BuilderEssentials v2.0 Ultimate enabled!");
                  getLogger().info("§7  ⚡ Async Processing | 🎨 Preview | 🔄 Rotate/Flip");
                  getLogger().info("§7  💾 SQLite | 🔒 Permissions | 🛡️ Anti-Physics");
              }
              
              @Override
              public void onDisable() {
                  asyncPlacer.shutdown();
                  databaseManager.closeConnection();
                  getLogger().info("BuilderEssentials v2.0 disabled!");
              }
              
              private void registerCommands() {
                  getCommand("builder").setExecutor(new MainCommand(this));
                  getCommand("wand").setExecutor(new WandCommand(this));
                  getCommand("fill").setExecutor(new FillCommand(this));
                  getCommand("shapes").setExecutor(new ShapeCommand(this));
                  getCommand("terrain").setExecutor(new TerrainCommand(this));
                  getCommand("tree").setExecutor(new TreeCommand(this));
                  getCommand("schematic").setExecutor(new SchematicCommand(this));
                  getCommand("undo").setExecutor(new UndoCommand(this));
                  getCommand("redo").setExecutor(new RedoCommand(this));
                  getCommand("palette").setExecutor(new PaletteCommand(this));
                  getCommand("brush").setExecutor(new BrushCommand(this));
                  getCommand("grid").setExecutor(new GridCommand(this));
                  getCommand("measure").setExecutor(new MeasureCommand(this));
                  getCommand("copy").setExecutor(new CopyCommand(this));
                  getCommand("paste").setExecutor(new PasteCommand(this));
                  getCommand("rotate").setExecutor(new RotateCommand(this));
                  getCommand("flip").setExecutor(new FlipCommand(this));
                  getCommand("stack").setExecutor(new StackCommand(this));
                  getCommand("mask").setExecutor(new MaskCommand(this));
                  getCommand("drain").setExecutor(new DrainCommand(this));
                  getCommand("preview").setExecutor(new PreviewCommand(this));
              }
              
              private void registerListeners() {
                  Bukkit.getPluginManager().registerEvents(new SnowballListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new EggListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new ArrowListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new PearlListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new TridentListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new WandListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new PaintListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new FastBreakListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new VeinMinerListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new MeasureListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new GridListener(this), this);
                  Bukkit.getPluginManager().registerEvents(new BlockPhysicsListener(this), this);
              }
              
              private void startTasks() {
                  new AutoSaveTask(this).runTaskTimerAsynchronously(this, 
                      getConfig().getInt("database.save-interval") * 20L,
                      getConfig().getInt("database.save-interval") * 20L);
              }
              
              public void addUndo(UUID uuid, Map<Location, BlockData> blocks) {
                  Stack<Map<Location, BlockData>> stack = undoHistory.computeIfAbsent(uuid, k -> new Stack<>());
                  stack.push(new HashMap<>(blocks));
                  if (stack.size() > getConfig().getInt("undo.max-history", 50)) {
                      stack.remove(0);
                  }
                  redoHistory.computeIfPresent(uuid, (k, v) -> { v.clear(); return v; });
              }
              
              public boolean checkCooldown(UUID uuid) {
                  long now = System.currentTimeMillis();
                  long last = lastAction.getOrDefault(uuid, 0L);
                  int cooldown = getConfig().getInt("limits.cooldown-seconds", 1) * 1000;
                  if (now - last < cooldown) return false;
                  lastAction.put(uuid, now);
                  return true;
              }
              
              public String getMsg(String path) {
                  return ChatColor.translateAlternateColorCodes('&', 
                      getConfig().getString("prefix") + " " + getConfig().getString(path, ""));
              }
              
              public static BuilderEssentials getInstance() { return instance; }
          }
          JAVAEOF

      - name: Create AsyncBlockPlacer
        run: |
          cat > src/main/java/com/mamad396/builderessentials/utils/AsyncBlockPlacer.java << 'EOF'
          package com.mamad396.builderessentials.utils;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Bukkit;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.World;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.scheduler.BukkitRunnable;
          import java.util.*;
          import java.util.concurrent.*;

          public class AsyncBlockPlacer {
              private final BuilderEssentials plugin;
              private final ExecutorService executor;
              private final Map<UUID, Queue<PlaceTask>> queues = new ConcurrentHashMap<>();
              private final Map<UUID, BukkitRunnable> processors = new ConcurrentHashMap<>();
              
              public AsyncBlockPlacer(BuilderEssentials plugin) {
                  this.plugin = plugin;
                  this.executor = Executors.newFixedThreadPool(2);
              }
              
              public void queuePlacement(UUID uuid, Map<Location, BlockData> blocks, Runnable callback) {
                  Queue<PlaceTask> queue = queues.computeIfAbsent(uuid, k -> new ConcurrentLinkedQueue<>());
                  queue.add(new PlaceTask(blocks, callback));
                  
                  if (!processors.containsKey(uuid)) {
                      startProcessor(uuid);
                  }
              }
              
              private void startProcessor(UUID uuid) {
                  BukkitRunnable task = new BukkitRunnable() {
                      @Override
                      public void run() {
                          Queue<PlaceTask> queue = queues.get(uuid);
                          if (queue == null || queue.isEmpty()) {
                              processors.remove(uuid);
                              cancel();
                              return;
                          }
                          
                          PlaceTask task = queue.poll();
                          if (task == null) return;
                          
                          executor.submit(() -> {
                              Map<Location, BlockData> prepared = new HashMap<>();
                              for (Map.Entry<Location, BlockData> entry : task.blocks.entrySet()) {
                                  if (entry.getKey().getWorld() != null) {
                                      prepared.put(entry.getKey(), entry.getValue());
                                  }
                              }
                              
                              Bukkit.getScheduler().runTask(plugin, () -> {
                                  World world = null;
                                  for (Location loc : prepared.keySet()) {
                                      world = loc.getWorld();
                                      break;
                                  }
                                  
                                  if (world != null) {
                                      for (Map.Entry<Location, BlockData> entry : prepared.entrySet()) {
                                          entry.getKey().getBlock().setBlockData(entry.getValue(), false);
                                      }
                                  }
                                  
                                  if (task.callback != null) task.callback.run();
                              });
                          });
                      }
                  };
                  task.runTaskTimer(plugin, 0L, 1L);
                  processors.put(uuid, task);
              }
              
              public void shutdown() {
                  executor.shutdown();
                  processors.values().forEach(BukkitRunnable::cancel);
              }
              
              private static class PlaceTask {
                  final Map<Location, BlockData> blocks;
                  final Runnable callback;
                  
                  PlaceTask(Map<Location, BlockData> blocks, Runnable callback) {
                      this.blocks = blocks;
                      this.callback = callback;
                  }
              }
          }
          EOF

      - name: Create DatabaseManager
        run: |
          cat > src/main/java/com/mamad396/builderessentials/data/DatabaseManager.java << 'EOF'
          package com.mamad396.builderessentials.data;

          import com.mamad396.builderessentials.BuilderEssentials;
          import java.io.File;
          import java.sql.*;
          import java.util.*;

          public class DatabaseManager {
              private final BuilderEssentials plugin;
              private Connection connection;
              
              public DatabaseManager(BuilderEssentials plugin) {
                  this.plugin = plugin;
                  initialize();
              }
              
              private void initialize() {
                  try {
                      File dataFolder = new File(plugin.getDataFolder(), "data");
                      if (!dataFolder.exists()) dataFolder.mkdirs();
                      connection = DriverManager.getConnection("jdbc:sqlite:" + dataFolder + "/builderessentials.db");
                      
                      Statement stmt = connection.createStatement();
                      stmt.execute("CREATE TABLE IF NOT EXISTS palettes (uuid TEXT, name TEXT, materials TEXT, PRIMARY KEY(uuid, name))");
                      stmt.execute("CREATE TABLE IF NOT EXISTS schematics (name TEXT PRIMARY KEY, data BLOB, created TEXT)");
                      stmt.execute("CREATE TABLE IF NOT EXISTS player_data (uuid TEXT PRIMARY KEY, daily_blocks INTEGER, last_reset TEXT)");
                      stmt.close();
                  } catch (SQLException e) {
                      plugin.getLogger().warning("Database error: " + e.getMessage());
                  }
              }
              
              public void savePalette(UUID uuid, String name, List<Material> materials) {
                  try {
                      PreparedStatement ps = connection.prepareStatement(
                          "INSERT OR REPLACE INTO palettes VALUES (?, ?, ?)");
                      ps.setString(1, uuid.toString());
                      ps.setString(2, name);
                      ps.setString(3, materials.toString());
                      ps.executeUpdate();
                      ps.close();
                  } catch (SQLException e) {
                      e.printStackTrace();
                  }
              }
              
              public Map<String, List<Material>> loadPalettes(UUID uuid) {
                  Map<String, List<Material>> result = new HashMap<>();
                  try {
                      PreparedStatement ps = connection.prepareStatement(
                          "SELECT name, materials FROM palettes WHERE uuid = ?");
                      ps.setString(1, uuid.toString());
                      ResultSet rs = ps.executeQuery();
                      while (rs.next()) {
                          String name = rs.getString("name");
                          String matStr = rs.getString("materials");
                          List<Material> mats = new ArrayList<>();
                          for (String s : matStr.replace("[", "").replace("]", "").split(",")) {
                              try { mats.add(Material.valueOf(s.trim())); } catch (Exception ignored) {}
                          }
                          result.put(name, mats);
                      }
                      rs.close();
                      ps.close();
                  } catch (SQLException e) {
                      e.printStackTrace();
                  }
                  return result;
              }
              
              public void closeConnection() {
                  try { if (connection != null) connection.close(); } catch (SQLException ignored) {}
              }
          }
          EOF

      - name: Create BlockPhysicsListener
        run: |
          cat > src/main/java/com/mamad396/builderessentials/listeners/BlockPhysicsListener.java << 'EOF'
          package com.mamad396.builderessentials.listeners;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Material;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.block.BlockPhysicsEvent;

          public class BlockPhysicsListener implements Listener {
              private final BuilderEssentials plugin;
              
              public BlockPhysicsListener(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              @EventHandler
              public void onPhysics(BlockPhysicsEvent event) {
                  Material type = event.getBlock().getType();
                  if (type == Material.SAND || type == Material.GRAVEL || 
                      type == Material.WHITE_CONCRETE_POWDER || type == Material.RED_SAND ||
                      type.name().contains("CONCRETE_POWDER")) {
                      event.setCancelled(true);
                  }
              }
          }
          EOF

      - name: Create command classes (abridged)
        run: |
          # MainCommand with tab completion
          cat > src/main/java/com/mamad396/builderessentials/commands/MainCommand.java << 'EOF'
          package com.mamad396.builderessentials.commands;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.command.Command;
          import org.bukkit.command.CommandExecutor;
          import org.bukkit.command.CommandSender;
          import org.bukkit.command.TabCompleter;
          import org.bukkit.entity.Player;
          import java.util.*;
          import java.util.stream.Collectors;

          public class MainCommand implements CommandExecutor, TabCompleter {
              private final BuilderEssentials plugin;
              private static final List<String> SUB = Arrays.asList("help", "tools", "reload", "info", "settings");
              
              public MainCommand(BuilderEssentials plugin) { this.plugin = plugin; }
              
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (args.length == 0) {
                      sender.sendMessage("§6§l🏗️ BuilderEssentials v2.0 Ultimate");
                      sender.sendMessage("§7/builder tools §f- Get all tools");
                      sender.sendMessage("§7/builder help §f- Full help");
                      sender.sendMessage("§7/preview §f- Toggle particle preview");
                      sender.sendMessage("§7/copy §f| §7/paste §f| §7/rotate §f| §7/flip §f| §7/stack");
                      return true;
                  }
                  if (args[0].equalsIgnoreCase("tools") && sender instanceof Player) {
                      giveTools((Player) sender);
                  } else if (args[0].equalsIgnoreCase("reload") && sender.hasPermission("builder.admin")) {
                      plugin.reloadConfig();
                      sender.sendMessage("§a✅ Config reloaded!");
                  }
                  return true;
              }
              
              private void giveTools(Player p) {
                  p.getInventory().addItem(new org.bukkit.inventory.ItemStack(org.bukkit.Material.WOODEN_AXE));
                  p.getInventory().addItem(new org.bukkit.inventory.ItemStack(org.bukkit.Material.BLAZE_ROD));
                  p.getInventory().addItem(new org.bukkit.inventory.ItemStack(org.bukkit.Material.SNOWBALL, 16));
                  p.getInventory().addItem(new org.bukkit.inventory.ItemStack(org.bukkit.Material.COMPASS));
                  p.sendMessage("§a✅ All tools added!");
              }
              
              @Override
              public List<String> onTabComplete(CommandSender s, Command c, String l, String[] a) {
                  if (a.length == 1) return SUB.stream().filter(x -> x.startsWith(a[0].toLowerCase())).collect(Collectors.toList());
                  return null;
              }
          }
