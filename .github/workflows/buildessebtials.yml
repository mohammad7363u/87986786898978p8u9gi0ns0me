                          sender.sendMessage(plugin.mm.deserialize("<green>✅ Palette saved: ${args[1]} (${palette.size} blocks)</green>"))
                      }
                      "load" -> {
                          if (args.size < 2) {
                              sender.sendMessage(plugin.mm.deserialize("<red>Usage: /palette load <name></red>"))
                              return true
                          }
                          val palettes = plugin.palettes[sender.uniqueId]
                          val palette = palettes?.get(args[1])
                          if (palette == null) {
