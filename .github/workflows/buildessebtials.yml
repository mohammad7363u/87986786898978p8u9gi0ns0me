          import org.bukkit.event.entity.ProjectileHitEvent

          class TridentListener(private val plugin: BuilderEssentials) : Listener {
              @EventHandler
              fun onHit(event: ProjectileHitEvent) {
                  if (event.entity !is Trident) return
                  val trident = event.entity as Trident
                  val player = trident.shooter as? Player ?: return
                  val material = plugin.brushMaterial[player.uniqueId] 
                      ?: player.inventory.itemInMainHand.type.takeIf { it.isBlock && it != Material.AIR } 
                      ?: Material.STONE
                  val start = player.eyeLocation.clone()
                  val end = trident.location.clone()
                  val direction = end.toVector().subtract(start.toVector()).normalize()
                  val distance = start.distance(end)
                  val undoMap = HashMap<Location, BlockData>()
                  
                  var current = start.clone()
                  for (i in 0 until distance.toInt().coerceAtMost(100)) {
                      current = current.add(direction)
                      if (current.block.type.isEmpty) {
                          undoMap[current.clone()] = current.block.blockData
                          current.block.type = material
                      }
                  }
                  if (undoMap.isNotEmpty()) plugin.addUndo(player.uniqueId, undoMap)
                  trident.remove()
              }
          }
