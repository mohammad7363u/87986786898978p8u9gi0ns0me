              public void onPaintWandUse(PlayerInteractEvent event) {
                  if (event.getItem() == null) return;
                  if (event.getItem().getType() != Material.BLAZE_ROD) return;
                  if (!plugin.getConfig().getBoolean("tools.paint-wand.enabled", true)) return;
