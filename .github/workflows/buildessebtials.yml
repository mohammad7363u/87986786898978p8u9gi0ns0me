          package com.mamad396.builderessentials.listeners

          import com.mamad396.builderessentials.BuilderEssentials
          import net.kyori.adventure.text.Component
          import net.kyori.adventure.text.format.NamedTextColor
          import org.bukkit.Material
          import org.bukkit.event.EventHandler
          import org.bukkit.event.Listener
          import org.bukkit.event.player.PlayerInteractEvent
          import org.bukkit.event.block.Action

          class MeasureListener(private val plugin: BuilderEssentials) : Listener {
              private val pos1 = mutableMapOf<java.util.UUID, org.bukkit.Location>()
              
              @EventHandler
              fun onInteract(event: PlayerInteractEvent) {
                  val player = event.player
                  val item = event.item ?: return
                  
                  if (item.type != Material.COMPASS) return
                  if (!plugin.config.getBoolean("tools.measure-tool.enabled")) return
                  
                  when (event.action) {
                      Action.LEFT_CLICK_BLOCK, Action.LEFT_CLICK_AIR -> {
                          val loc = event.clickedBlock?.location ?: player.location
                          pos1[player.uniqueId] = loc
                          player.sendMessage(
                              Component.text("📏 Start: ${loc.blockX}, ${loc.blockY}, ${loc.blockZ}")
                                  .color(NamedTextColor.AQUA)
                          )
                          event.isCancelled = true
                      }
                      Action.RIGHT_CLICK_BLOCK, Action.RIGHT_CLICK_AIR -> {
                          val start = pos1[player.uniqueId] ?: return
                          val end = event.clickedBlock?.location ?: player.location
                          
                          val distance = start.distance(end)
                          val dx = Math.abs(end.blockX - start.blockX)
                          val dy = Math.abs(end.blockY - start.blockY)
                          val dz = Math.abs(end.blockZ - start.blockZ)
                          
                          player.sendMessage(
                              Component.text("📏 Distance: ${String.format("%.1f", distance)} blocks")
                                  .color(NamedTextColor.GOLD)
                          )
                          player.sendMessage(
                              Component.text("   X: $dx, Y: $dy, Z: $dz")
                                  .color(NamedTextColor.GRAY)
                          )
                          player.sendMessage(
                              Component.text("   Volume: ${dx * dy * dz} blocks")
                                  .color(NamedTextColor.GRAY)
                          )
                          event.isCancelled = true
                      }
                      else -> {}
                  }
              }
          }
