          class PaintListener(private val plugin: BuilderEssentials) : Listener {
              @EventHandler
              fun onInteract(event: PlayerInteractEvent) {
                  val player = event.player
                  val item = event.item ?: return
                  
                  if (item.type != Material.BLAZE_ROD) return
                  if (!plugin.config.getBoolean("tools.paint-wand.enabled")) return
                  if (event.action != Action.RIGHT_CLICK_BLOCK && event.action != Action.RIGHT_CLICK_AIR) return
                  
                  val center = event.clickedBlock?.location ?: player.location
                  val radius = plugin.brushSize.getOrDefault(player.uniqueId, 3)
                  val material = plugin.brushMaterial[player.uniqueId] ?: Material.STONE
                  val scatter = plugin.config.getBoolean("tools.paint-wand.scatter")
                  
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  for (x in -radius..radius) {
                      for (y in -radius..radius) {
                          for (z in -radius..radius) {
                              if (x * x + y * y + z * z <= radius * radius) {
