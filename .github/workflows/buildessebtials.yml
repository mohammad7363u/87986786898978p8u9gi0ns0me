          # 9. VeinMinerListener
          cat > src/main/java/com/mamad396/builderessentials/listeners/VeinMinerListener.java << 'EOF'
          package com.mamad396.builderessentials.listeners;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.block.BlockBreakEvent;
          import java.util.*;

          public class VeinMinerListener implements Listener {
              private final BuilderEssentials plugin;
              
              public VeinMinerListener(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              @EventHandler
              public void onVeinMine(BlockBreakEvent event) {
                  if (!plugin.getConfig().getBoolean("tools.vein-miner.enabled", true)) return;
                  if (!event.getPlayer().isSneaking()) return;
                  if (!plugin.hasToolPermission(event.getPlayer(), "vein-miner")) return;
                  
                  Material targetType = event.getBlock().getType();
                  if (targetType == Material.AIR || targetType == Material.BEDROCK) return;
                  
                  int maxVein = plugin.getConfig().getInt("tools.vein-miner.max-vein", 64);
                  Map<Location, BlockData> undoMap = new LinkedHashMap<>();
                  Set<Location> visited = new HashSet<>();
                  Queue<Location> queue = new LinkedList<>();
                  queue.add(event.getBlock().getLocation());
                  
                  while (!queue.isEmpty() && undoMap.size() < maxVein) {
                      Location current = queue.poll();
                      if (visited.contains(current)) continue;
                      visited.add(current);
                      
                      if (current.getBlock().getType() == targetType) {
                          undoMap.put(current.clone(), current.getBlock().getBlockData().clone());
                          current.getBlock().setType(Material.AIR, false);
                          
                          for (int dx = -1; dx <= 1; dx++)
                              for (int dy = -1; dy <= 1; dy++)
                                  for (int dz = -1; dz <= 1; dz++) {
                                      Location next = current.clone().add(dx, dy, dz);
                                      if (!visited.contains(next) && 
                                          next.getBlock().getType() == targetType) {
                                          queue.add(next);
                                      }
                                  }
                      }
                  }
                  
                  if (!undoMap.isEmpty()) {
                      plugin.addUndo(event.getPlayer().getUniqueId(), undoMap);
                      plugin.sendMessage(event.getPlayer(), 
                          "&a⛏️ VeinMined &e" + undoMap.size() + " &ablocks!");
                  }
              }
          }
          EOF

