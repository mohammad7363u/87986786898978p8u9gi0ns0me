          package com.mamad396.builderessentials.shapes;

          import com.mamad396.builderessentials.BuilderEssentials;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.entity.Player;
          import java.util.*;

          public class ShapeGenerator {
              private final BuilderEssentials plugin;
              
              public ShapeGenerator(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              public void generateCircle(Player player, Location center, int radius, Material material, boolean hollow) {
                  Map<Location, BlockData> undoMap = new LinkedHashMap<>();
                  for (int x = -radius; x <= radius; x++) {
                      for (int z = -radius; z <= radius; z++) {
                          double dist = Math.sqrt(x * x + z * z);
                          if (dist <= radius + 0.5 && (!hollow || dist >= radius - 0.5)) {
                              Location loc = center.clone().add(x, 0, z);
                              undoMap.put(loc.clone(), loc.getBlock().getBlockData().clone());
                              loc.getBlock().setType(material, false);
                          }
                      }
                  }
                  finishShape(player, undoMap, "Circle");
              }
              
              public void generateSphere(Player player, Location center, int radius, Material material, boolean hollow) {
                  Map<Location, BlockData> undoMap = new LinkedHashMap<>();
                  for (int x = -radius; x <= radius; x++) {
                      for (int y = -radius; y <= radius; y++) {
                          for (int z = -radius; z <= radius; z++) {
                              double dist = Math.sqrt(x * x + y * y + z * z);
                              if (dist <= radius + 0.5 && (!hollow || dist >= radius - 0.5)) {
                                  Location loc = center.clone().add(x, y, z);
                                  undoMap.put(loc.clone(), loc.getBlock().getBlockData().clone());
                                  loc.getBlock().setType(material, false);
                              }
                          }
                      }
                  }
                  finishShape(player, undoMap, "Sphere");
              }
              
              public void generateCube(Player player, Location center, int size, Material material, boolean hollow) {
                  Map<Location, BlockData> undoMap = new LinkedHashMap<>();
                  int half = size / 2;
                  for (int x = -half; x <= half; x++) {
                      for (int y = -half; y <= half; y++) {
                          for (int z = -half; z <= half; z++) {
                              if (!hollow || x == -half || x == half || y == -half || y == half || z == -half || z == half) {
                                  Location loc = center.clone().add(x, y, z);
                                  undoMap.put(loc.clone(), loc.getBlock().getBlockData().clone());
                                  loc.getBlock().setType(material, false);
                              }
                          }
                      }
                  }
                  finishShape(player, undoMap, "Cube");
              }
              
              public void generateCylinder(Player player, Location center, int radius, int height, Material material, boolean hollow) {
                  Map<Location, BlockData> undoMap = new LinkedHashMap<>();
                  for (int x = -radius; x <= radius; x++) {
                      for (int z = -radius; z <= radius; z++) {
                          double dist = Math.sqrt(x * x + z * z);
                          if (dist <= radius + 0.5) {
                              for (int y = 0; y < height; y++) {
                                  if (!hollow || dist >= radius - 0.5 || y == 0 || y == height - 1) {
                                      Location loc = center.clone().add(x, y, z);
                                      undoMap.put(loc.clone(), loc.getBlock().getBlockData().clone());
                                      loc.getBlock().setType(material, false);
                                  }
                              }
                          }
                      }
                  }
                  finishShape(player, undoMap, "Cylinder");
              }
              
              public void generatePyramid(Player player, Location center, int size, Material material) {
                  Map<Location, BlockData> undoMap = new LinkedHashMap<>();
                  for (int y = 0; y < size; y++) {
                      int s = size - y;
                      for (int x = -s/2; x <= s/2; x++) {
                          for (int z = -s/2; z <= s/2; z++) {
                              Location loc = center.clone().add(x, y, z);
                              undoMap.put(loc.clone(), loc.getBlock().getBlockData().clone());
                              loc.getBlock().setType(material, false);
                          }
                      }
                  }
                  finishShape(player, undoMap, "Pyramid");
              }
              
              private void finishShape(Player player, Map<Location, BlockData> undoMap, String shapeName) {
                  if (!undoMap.isEmpty()) {
                      plugin.addUndo(player.getUniqueId(), undoMap);
                      plugin.sendMessage(player, "&a📐 " + shapeName + " generated! &7(&f" + 
                          String.format("%,d", undoMap.size()) + " &7blocks)");
                      plugin.playSound(player, "complete");
                  }
              }
          }
