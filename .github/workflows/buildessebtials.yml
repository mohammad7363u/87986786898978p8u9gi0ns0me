          cat > pom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.mamad396</groupId>
              <artifactId>BuilderEssentials</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>
              
              <properties>
                  <kotlin.version>1.9.22</kotlin.version>
                  <java.version>21</java.version>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>
              
              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>
              
              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
                  <dependency>
                      <groupId>org.jetbrains.kotlin</groupId>
                      <artifactId>kotlin-stdlib</artifactId>
                      <version>${kotlin.version}</version>
                  </dependency>
              </dependencies>
              
              <build>
                  <sourceDirectory>src/main/kotlin</sourceDirectory>
                  <plugins>
                      <plugin>
                          <groupId>org.jetbrains.kotlin</groupId>
                          <artifactId>kotlin-maven-plugin</artifactId>
                          <version>${kotlin.version}</version>
                          <executions>
                              <execution>
                                  <id>compile</id>
                                  <phase>compile</phase>
                                  <goals>
                                      <goal>compile</goal>
                                  </goals>
                              </execution>
                          </executions>
                          <configuration>
                              <jvmTarget>21</jvmTarget>
                          </configuration>
                      </plugin>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-shade-plugin</artifactId>
                          <version>3.5.1</version>
                          <executions>
                              <execution>
                                  <phase>package</phase>
                                  <goals>
                                      <goal>shade</goal>
                                  </goals>
                              </execution>
                          </executions>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

      - name: Build with Maven
        run: mvn clean package -B -q

      - name: Copy JAR to releases
        run: |
          mkdir -p releases
          cp target/BuilderEssentials-1.0.0.jar releases/

      - name: Setup Git and force push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add releases/BuilderEssentials-1.0.0.jar
          git commit -m "🏗️ BuilderEssentials v1.0.0 - Complete Build" || echo "No changes to commit"
          git push origin main --force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuilderEssentials-v1.0.0
          path: target/BuilderEssentials-1.0.0.jar
