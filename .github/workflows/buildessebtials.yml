              private final BuilderEssentials plugin;
              
              public PearlListener(BuilderEssentials plugin) {
                  this.plugin = plugin;
              }
              
              @EventHandler
              public void onPearlTeleport(PlayerTeleportEvent event) {
                  if (event.getCause() != PlayerTeleportEvent.TeleportCause.ENDER_PEARL) return;
                  if (!plugin.getConfig().getBoolean("tools.ender-pearl-fill.enabled", true)) return;
                  if (!plugin.hasToolPermission(event.getPlayer(), "ender-pearl-fill")) return;
                  
                  Material material = plugin.getBrushMaterial(event.getPlayer().getUniqueId());
                  if (!material.isBlock()) material = Material.STONE;
                  
                  int radius = plugin.getConfig().getInt("tools.ender-pearl-fill.radius", 3);
                  Location center = event.getTo().clone();
                  Map<Location, BlockData> undoMap = new LinkedHashMap<>();
                  
                  for (int x = -radius; x <= radius; x++) {
                      for (int y = 0; y <= 2; y++) {
                          for (int z = -radius; z <= radius; z++) {
                              if (x * x + z * z <= radius * radius) {
                                  Location loc = center.clone().add(x, y, z);
                                  if (loc.getBlock().getType().isEmpty()) {
                                      undoMap.put(loc.clone(), loc.getBlock().getBlockData().clone());
                                      loc.getBlock().setType(material, false);
                                  }
                              }
                          }
                      }
                  }
                  
                  if (!undoMap.isEmpty()) {
                      plugin.addUndo(event.getPlayer().getUniqueId(), undoMap);
                      plugin.sendMessage(event.getPlayer(), "&a💜 Filled &e" + undoMap.size() + " &ablocks!");
                      plugin.playSound(event.getPlayer(), "fill");
                      
                      center.getWorld().spawnParticle(Particle.PORTAL,
                          center.clone().add(0, 1, 0), 50, 1.5, 1, 1.5, 0.1);
                  }
              }
          }
