      - name: Create main plugin class
        run: |
          cat > src/main/kotlin/com/mamad396/builderessentials/BuilderEssentials.kt << 'EOF'
          package com.mamad396.builderessentials

          import com.mamad396.builderessentials.commands.*
          import com.mamad396.builderessentials.listeners.*
          import com.mamad396.builderessentials.tools.*
          import com.mamad396.builderessentials.utils.*
          import net.kyori.adventure.text.minimessage.MiniMessage
          import org.bukkit.plugin.java.JavaPlugin
          import java.util.concurrent.ConcurrentHashMap
          import java.util.Stack
          import java.util.UUID

          class BuilderEssentials : JavaPlugin() {
              companion object {
                  lateinit var instance: BuilderEssentials
                      private set
              }

              val mm = MiniMessage.miniMessage()
              
              // Builder data
              val wandPos1 = ConcurrentHashMap<UUID, Location>()
              val wandPos2 = ConcurrentHashMap<UUID, Location>()
              val brushSize = ConcurrentHashMap<UUID, Int>()
              val brushMaterial = ConcurrentHashMap<UUID, Material>()
              val undoHistory = ConcurrentHashMap<UUID, Stack<Map<Location, BlockData>>>()
              val redoHistory = ConcurrentHashMap<UUID, Stack<Map<Location, BlockData>>>()
              val palettes = ConcurrentHashMap<UUID, MutableMap<String, MutableList<Material>>>()
              val gridToggled = ConcurrentHashMap<UUID, Boolean>()
              val blueprintMode = ConcurrentHashMap<UUID, Boolean>()
              val mirrorMode = ConcurrentHashMap<UUID, Boolean>()
              val mirrorAxis = ConcurrentHashMap<UUID, String>()
              val snapGrid = ConcurrentHashMap<UUID, Boolean>()
              val gridSize = ConcurrentHashMap<UUID, Int>()

              override fun onEnable() {
                  instance = this
                  saveDefaultConfig()
                  
                  registerCommands()
                  registerListeners()
                  
                  logger.info("🏗️ BuilderEssentials v1.0 - 70+ Building Tools Enabled!")
              }

              override fun onDisable() {
                  saveAllData()
                  logger.info("BuilderEssentials disabled!")
              }

              private fun registerCommands() {
                  val mainCmd = MainCommand(this)
                  getCommand("builder")?.setExecutor(mainCmd)
                  getCommand("wand")?.setExecutor(WandCommand(this))
                  getCommand("fill")?.setExecutor(FillCommand(this))
                  getCommand("shapes")?.setExecutor(ShapeCommand(this))
                  getCommand("terrain")?.setExecutor(TerrainCommand(this))
                  getCommand("tree")?.setExecutor(TreeCommand(this))
                  getCommand("schematic")?.setExecutor(SchematicCommand(this))
                  getCommand("undo")?.setExecutor(UndoCommand(this))
                  getCommand("redo")?.setExecutor(RedoCommand(this))
                  getCommand("palette")?.setExecutor(PaletteCommand(this))
                  getCommand("brush")?.setExecutor(BrushCommand(this))
                  getCommand("grid")?.setExecutor(GridCommand(this))
                  getCommand("measure")?.setExecutor(MeasureCommand(this))
              }

              private fun registerListeners() {
                  val pm = server.pluginManager
                  pm.registerEvents(SnowballListener(this), this)
                  pm.registerEvents(EggListener(this), this)
                  pm.registerEvents(ArrowListener(this), this)
                  pm.registerEvents(PearlListener(this), this)
                  pm.registerEvents(TridentListener(this), this)
                  pm.registerEvents(WandListener(this), this)
                  pm.registerEvents(PaintListener(this), this)
                  pm.registerEvents(SmoothListener(this), this)
                  pm.registerEvents(FastBreakListener(this), this)
                  pm.registerEvents(VeinMinerListener(this), this)
                  pm.registerEvents(MeasureListener(this), this)
                  pm.registerEvents(GridListener(this), this)
              }

              private fun saveAllData() {
                  // Save schematics and palettes
                  val dataFolder = File(dataFolder, "data")
                  dataFolder.mkdirs()
                  
                  palettes.forEach { (uuid, palettes) ->
                      val file = File(dataFolder, "$uuid-palettes.yml")
                      val config = YamlConfiguration()
                      palettes.forEach { (name, mats) ->
                          config.set(name, mats.map { it.name })
                      }
                      config.save(file)
                  }
              }

              fun addUndo(uuid: UUID, blocks: Map<Location, BlockData>) {
                  undoHistory.getOrPut(uuid) { Stack() }.push(blocks)
                  if (undoHistory[uuid]!!.size > config.getInt("max-undo-history")) {
                      undoHistory[uuid]!!.removeAt(0)
                  }
                  redoHistory[uuid]?.clear()
              }

              fun teleportToLocation(location: Location): Location {
                  return location.clone()
              }
          }
          EOF

      - name: Create all tool classes
        run: |
          # SnowballListener.kt - THE MAIN FEATURE!
          cat > src/main/kotlin/com/mamad396/builderessentials/listeners/SnowballListener.kt << 'EOF'
          package com.mamad396.builderessentials.listeners

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Location
          import org.bukkit.Material
          import org.bukkit.Particle
          import org.bukkit.Sound
          import org.bukkit.block.Block
          org.bukkit.entity.Player
          import org.bukkit.entity.Snowball
          import org.bukkit.event.EventHandler
          import org.bukkit.event.Listener
          import org.bukkit.event.entity.ProjectileHitEvent
          import org.bukkit.event.entity.ProjectileLaunchEvent
          import org.bukkit.inventory.ItemStack
          import org.bukkit.scheduler.BukkitRunnable
          import org.bukkit.util.Vector
          import java.util.concurrent.ConcurrentHashMap

          class SnowballListener(private val plugin: BuilderEssentials) : Listener {
              private val activeSnowballs = ConcurrentHashMap<Snowball, Material>()

              @EventHandler
              fun onLaunch(event: ProjectileLaunchEvent) {
                  if (event.entity !is Snowball) return
                  val player = event.entity.shooter as? Player ?: return
                  if (!plugin.config.getBoolean("tools.snowball-filler.enabled")) return
                  
                  val mainHand = player.inventory.itemInMainHand
                  val offHand = player.inventory.itemInOffHand
                  
                  val material = when {
                      offHand.type.isBlock && offHand.type != Material.AIR -> offHand.type
                      mainHand.type.isBlock && mainHand.type != Material.AIR -> mainHand.type
                      else -> plugin.brushMaterial[player.uniqueId] ?: Material.STONE
                  }
                  
                  activeSnowballs[event.entity as Snowball] = material
                  startTrailTask(event.entity as Snowball, material)
              }

              @EventHandler
              fun onHit(event: ProjectileHitEvent) {
                  val snowball = event.entity as? Snowball ?: return
                  activeSnowballs.remove(snowball)
                  snowball.remove()
              }

              private fun startTrailTask(snowball: Snowball, material: Material) {
                  val maxDistance = plugin.config.getDouble("tools.snowball-filler.max-distance")
                  val startLoc = snowball.location.clone()
                  
                  object : BukkitRunnable() {
                      var distance = 0.0
                      
                      override fun run() {
                          if (!snowball.isValid || snowball.isDead) {
                              cancel()
                              return
                          }
                          
                          val currentLoc = snowball.location
                          val distanceTraveled = startLoc.distance(currentLoc)
                          
                          if (distanceTraveled > maxDistance) {
                              cancel()
                              return
                          }
                          
                          distance += 1.0
                          
                          // Place blocks along the path
                          val direction = snowball.velocity.normalize()
                          var checkLoc = currentLoc.clone()
                          
                          for (i in 0..5) {
                              checkLoc = checkLoc.clone().subtract(direction.multiply(0.5))
                              val block = checkLoc.block
                              
                              if (block.type == Material.AIR || block.type == Material.WATER || block.type == Material.LAVA) {
                                  plugin.addUndo(
                                      (snowball.shooter as? Player)?.uniqueId ?: return,
                                      mapOf(checkLoc.clone() to block.blockData)
                                  )
                                  
                                  block.type = material
                                  
                                  // Particle effect
                                  checkLoc.world?.spawnParticle(
                                      Particle.SNOWFLAKE,
                                      checkLoc.clone().add(0.5, 0.5, 0.5),
                                      2, 0.1, 0.1, 0.1, 0
                                  )
                                  
                                  // Sound
                                  checkLoc.world?.playSound(
                                      checkLoc,
                                      Sound.BLOCK_STONE_PLACE,
                                      0.3f,
                                      1.5f
                                  )
                              }
                          }
                      }
                  }.runTaskTimer(plugin, 0L, 1L)
              }
          }
          EOF

          # EggListener.kt
          cat > src/main/kotlin/com/mamad396/builderessentials/listeners/EggListener.kt << 'EOF'
          package com.mamad396.builderessentials.listeners

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.Particle
          import org.bukkit.entity.Egg
          import org.bukkit.entity.Player
          import org.bukkit.event.EventHandler
          import org.bukkit.event.Listener
          import org.bukkit.event.entity.ProjectileHitEvent

          class EggListener(private val plugin: BuilderEssentials) : Listener {
              @EventHandler
              fun onHit(event: ProjectileHitEvent) {
                  if (event.entity !is Egg) return
                  if (!plugin.config.getBoolean("tools.egg-filler.enabled")) return
                  
                  val player = event.entity.shooter as? Player ?: return
                  val material = plugin.brushMaterial[player.uniqueId] ?: player.inventory.itemInMainHand.type
                  
                  if (!material.isBlock) return
                  
                  val hitLoc = event.entity.location
                  val block = hitLoc.block
                  
                  if (block.type == Material.AIR) {
                      plugin.addUndo(player.uniqueId, mapOf(hitLoc.clone() to block.blockData))
                      block.type = material
                      
                      hitLoc.world?.spawnParticle(
                          Particle.CRIT,
                          hitLoc.clone().add(0.5, 1.0, 0.5),
                          10, 0.2, 0.2, 0.2, 0
                      )
                  }
                  
                  event.entity.remove()
              }
          }
          EOF

          # ArrowListener.kt
          cat > src/main/kotlin/com/mamad396/builderessentials/listeners/ArrowListener.kt << 'EOF'
          package com.mamad396.builderessentials.listeners

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.Particle
          import org.bukkit.entity.Arrow
          import org.bukkit.entity.Player
          import org.bukkit.event.EventHandler
          import org.bukkit.event.Listener
          import org.bukkit.event.entity.ProjectileHitEvent
          import org.bukkit.scheduler.BukkitRunnable

          class ArrowListener(private val plugin: BuilderEssentials) : Listener {
              @EventHandler
              fun onHit(event: ProjectileHitEvent) {
                  if (event.entity !is Arrow) return
                  if (!plugin.config.getBoolean("tools.arrow-placer.enabled")) return
                  
                  val arrow = event.entity as Arrow
                  val player = arrow.shooter as? Player ?: return
                  val material = plugin.brushMaterial[player.uniqueId] ?: player.inventory.itemInMainHand.type
                  
                  if (!material.isBlock) return
                  
                  val hitBlock = event.hitBlock
                  if (hitBlock != null) {
                      // Place on adjacent face
                      val face = event.hitBlockFace ?: return
                      val placeLoc = hitBlock.getRelative(face).location
                      
                      plugin.addUndo(player.uniqueId, mapOf(placeLoc.clone() to placeLoc.block.blockData))
                      placeLoc.block.type = material
                      
                      placeLoc.world?.spawnParticle(
                          Particle.FLAME,
                          placeLoc.clone().add(0.5, 0.5, 0.5),
                          5, 0.1, 0.1, 0.1, 0
                      )
                  }
                  
                  arrow.remove()
              }
          }
          EOF

          # PearlListener.kt
          cat > src/main/kotlin/com/mamad396/builderessentials/listeners/PearlListener.kt << 'EOF'
          package com.mamad396.builderessentials.listeners

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.Particle
          import org.bukkit.event.EventHandler
          import org.bukkit.event.Listener
          import org.bukkit.event.player.PlayerTeleportEvent

          class PearlListener(private val plugin: BuilderEssentials) : Listener {
              @EventHandler
              fun onTeleport(event: PlayerTeleportEvent) {
                  if (event.cause != PlayerTeleportEvent.TeleportCause.ENDER_PEARL) return
                  if (!plugin.config.getBoolean("tools.ender-pearl-fill.enabled")) return
                  
                  val player = event.player
                  val material = plugin.brushMaterial[player.uniqueId] ?: player.inventory.itemInMainHand.type
                  
                  if (!material.isBlock) return
                  
                  val radius = plugin.config.getInt("tools.ender-pearl-fill.radius", 3)
                  val center = event.to
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  for (x in -radius..radius) {
                      for (y in 0..2) {
                          for (z in -radius..radius) {
                              if (x * x + z * z <= radius * radius) {
                                  val loc = center.clone().add(x.toDouble(), y.toDouble(), z.toDouble())
                                  if (loc.block.type == Material.AIR) {
                                      undoMap[loc.clone()] = loc.block.blockData
                                      loc.block.type = material
                                  }
                              }
                          }
                      }
                  }
                  
                  if (undoMap.isNotEmpty()) {
                      plugin.addUndo(player.uniqueId, undoMap)
                      center.world?.spawnParticle(
                          Particle.PORTAL,
                          center.clone().add(0.0, 1.0, 0.0),
                          50, 2.0, 1.0, 2.0, 0
                      )
                  }
              }
          }
          EOF

          # TridentListener.kt
          cat > src/main/kotlin/com/mamad396/builderessentials/listeners/TridentListener.kt << 'EOF'
          package com.mamad396.builderessentials.listeners

          import com.mamad396.builderessentials.BuilderEssentials
          import org.bukkit.Material
          import org.bukkit.entity.Player
          import org.bukkit.entity.Trident
          import org.bukkit.event.EventHandler
          import org.bukkit.event.Listener
          import org.bukkit.event.entity.ProjectileHitEvent
          import org.bukkit.util.Vector

          class TridentListener(private val plugin: BuilderEssentials) : Listener {
              @EventHandler
              fun onHit(event: ProjectileHitEvent) {
                  if (event.entity !is Trident) return
                  if (!plugin.config.getBoolean("tools.trident-builder.enabled")) return
                  
                  val trident = event.entity as Trident
                  val player = trident.shooter as? Player ?: return
                  val material = plugin.brushMaterial[player.uniqueId] ?: player.inventory.itemInMainHand.type
                  
                  if (!material.isBlock) return
                  
                  val start = player.eyeLocation
                  val end = trident.location
                  val direction = end.toVector().subtract(start.toVector()).normalize()
                  val distance = start.distance(end)
                  val undoMap = mutableMapOf<org.bukkit.Location, org.bukkit.block.data.BlockData>()
                  
                  var current = start.clone()
                  for (i in 0 until distance.toInt()) {
                      current = current.add(direction)
                      if (current.block.type == Material.AIR) {
                          undoMap[current.clone()] = current.block.blockData
                          current.block.type = material
                      }
                  }
                  
                  if (undoMap.isNotEmpty()) {
                      plugin.addUndo(player.uniqueId, undoMap)
                  }
                  
                  trident.remove()
              }
          }
          EOF

      - name: Create wand and tool listeners
        run: |
          # WandListener.kt
          cat > src/main/kotlin/com/mamad396/builderessentials/listeners/WandListener.kt << 'EOF'
          package com.mamad396.builderessentials.listeners

          import com.mamad396.builderessentials.BuilderEssentials
          import net.kyori.adventure.text.Component
          import net.kyori.adventure.text.format.NamedTextColor
          import org.bukkit.Material
          import org.bukkit.event.EventHandler
          import org.bukkit.event.Listener
          import org.bukkit.event.block.Action
          import org.bukkit.event.player.PlayerInteractEvent

          class WandListener(private val plugin: BuilderEssentials) : Listener {
              @EventHandler
              fun onInteract(event: PlayerInteractEvent) {
                  val player = event.player
                  val item = event.item ?: return
                  
                  if (item.type != Material.WOODEN_AXE) return
                  if (!plugin.config.getBoolean("tools.selection-wand.enabled")) return
                  
                  val clickedBlock = event.clickedBlock ?: return
                  
                  when (event.action) {
                      Action.LEFT_CLICK_BLOCK -> {
                          event.isCancelled = true
                          plugin.wandPos1[player.uniqueId] = clickedBlock.location
                          player.sendMessage(
                              Component.text("📍 Position 1 set! (${clickedBlock.x}, ${clickedBlock.y}, ${clickedBlock.z})")
                                  .color(NamedTextColor.GOLD)
                          )
                      }
                      Action.RIGHT_CLICK_BLOCK -> {
                          event.isCancelled = true
                          plugin.wandPos2[player.uniqueId] = clickedBlock.location
                          player.sendMessage(
                              Component.text("📍 Position 2 set! (${clickedBlock.x}, ${clickedBlock.y}, ${clickedBlock.z})")
                                  .color(NamedTextColor.GOLD)
                          )
                          
                          // Calculate volume
                          val pos1 = plugin.wandPos1[player.uniqueId]
                          val pos2 = plugin.wandPos2[player.uniqueId]
                          if (pos1 != null && pos2 != null) {
                              val volume = (Math.abs(pos2.x - pos1.x) + 1) * (Math.abs(pos2.y - pos1.y) + 1) * (Math.abs(pos2.z - pos1.z) + 1)
                              player.sendMessage(
                                  Component.text("📦 Selection volume: $volume blocks")
                                      .color(NamedTextColor.AQUA)
                              )
                          }
                      }
                      else -> {}
                  }
