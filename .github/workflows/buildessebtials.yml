                          <white>/palette save <name></white> <gray>- Save hotbar as palette</gray>
                          <white>/palette load <name></white> <gray>- Load palette to hotbar</gray>
                          <white>/palette list</white> <gray>- List saved palettes</gray>
                          <white>/palette delete <name></white> <gray>- Delete palette</gray>
                          """.trimIndent()
                      ))
                      return true
                  }
                  
                  when (args[0].lowercase()) {
