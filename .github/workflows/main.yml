name: Build JsonPaster Pro

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create project structure
        run: |
          mkdir -p src/main/java/com/mamad396/jsonpaster
          mkdir -p src/main/resources
          mkdir -p releases

      - name: Create plugin.yml
        run: |
          cat > src/main/resources/plugin.yml << 'EOF'
          name: JsonPaster
          version: 3.1
          main: com.mamad396.jsonpaster.JsonPaster
          api-version: '1.20'
          author: mamad396
          description: Paste & Copy JSON structures
          softdepend: [WorldEdit]
          commands:
            pastejson:
              description: Paste a JSON file
              usage: /pastejson <filename>
              aliases: [pj, pastej]
            copyjson:
              description: Copy selection to JSON file
              usage: /copyjson <filename>
              aliases: [cj, copyj]
            listjson:
              description: List all JSON files
              usage: /listjson
              aliases: [lj, listj]
            deletejson:
              description: Delete a JSON file
              usage: /deletejson <filename>
              aliases: [dj, delj]
            infojson:
              description: Show info about a JSON file
              usage: /infojson <filename>
              aliases: [ij, infoj]
            rotatejson:
              description: Rotate a JSON file
              usage: /rotatejson <filename> <90/180/270>
              aliases: [rj, rotj]
            mirrorjson:
              description: Mirror a JSON file
              usage: /mirrorjson <filename> <x/z>
              aliases: [mj, mirj]
            replacejson:
              description: Replace blocks in JSON file
              usage: /replacejson <filename> <from> <to>
              aliases: [repj]
            previewjson:
              description: Preview a JSON file
              usage: /previewjson <filename>
              aliases: [prevj]
            undopaste:
              description: Undo last paste
              usage: /undopaste
              aliases: [up, undoj]
            jsonpaster:
              description: Main plugin command
              usage: /jsonpaster reload
              aliases: [jp]
          permissions:
            jsonpaster.use:
              description: Use basic commands
              default: op
            jsonpaster.admin:
              description: Admin commands
              default: op
          EOF

      - name: Create config.yml
        run: |
          cat > src/main/resources/config.yml << 'EOF'
          # JsonPaster Pro Configuration
          # Plugin by mamad396

          settings:
            # Maximum file size in KB (0 = unlimited)
            max-file-size: 5000
            # Auto-reload config on change
            auto-reload: true
            # Save undo history
            save-undo: true
            # Maximum undo history per player
            max-undo: 10

          messages:
            prefix: "&8[&bJsonPaster&8]&r"
            paste-success: "&a✅ Successfully pasted &e%count% &ablocks from &e%file%&a!"
            paste-error: "&c❌ Error pasting file: &e%error%"
            paste-notfound: "&c❌ File not found: &e%file%"
            copy-success: "&a📋 Copied &e%count% &ablocks to &e%file%&a!"
            copy-error: "&c❌ Error copying: Make a WorldEdit selection first!"
            copy-no-we: "&c❌ WorldEdit not found! Please install WorldEdit."
            list-header: "&6📁 JSON Files &7(%count% files)&6:"
            list-entry: "  &7- &e%file% &7(%size% KB)"
            list-empty: "&7📁 No JSON files found."
            delete-success: "&a🗑️ Deleted: &e%file%"
            delete-error: "&c❌ Could not delete: &e%file%"
            info-header: "&6📊 File Info: &e%file%"
            info-blocks: "  &7Blocks: &e%blocks%"
            info-size: "  &7Size: &e%size% KB"
            info-date: "  &7Modified: &e%date%"
            rotate-success: "&a🔄 Rotated &e%file% &aby &e%angle%°"
            rotate-error: "&c❌ Angle must be 90, 180, or 270"
            mirror-success: "&a🪞 Mirrored &e%file% &aon &e%axis% &aaxis"
            mirror-error: "&c❌ Axis must be x or z"
            replace-success: "&a🔧 Replaced &e%count% &ablocks from &e%from% &ato &e%to%"
            replace-error: "&c❌ Error replacing blocks"
            preview-header: "&6🔍 Preview: &e%file% &7(%count% blocks)"
            preview-size: "  &7Dimensions: &e%size%"
            undo-success: "&a↩️ Undone &e%count% &ablocks!"
            undo-empty: "&7Nothing to undo."
            reload-success: "&a⚙️ Config reloaded!"
            no-permission: "&c❌ You don't have permission!"
            player-only: "&c❌ Only players can use this command!"
            usage: "&7Usage: &e%usage%"

          # Custom load message (supports color codes)
          load-message:
            - "&b╔══════════════════════════════════╗"
            - "&b║   &f✨ &eJsonPaster Pro &fv3.1 &f✨   &b║"
            - "&b║   &7Made by &fmamad396 &7with ❤️   &b║"
            - "&b║   &a/jp help &7- Show commands  &b║"
            - "&b╚══════════════════════════════════╝"
          EOF

      - name: Create JsonPaster.java
        run: |
          cat > src/main/java/com/mamad396/jsonpaster/JsonPaster.java << 'EOF'
          package com.mamad396.jsonpaster;

          import org.bukkit.Bukkit;
          import org.bukkit.ChatColor;
          import org.bukkit.plugin.java.JavaPlugin;
          import java.io.File;
          import java.util.List;

          public class JsonPaster extends JavaPlugin {
              
              private static JsonPaster instance;
              private ConfigManager configManager;
              
              @Override
              public void onEnable() {
                  instance = this;
                  
                  if (!getDataFolder().exists()) getDataFolder().mkdirs();
                  
                  configManager = new ConfigManager(this);
                  configManager.loadConfig();
                  
                  getCommand("pastejson").setExecutor(new PasteJsonCommand(this));
                  getCommand("copyjson").setExecutor(new CopyJsonCommand(this));
                  getCommand("listjson").setExecutor(new ListJsonCommand(this));
                  getCommand("deletejson").setExecutor(new DeleteJsonCommand(this));
                  getCommand("infojson").setExecutor(new InfoJsonCommand(this));
                  getCommand("rotatejson").setExecutor(new RotateJsonCommand(this));
                  getCommand("mirrorjson").setExecutor(new MirrorJsonCommand(this));
                  getCommand("replacejson").setExecutor(new ReplaceJsonCommand(this));
                  getCommand("previewjson").setExecutor(new PreviewJsonCommand(this));
                  getCommand("undopaste").setExecutor(new UndoPasteCommand());
                  getCommand("jsonpaster").setExecutor(new MainCommand(this));
                  
                  printLoadMessage();
              }
              
              private void printLoadMessage() {
                  List<String> msg = getConfig().getStringList("load-message");
                  if (msg != null && !msg.isEmpty()) {
                      for (String line : msg) {
                          Bukkit.getConsoleSender().sendMessage(ChatColor.translateAlternateColorCodes('&', line));
                      }
                  }
                  getLogger().info("v" + getDescription().getVersion() + " enabled successfully!");
              }
              
              public static JsonPaster getInstance() { return instance; }
              public ConfigManager getConfigManager() { return configManager; }
              
              @Override
              public void onDisable() {
                  getLogger().info("JsonPaster Pro disabled. Goodbye!");
              }
          }
          EOF

      - name: Create ConfigManager.java
        run: |
          cat > src/main/java/com/mamad396/jsonpaster/ConfigManager.java << 'EOF'
          package com.mamad396.jsonpaster;

          import org.bukkit.ChatColor;
          import org.bukkit.configuration.file.FileConfiguration;
          import java.io.File;

          public class ConfigManager {
              private final JsonPaster plugin;
              private FileConfiguration config;
              
              public ConfigManager(JsonPaster plugin) {
                  this.plugin = plugin;
              }
              
              public void loadConfig() {
                  plugin.saveDefaultConfig();
                  plugin.reloadConfig();
                  config = plugin.getConfig();
              }
              
              public String getMessage(String key) {
                  String prefix = config.getString("messages.prefix", "&8[&bJsonPaster&8]&r");
                  String msg = config.getString("messages." + key, "Message not found: " + key);
                  return ChatColor.translateAlternateColorCodes('&', prefix + " " + msg);
              }
              
              public String getMessageRaw(String key) {
                  return ChatColor.translateAlternateColorCodes('&', 
                      config.getString("messages." + key, ""));
              }
              
              public int getMaxFileSize() {
                  return config.getInt("settings.max-file-size", 5000);
              }
              
              public int getMaxUndo() {
                  return config.getInt("settings.max-undo", 10);
              }
          }
          EOF

      - name: Create MainCommand.java
        run: |
          cat > src/main/java/com/mamad396/jsonpaster/MainCommand.java << 'EOF'
          package com.mamad396.jsonpaster;

          import org.bukkit.command.*;
          import org.bukkit.entity.Player;

          public class MainCommand implements CommandExecutor {
              private final JsonPaster plugin;
              
              public MainCommand(JsonPaster plugin) { this.plugin = plugin; }
              
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (args.length == 0 || args[0].equalsIgnoreCase("help")) {
                      sender.sendMessage(plugin.getConfigManager().getMessageRaw("prefix").replace("&r","") + " &6Commands:");
                      sender.sendMessage("  &e/pastejson <file> &7- Paste a structure");
                      sender.sendMessage("  &e/copyjson <file> &7- Copy selection to file");
                      sender.sendMessage("  &e/listjson &7- List all files");
                      sender.sendMessage("  &e/infojson <file> &7- File information");
                      sender.sendMessage("  &e/rotatejson <file> <90/180/270> &7- Rotate");
                      sender.sendMessage("  &e/mirrorjson <file> <x/z> &7- Mirror");
                      sender.sendMessage("  &e/replacejson <file> <from> <to> &7- Replace blocks");
                      sender.sendMessage("  &e/previewjson <file> &7- Preview before paste");
                      sender.sendMessage("  &e/undopaste &7- Undo last paste");
                      sender.sendMessage("  &e/jp reload &7- Reload config");
                      return true;
                  }
                  
                  if (args[0].equalsIgnoreCase("reload")) {
                      if (!sender.hasPermission("jsonpaster.admin")) {
                          sender.sendMessage(plugin.getConfigManager().getMessage("no-permission"));
                          return true;
                      }
                      plugin.getConfigManager().loadConfig();
                      sender.sendMessage(plugin.getConfigManager().getMessage("reload-success"));
                  }
                  return true;
              }
          }
          EOF

      - name: Create PasteJsonCommand.java
        run: |
          cat > src/main/java/com/mamad396/jsonpaster/PasteJsonCommand.java << 'EOF'
          package com.mamad396.jsonpaster;

          import org.bukkit.*;
          import org.bukkit.block.Block;
          import org.bukkit.command.*;
          import org.bukkit.entity.Player;
          import java.io.*;
          import java.nio.file.*;
          import java.util.*;

          public class PasteJsonCommand implements CommandExecutor {
              private final JsonPaster plugin;
              public static Map<UUID, List<String>> undoMap = new HashMap<>();

              public PasteJsonCommand(JsonPaster p) { this.plugin = p; }

              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (!(sender instanceof Player)) {
                      sender.sendMessage(plugin.getConfigManager().getMessage("player-only"));
                      return true;
                  }
                  if (!sender.hasPermission("jsonpaster.use")) {
                      sender.sendMessage(plugin.getConfigManager().getMessage("no-permission"));
                      return true;
                  }
                  if (args.length < 1) {
                      sender.sendMessage(plugin.getConfigManager().getMessage("usage").replace("%usage%", "/pastejson <filename>"));
                      return true;
                  }

                  Player p = (Player) sender;
                  String fn = args[0];
                  if (!fn.endsWith(".json")) fn += ".json";
                  File f = new File(plugin.getDataFolder(), fn);
                  if (!f.exists()) {
                      p.sendMessage(plugin.getConfigManager().getMessage("paste-notfound").replace("%file%", fn));
                      return true;
                  }

                  try {
                      String content = new String(Files.readAllBytes(f.toPath())).trim();
                      if (content.startsWith("[")) content = content.substring(1);
                      if (content.endsWith("]")) content = content.substring(0, content.length()-1);

                      Location loc = p.getLocation();
                      World w = p.getWorld();
                      int pasted = 0;
                      List<String> undoList = new ArrayList<>();

                      String[] blocks = content.split("\\},\\{");
                      for (String bs : blocks) {
                          bs = bs.replace("{", "").replace("}", "").trim();
                          if (bs.isEmpty()) continue;
                          int x = 0, y = 0, z = 0;
                          String mat = "STONE";
                          String[] parts = bs.split(",");
                          for (String part : parts) {
                              int cp = part.indexOf(":");
                              if (cp < 0) continue;
                              String key = part.substring(0, cp).trim().replace("\"", "");
                              String val = part.substring(cp+1).trim().replace("\"", "");
                              switch (key) {
                                  case "x": x = Integer.parseInt(val); break;
                                  case "y": y = Integer.parseInt(val); break;
                                  case "z": z = Integer.parseInt(val); break;
                                  case "block": mat = val; break;
                              }
                          }
                          Material m = Material.getMaterial(mat.toUpperCase());
                          if (m != null && m.isBlock()) {
                              Block block = w.getBlockAt(loc.getBlockX()+x, loc.getBlockY()+y, loc.getBlockZ()+z);
                              undoList.add(block.getWorld().getName() + "," + block.getX() + "," + block.getY() + "," + block.getZ() + "," + block.getType().name());
                              block.setType(m);
                              pasted++;
                          }
                      }
                      undoMap.put(p.getUniqueId(), undoList);
                      p.sendMessage(plugin.getConfigManager().getMessage("paste-success")
                          .replace("%count%", String.valueOf(pasted))
                          .replace("%file%", fn));
                  } catch (Exception e) {
                      p.sendMessage(plugin.getConfigManager().getMessage("paste-error").replace("%error%", e.getMessage()));
                  }
                  return true;
              }
          }
          EOF

      - name: Create UndoPasteCommand.java
        run: |
          cat > src/main/java/com/mamad396/jsonpaster/UndoPasteCommand.java << 'EOF'
          package com.mamad396.jsonpaster;

          import org.bukkit.*;
          import org.bukkit.command.*;
          import org.bukkit.entity.Player;
          import java.util.*;

          public class UndoPasteCommand implements CommandExecutor {
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (!(sender instanceof Player)) return true;
                  Player p = (Player) sender;
                  List<String> undoList = PasteJsonCommand.undoMap.remove(p.getUniqueId());
                  if (undoList == null || undoList.isEmpty()) {
                      p.sendMessage(JsonPaster.getInstance().getConfigManager().getMessage("undo-empty"));
                      return true;
                  }
                  int count = 0;
                  for (String s : undoList) {
                      String[] parts = s.split(",");
                      World w = Bukkit.getWorld(parts[0]);
                      if (w != null) {
                          w.getBlockAt(Integer.parseInt(parts[1]), Integer.parseInt(parts[2]), Integer.parseInt(parts[3]))
                           .setType(Material.getMaterial(parts[4]));
                          count++;
                      }
                  }
                  p.sendMessage(JsonPaster.getInstance().getConfigManager().getMessage("undo-success")
                      .replace("%count%", String.valueOf(count)));
                  return true;
              }
          }
          EOF

      - name: Create CopyJsonCommand.java
        run: |
          cat > src/main/java/com/mamad396/jsonpaster/CopyJsonCommand.java << 'EOF'
          package com.mamad396.jsonpaster;

          import com.google.gson.*;
          import org.bukkit.Location;
          import org.bukkit.Material;
          import org.bukkit.command.*;
          import org.bukkit.entity.Player;
          import java.io.*;
          import java.nio.file.*;

          public class CopyJsonCommand implements CommandExecutor {
              private final JsonPaster plugin;
              public CopyJsonCommand(JsonPaster p) { this.plugin = p; }

              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (!(sender instanceof Player)) {
                      sender.sendMessage(plugin.getConfigManager().getMessage("player-only"));
                      return true;
                  }
                  if (args.length < 1) {
                      sender.sendMessage(plugin.getConfigManager().getMessage("usage").replace("%usage%", "/copyjson <filename>"));
                      return true;
                  }

                  Player p = (Player) sender;
                  
                  try {
                      com.sk89q.worldedit.bukkit.WorldEditPlugin wep = 
                          (com.sk89q.worldedit.bukkit.WorldEditPlugin) org.bukkit.Bukkit.getPluginManager().getPlugin("WorldEdit");
                      if (wep == null) {
                          p.sendMessage(plugin.getConfigManager().getMessage("copy-no-we"));
                          return true;
                      }
                      
                      com.sk89q.worldedit.regions.Region region;
                      try {
                          region = wep.getSession(p).getSelection(wep.wrapPlayer(p).getWorld());
                      } catch (Exception e) {
                          p.sendMessage(plugin.getConfigManager().getMessage("copy-error"));
                          return true;
                      }
                      
                      if (region == null) {
                          p.sendMessage(plugin.getConfigManager().getMessage("copy-error"));
                          return true;
                      }
                      
                      JsonArray arr = new JsonArray();
                      Location origin = p.getLocation();
                      
                      for (int x = region.getMinimumPoint().getX(); x <= region.getMaximumPoint().getX(); x++) {
                          for (int y = region.getMinimumPoint().getY(); y <= region.getMaximumPoint().getY(); y++) {
                              for (int z = region.getMinimumPoint().getZ(); z <= region.getMaximumPoint().getZ(); z++) {
                                  Material mat = p.getWorld().getBlockAt(x, y, z).getType();
                                  if (mat != Material.AIR) {
                                      JsonObject obj = new JsonObject();
                                      obj.addProperty("x", x - origin.getBlockX());
                                      obj.addProperty("y", y - origin.getBlockY());
                                      obj.addProperty("z", z - origin.getBlockZ());
                                      obj.addProperty("block", mat.name());
                                      arr.add(obj);
                                  }
                              }
                          }
                      }
                      
                      String fn = args[0];
                      if (!fn.endsWith(".json")) fn += ".json";
                      Files.write(new File(plugin.getDataFolder(), fn).toPath(), 
                          new GsonBuilder().setPrettyPrinting().create().toJson(arr).getBytes());
                      p.sendMessage(plugin.getConfigManager().getMessage("copy-success")
                          .replace("%count%", String.valueOf(arr.size()))
                          .replace("%file%", fn));
                  } catch (Exception e) {
                      p.sendMessage(plugin.getConfigManager().getMessage("copy-error"));
                  }
                  return true;
              }
          }
          EOF

      - name: Create other commands
        run: |
          # ListJsonCommand
          cat > src/main/java/com/mamad396/jsonpaster/ListJsonCommand.java << 'EOF'
          package com.mamad396.jsonpaster;
          import org.bukkit.command.*;
          import java.io.File;
          public class ListJsonCommand implements CommandExecutor {
              private final JsonPaster plugin;
              public ListJsonCommand(JsonPaster p) { this.plugin = p; }
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  File[] files = plugin.getDataFolder().listFiles((d, n) -> n.endsWith(".json"));
                  if (files == null || files.length == 0) {
                      sender.sendMessage(plugin.getConfigManager().getMessage("list-empty"));
                      return true;
                  }
                  sender.sendMessage(plugin.getConfigManager().getMessage("list-header").replace("%count%", String.valueOf(files.length)));
                  for (File f : files) 
                      sender.sendMessage(plugin.getConfigManager().getMessage("list-entry")
                          .replace("%file%", f.getName()).replace("%size%", String.valueOf(f.length()/1024)));
                  return true;
              }
          }
          EOF

          # DeleteJsonCommand
          cat > src/main/java/com/mamad396/jsonpaster/DeleteJsonCommand.java << 'EOF'
          package com.mamad396.jsonpaster;
          import org.bukkit.command.*;
          import java.io.File;
          public class DeleteJsonCommand implements CommandExecutor {
              private final JsonPaster plugin;
              public DeleteJsonCommand(JsonPaster p) { this.plugin = p; }
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (args.length < 1) return true;
                  String fn = args[0];
                  if (!fn.endsWith(".json")) fn += ".json";
                  File f = new File(plugin.getDataFolder(), fn);
                  if (f.delete()) sender.sendMessage(plugin.getConfigManager().getMessage("delete-success").replace("%file%", fn));
                  else sender.sendMessage(plugin.getConfigManager().getMessage("delete-error").replace("%file%", fn));
                  return true;
              }
          }
          EOF

          # InfoJsonCommand
          cat > src/main/java/com/mamad396/jsonpaster/InfoJsonCommand.java << 'EOF'
          package com.mamad396.jsonpaster;
          import org.bukkit.command.*;
          import java.io.File;
          import java.nio.file.*;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          public class InfoJsonCommand implements CommandExecutor {
              private final JsonPaster plugin;
              public InfoJsonCommand(JsonPaster p) { this.plugin = p; }
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (args.length < 1) return true;
                  String fn = args[0];
                  if (!fn.endsWith(".json")) fn += ".json";
                  File f = new File(plugin.getDataFolder(), fn);
                  if (!f.exists()) { sender.sendMessage(plugin.getConfigManager().getMessage("paste-notfound").replace("%file%", fn)); return true; }
                  try {
                      String c = new String(Files.readAllBytes(f.toPath()));
                      int count = c.split("\\},\\{").length;
                      sender.sendMessage(plugin.getConfigManager().getMessage("info-header").replace("%file%", fn));
                      sender.sendMessage(plugin.getConfigManager().getMessage("info-blocks").replace("%blocks%", "~"+count));
                      sender.sendMessage(plugin.getConfigManager().getMessage("info-size").replace("%size%", String.valueOf(f.length()/1024)));
                      sender.sendMessage(plugin.getConfigManager().getMessage("info-date").replace("%date%", new SimpleDateFormat("yyyy-MM-dd HH:mm").format(new Date(f.lastModified()))));
                  } catch (Exception e) { sender.sendMessage("Error!"); }
                  return true;
              }
          }
          EOF

          # RotateJsonCommand
          cat > src/main/java/com/mamad396/jsonpaster/RotateJsonCommand.java << 'EOF'
          package com.mamad396.jsonpaster;
          import com.google.gson.*;
          import org.bukkit.command.*;
          import java.io.File;
          import java.nio.file.*;
          public class RotateJsonCommand implements CommandExecutor {
              private final JsonPaster plugin;
              public RotateJsonCommand(JsonPaster p) { this.plugin = p; }
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (args.length < 2) return true;
                  String fn = args[0];
                  if (!fn.endsWith(".json")) fn += ".json";
                  File f = new File(plugin.getDataFolder(), fn);
                  if (!f.exists()) { sender.sendMessage(plugin.getConfigManager().getMessage("paste-notfound").replace("%file%", fn)); return true; }
                  int angle;
                  try { angle = Integer.parseInt(args[1]); } catch (Exception e) {
                      sender.sendMessage(plugin.getConfigManager().getMessage("rotate-error")); return true;
                  }
                  if (angle != 90 && angle != 180 && angle != 270) {
                      sender.sendMessage(plugin.getConfigManager().getMessage("rotate-error")); return true;
                  }
                  try {
                      String content = new String(Files.readAllBytes(f.toPath()));
                      JsonArray arr = JsonParser.parseString(content).getAsJsonArray();
                      for (JsonElement e : arr) {
                          JsonObject obj = e.getAsJsonObject();
                          int x = obj.get("x").getAsInt();
                          int z = obj.get("z").getAsInt();
                          if (angle == 90) { obj.addProperty("x", -z); obj.addProperty("z", x); }
                          else if (angle == 180) { obj.addProperty("x", -x); obj.addProperty("z", -z); }
                          else { obj.addProperty("x", z); obj.addProperty("z", -x); }
                      }
                      Files.write(f.toPath(), new GsonBuilder().create().toJson(arr).getBytes());
                      sender.sendMessage(plugin.getConfigManager().getMessage("rotate-success").replace("%file%", fn).replace("%angle%", String.valueOf(angle)));
                  } catch (Exception e) { sender.sendMessage("Error: " + e.getMessage()); }
                  return true;
              }
          }
          EOF

          # MirrorJsonCommand
          cat > src/main/java/com/mamad396/jsonpaster/MirrorJsonCommand.java << 'EOF'
          package com.mamad396.jsonpaster;
          import com.google.gson.*;
          import org.bukkit.command.*;
          import java.io.File;
          import java.nio.file.*;
          public class MirrorJsonCommand implements CommandExecutor {
              private final JsonPaster plugin;
              public MirrorJsonCommand(JsonPaster p) { this.plugin = p; }
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (args.length < 2) return true;
                  String fn = args[0];
                  if (!fn.endsWith(".json")) fn += ".json";
                  File f = new File(plugin.getDataFolder(), fn);
                  if (!f.exists()) { sender.sendMessage(plugin.getConfigManager().getMessage("paste-notfound").replace("%file%", fn)); return true; }
                  String axis = args[1].toLowerCase();
                  if (!axis.equals("x") && !axis.equals("z")) {
                      sender.sendMessage(plugin.getConfigManager().getMessage("mirror-error")); return true;
                  }
                  try {
                      String content = new String(Files.readAllBytes(f.toPath()));
                      JsonArray arr = JsonParser.parseString(content).getAsJsonArray();
                      for (JsonElement e : arr) {
                          JsonObject obj = e.getAsJsonObject();
                          if (axis.equals("x")) obj.addProperty("x", -obj.get("x").getAsInt());
                          else obj.addProperty("z", -obj.get("z").getAsInt());
                      }
                      Files.write(f.toPath(), new GsonBuilder().create().toJson(arr).getBytes());
                      sender.sendMessage(plugin.getConfigManager().getMessage("mirror-success").replace("%file%", fn).replace("%axis%", axis));
                  } catch (Exception e) { sender.sendMessage("Error: " + e.getMessage()); }
                  return true;
              }
          }
          EOF

          # ReplaceJsonCommand
          cat > src/main/java/com/mamad396/jsonpaster/ReplaceJsonCommand.java << 'EOF'
          package com.mamad396.jsonpaster;
          import com.google.gson.*;
          import org.bukkit.command.*;
          import java.io.File;
          import java.nio.file.*;
          public class ReplaceJsonCommand implements CommandExecutor {
              private final JsonPaster plugin;
              public ReplaceJsonCommand(JsonPaster p) { this.plugin = p; }
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (args.length < 3) return true;
                  String fn = args[0];
                  if (!fn.endsWith(".json")) fn += ".json";
                  File f = new File(plugin.getDataFolder(), fn);
                  if (!f.exists()) { sender.sendMessage(plugin.getConfigManager().getMessage("paste-notfound").replace("%file%", fn)); return true; }
                  String from = args[1].toUpperCase();
                  String to = args[2].toUpperCase();
                  try {
                      String content = new String(Files.readAllBytes(f.toPath()));
                      JsonArray arr = JsonParser.parseString(content).getAsJsonArray();
                      int count = 0;
                      for (JsonElement e : arr) {
                          JsonObject obj = e.getAsJsonObject();
                          if (obj.get("block").getAsString().equalsIgnoreCase(from)) {
                              obj.addProperty("block", to); count++;
                          }
                      }
                      Files.write(f.toPath(), new GsonBuilder().create().toJson(arr).getBytes());
                      sender.sendMessage(plugin.getConfigManager().getMessage("replace-success").replace("%count%", String.valueOf(count)).replace("%from%", from).replace("%to%", to));
                  } catch (Exception e) { sender.sendMessage("Error: " + e.getMessage()); }
                  return true;
              }
          }
          EOF

          # PreviewJsonCommand
          cat > src/main/java/com/mamad396/jsonpaster/PreviewJsonCommand.java << 'EOF'
          package com.mamad396.jsonpaster;
          import org.bukkit.*;
          import org.bukkit.command.*;
          import org.bukkit.entity.Player;
          import java.io.File;
          import java.nio.file.*;
          public class PreviewJsonCommand implements CommandExecutor {
              private final JsonPaster plugin;
              public PreviewJsonCommand(JsonPaster p) { this.plugin = p; }
              @Override
              public boolean onCommand(CommandSender sender, Command cmd, String label, String[] args) {
                  if (!(sender instanceof Player)) return true;
                  Player p = (Player) sender;
                  if (args.length < 1) return true;
                  String fn = args[0];
                  if (!fn.endsWith(".json")) fn += ".json";
                  File f = new File(plugin.getDataFolder(), fn);
                  if (!f.exists()) { p.sendMessage(plugin.getConfigManager().getMessage("paste-notfound").replace("%file%", fn)); return true; }
                  try {
                      String content = new String(Files.readAllBytes(f.toPath())).trim();
                      if (content.startsWith("[")) content = content.substring(1);
                      if (content.endsWith("]")) content = content.substring(0, content.length()-1);
                      String[] blocks = content.split("\\},\\{");
                      int minX=0,minY=0,minZ=0,maxX=0,maxY=0,maxZ=0,count=0;
                      for (String bs : blocks) {
                          bs = bs.replace("{","").replace("}","").trim();
                          if (bs.isEmpty()) continue;
                          int x=0,y=0,z=0;
                          for (String part : bs.split(",")) {
                              int cp = part.indexOf(":");
                              if (cp<0) continue;
                              String key = part.substring(0,cp).trim().replace("\"","");
                              int val = Integer.parseInt(part.substring(cp+1).trim().replace("\"",""));
                              if (key.equals("x")) x=val;
                              else if (key.equals("y")) y=val;
                              else if (key.equals("z")) z=val;
                          }
                          if (count==0) { minX=maxX=x; minY=maxY=y; minZ=maxZ=z; }
                          else { minX=Math.min(minX,x); maxX=Math.max(maxX,x); minY=Math.min(minY,y); maxY=Math.max(maxY,y); minZ=Math.min(minZ,z); maxZ=Math.max(maxZ,z); }
                          count++;
                      }
                      String size = (maxX-minX+1) + "x" + (maxY-minY+1) + "x" + (maxZ-minZ+1);
                      p.sendMessage(plugin.getConfigManager().getMessage("preview-header").replace("%file%", fn).replace("%count%", String.valueOf(count)));
                      p.sendMessage(plugin.getConfigManager().getMessage("preview-size").replace("%size%", size));
                  } catch (Exception e) { p.sendMessage("Error: " + e.getMessage()); }
                  return true;
              }
          }
          EOF

