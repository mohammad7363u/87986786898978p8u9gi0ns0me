      - name: Create EasyMCCore.java
        run: |
          cat > src/main/java/com/mamad396/easymc/EasyMCCore.java << 'EOF'
          package com.mamad396.easymc;

          import org.bukkit.Bukkit;
          import org.bukkit.ChatColor;
          import org.bukkit.plugin.java.JavaPlugin;
          import java.util.List;

          public class EasyMCCore extends JavaPlugin {
              private static EasyMCCore instance;
              
              @Override
              public void onEnable() {
                  instance = this;
                  saveDefaultConfig();
                  
                  // Register commands
                  getCommand("easymc").setExecutor(new MainCommand(this));
                  
                  // Register listeners if modules enabled
                  if (getConfig().getBoolean("modules.kill-messages", true))
                      getServer().getPluginManager().registerEvents(new KillListener(this), this);
                  if (getConfig().getBoolean("modules.anti-auto-totem", true))
                      getServer().getPluginManager().registerEvents(new AntiTotemListener(this), this);
                  if (getConfig().getBoolean("modules.quest-system", true))
                      getServer().getPluginManager().registerEvents(new QuestListener(this), this);
                  if (getConfig().getBoolean("modules.clearlag", true))
                      new ClearLagTask(this).runTaskTimer(this, 20L, 20L * getConfig().getInt("clearlag.interval-seconds", 100));
                  
                  printLoadMessage();
              }
              
              private void printLoadMessage() {
                  List<String> msg = getConfig().getStringList("load-message");
                  if (msg != null) for (String line : msg)
                      Bukkit.getConsoleSender().sendMessage(ChatColor.translateAlternateColorCodes('&', line));
                  getLogger().info("Enabled successfully!");
              }
              
              public static EasyMCCore getInstance() { return instance; }
              public String getMsg(String path) {
                  return ChatColor.translateAlternateColorCodes('&', getConfig().getString("prefix", "") + " " + getConfig().getString(path, ""));
              }
              public String getMsgRaw(String path) {
                  return ChatColor.translateAlternateColorCodes('&', getConfig().getString(path, ""));
              }
          }
          EOF

      - name: Create all Java files
        run: |
          # MainCommand
          cat > src/main/java/com/mamad396/easymc/MainCommand.java << 'EOF'
          package com.mamad396.easymc;
          import org.bukkit.command.*;
          import org.bukkit.entity.Player;
          public class MainCommand implements CommandExecutor {
              private final EasyMCCore plugin;
              public MainCommand(EasyMCCore p) { this.plugin = p; }
              public boolean onCommand(CommandSender s, Command c, String l, String[] a) {
                  if (a.length == 0 || a[0].equalsIgnoreCase("help")) {
                      s.sendMessage(plugin.getMsgRaw("prefix") + " &6Commands:");
                      s.sendMessage("  &e/easymc reload &7- Reload config");
                      s.sendMessage("  &e/easymc info &7- Plugin info");
                      return true;
                  }
                  if (a[0].equalsIgnoreCase("reload")) {
                      plugin.reloadConfig();
                      s.sendMessage(plugin.getMsg("prefix") + " &aConfig reloaded!");
                  }
                  return true;
              }
          }
          EOF

          # KillListener
          cat > src/main/java/com/mamad396/easymc/KillListener.java << 'EOF'
          package com.mamad396.easymc;
          import org.bukkit.*;
          import org.bukkit.entity.Player;
          import org.bukkit.event.*;
          import org.bukkit.event.entity.PlayerDeathEvent;
          import org.bukkit.event.player.PlayerRespawnEvent;
          import org.bukkit.inventory.ItemStack;
          import java.util.*;
          public class KillListener implements Listener {
              private final EasyMCCore plugin;
              public KillListener(EasyMCCore p) { this.plugin = p; }
              
              @EventHandler
              public void onDeath(PlayerDeathEvent e) {
                  Player v = e.getEntity();
                  Player k = v.getKiller();
                  String cause = v.getLastDamageCause() != null ? v.getLastDamageCause().getCause().name() : "UNKNOWN";
                  
                  if (k != null && k != v) {
                      String weapon = k.getInventory().getItemInMainHand().getType().name().replace("_", " ");
                      List<String> msgs = plugin.getConfig().getStringList("kill-messages.messages");
                      String msg = msgs.get(new Random().nextInt(msgs.size()));
                      msg = plugin.getMsgRaw("kill-messages.prefix") + " " + msg.replace("%killer%", k.getName()).replace("%victim%", v.getName()).replace("%weapon%", "&e" + weapon);
                      e.setDeathMessage(ChatColor.translateAlternateColorCodes('&', msg));
                      if (plugin.getConfig().getBoolean("modules.death-skull", true))
                          v.getWorld().dropItemNaturally(v.getLocation(), new ItemStack(Material.PLAYER_HEAD));
                  } else {
                      String dm = plugin.getConfig().getString("kill-messages.natural-death-messages." + cause, "&fUnknown");
                      String msg = plugin.getMsgRaw("kill-messages.prefix") + " &7" + v.getName() + " &4died &8[&c" + dm + "&8]";
                      e.setDeathMessage(ChatColor.translateAlternateColorCodes('&', msg));
                  }
              }
              
              @EventHandler
              public void onRespawn(PlayerRespawnEvent e) {
                  Player p = e.getPlayer();
                  p.sendTitle(
                      plugin.getMsgRaw("kill-messages.respawn-title"),
                      plugin.getMsgRaw("kill-messages.respawn-subtitle"),
                      10, 40, 10
                  );
              }
          }
          EOF

          # AntiTotemListener
          cat > src/main/java/com/mamad396/easymc/AntiTotemListener.java << 'EOF'
          package com.mamad396.easymc;
          import org.bukkit.Material;
          import org.bukkit.entity.Player;
          import org.bukkit.event.*;
          import org.bukkit.event.inventory.InventoryClickEvent;
          import org.bukkit.event.player.PlayerInteractEvent;
          import java.util.*;
          public class AntiTotemListener implements Listener {
              private final EasyMCCore plugin;
              private final Map<UUID, Long> lastClick = new HashMap<>();
              private final Map<UUID, Integer> cpsCount = new HashMap<>();
              private final Map<UUID, Integer> flags = new HashMap<>();
              
              public AntiTotemListener(EasyMCCore p) { this.plugin = p; }
              
              @EventHandler
              public void onClick(InventoryClickEvent e) {
                  if (!(e.getWhoClicked() instanceof Player)) return;
                  Player p = (Player) e.getWhoClicked();
                  if (e.getCurrentItem() == null || e.getCurrentItem().getType() != Material.TOTEM_OF_UNDYING) return;
                  
                  long now = System.currentTimeMillis();
                  Long last = lastClick.get(p.getUniqueId());
                  if (last != null && now - last < 50) {
                      int f = flags.getOrDefault(p.getUniqueId(), 0) + 1;
                      flags.put(p.getUniqueId(), f);
                      int max = plugin.getConfig().getInt("anti-totem.max-flags-before-kick", 8);
                      if (f >= max) {
                          p.kickPlayer(plugin.getMsgRaw("anti-totem.kick-message"));
                          flags.remove(p.getUniqueId());
                          return;
                      }
                      p.sendMessage(plugin.getMsg("anti-totem.prefix") + " §cAuto Totem! [§c" + f + "§7/§c" + max + "§7]");
                  }
                  lastClick.put(p.getUniqueId(), now);
              }
          }
          EOF

          # QuestListener
          cat > src/main/java/com/mamad396/easymc/QuestListener.java << 'EOF'
          package com.mamad396.easymc;
          import org.bukkit.Bukkit;
          import org.bukkit.Material;
          import org.bukkit.entity.Player;
          import org.bukkit.event.*;
          import org.bukkit.event.block.BlockBreakEvent;
          import org.bukkit.event.entity.PlayerDeathEvent;
          import java.util.*;
          public class QuestListener implements Listener {
              private final EasyMCCore plugin;
              private final Map<UUID, Integer> mineProgress = new HashMap<>();
              private final Map<UUID, Integer> killProgress = new HashMap<>();
              private final Set<UUID> minerDone = new HashSet<>();
              private final Set<UUID> killerDone = new HashSet<>();
              private final Set<UUID> advancedDone = new HashSet<>();
              
              public QuestListener(EasyMCCore p) { this.plugin = p; }
              
              @EventHandler
              public void onBreak(BlockBreakEvent e) {
                  Material m = e.getBlock().getType();
                  if (m.name().contains("ORE") || m.name().contains("STONE") || m == Material.DEEPSLATE || m == Material.NETHERRACK) {
                      UUID id = e.getPlayer().getUniqueId();
                      int prog = mineProgress.getOrDefault(id, 0) + 1;
                      mineProgress.put(id, prog);
                      int target = plugin.getConfig().getInt("quest.miner-target", 50000);
                      if (!minerDone.contains(id) && prog >= target) {
                          minerDone.add(id);
                          giveReward(e.getPlayer(), "Miner");
                      }
                  }
              }
              
              @EventHandler
              public void onKill(PlayerDeathEvent e) {
                  Player k = e.getEntity().getKiller();
                  if (k == null) return;
                  UUID id = k.getUniqueId();
                  int prog = killProgress.getOrDefault(id, 0) + 1;
                  killProgress.put(id, prog);
                  int target = plugin.getConfig().getInt("quest.killer-target", 20);
                  if (!killerDone.contains(id) && prog >= target) {
                      killerDone.add(id);
                      giveReward(k, "Killer");
                  }
              }
              
              private void giveReward(Player p, String quest) {
                  String cmd = plugin.getConfig().getString("quest.reward-command", "say %player% completed %quest%!").replace("%player%", p.getName()).replace("%quest%", quest);
                  Bukkit.dispatchCommand(Bukkit.getConsoleSender(), cmd);
                  p.sendMessage(plugin.getMsg("quest.prefix") + " §aQuest Complete: §e" + quest + " §a! Reward given!");
                  p.sendTitle("§6⚔ QUEST COMPLETE! ⚔", "§7" + quest + " Quest Complete!", 10, 60, 10);
              }
          }
          EOF

          # ClearLagTask
          cat > src/main/java/com/mamad396/easymc/ClearLagTask.java << 'EOF'
          package com.mamad396.easymc;
          import org.bukkit.Bukkit;
          import org.bukkit.entity.Item;
          import org.bukkit.scheduler.BukkitRunnable;
          public class ClearLagTask extends BukkitRunnable {
              private final EasyMCCore plugin;
              public ClearLagTask(EasyMCCore p) { this.plugin = p; }
              public void run() {
                  int count = 0;
                  for (org.bukkit.World w : Bukkit.getWorlds())
                      for (Item i : w.getEntitiesByClass(Item.class)) { i.remove(); count++; }
                  if (count > 0 && plugin.getConfig().getBoolean("modules.clearlag", true))
                      Bukkit.broadcastMessage(plugin.getMsg("clearlag.prefix") + " §aCleared " + count + " items!");
              }
          }
          EOF

      - name: Create pom.xml
        run: |
          cat > pom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.mamad396</groupId>
              <artifactId>EasyMC-Core</artifactId>
              <version>1.0</version>
              <packaging>jar</packaging>
              <properties><java.version>17</java.version></properties>
              <repositories>
                  <repository><id>papermc</id><url>https://repo.papermc.io/repository/maven-public/</url></repository>
              </repositories>
              <dependencies>
                  <dependency><groupId>io.papermc.paper</groupId><artifactId>paper-api</artifactId><version>1.20.4-R0.1-SNAPSHOT</version><scope>provided</scope></dependency>
              </dependencies>
              <build><plugins><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId><version>3.11.0</version><configuration><source>17</source><target>17</target></configuration></plugin></plugins></build>
          </project>
          EOF

      - name: Build
        run: mvn clean package -B

      - name: Copy to releases
        run: cp target/EasyMC-Core-1.0.jar releases/

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add releases/EasyMC-Core-1.0.jar
          git commit -m "EasyMC-Core v1.0" || echo "No changes"
          git push

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyMC-Core
          path: target/EasyMC-Core-1.0.jar
